<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>VoxSculp v4 — Voice Spectral Reconstruction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(155deg, #13111f, #1b1726);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 12px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
        }
        
        .header {
            text-align: center;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }
        
        .header .subtitle {
            font-size: 11px;
            color: rgba(153, 68, 255, 0.6);
            margin-top: 2px;
        }
        
        .main {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        
        .left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        #canvas {
            width: 100%;
            flex: 1;
            background: rgba(153, 68, 255, 0.03);
            border: 1px solid rgba(153, 68, 255, 0.18);
            border-radius: 6px;
        }
        
        .controls {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 6px;
        }
        
        .group {
            background: rgba(153, 68, 255, 0.08);
            border: 1px solid rgba(153, 68, 255, 0.18);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .label {
            font-size: 10px;
            font-weight: 600;
            color: rgba(153, 68, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button {
            padding: 8px 10px;
            background: rgba(153, 68, 255, 0.12);
            border: 1px solid rgba(153, 68, 255, 0.3);
            color: #fff;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 600;
            text-transform: uppercase;
            -webkit-appearance: none;
        }
        
        button:active, button.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            color: #00ffff;
        }
        
        .status {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .status.ok { color: rgba(0, 255, 255, 0.7); }
        .status.error { color: rgba(255, 100, 100, 0.7); }
        .status.active { color: rgba(0, 255, 200, 0.9); animation: blink 1s infinite; }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(153, 68, 255, 0.2);
            border: none;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #00ffff, #9944ff);
            border: 1px solid #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #00ffff, #9944ff);
            border: 1px solid #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .meter-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 8px;
            background: rgba(153, 68, 255, 0.04);
            border: 1px solid rgba(153, 68, 255, 0.12);
            border-radius: 4px;
        }
        
        .meter {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .meter-label {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }
        
        .meter-bar {
            width: 24px;
            height: 30px;
            background: rgba(153, 68, 255, 0.1);
            border: 1px solid rgba(153, 68, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        .meter-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #00ffff, #9944ff);
            height: 0%;
            transition: height 0.05s;
        }
        
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .slider-value {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VOXSCULP v4</h1>
            <div class="subtitle">Spectral Voice Reconstruction</div>
        </div>
        
        <div class="main">
            <div class="left">
                <canvas id="canvas"></canvas>
                
                <div class="meter-panel">
                    <div class="meter">
                        <div class="meter-label">BODY</div>
                        <div class="meter-bar"><div class="meter-fill" id="meterBody"></div></div>
                    </div>
                    <div class="meter">
                        <div class="meter-label">FORM</div>
                        <div class="meter-bar"><div class="meter-fill" id="meterForm"></div></div>
                    </div>
                    <div class="meter">
                        <div class="meter-label">AIR</div>
                        <div class="meter-bar"><div class="meter-fill" id="meterAir"></div></div>
                    </div>
                    <div class="meter">
                        <div class="meter-label">NOISE</div>
                        <div class="meter-bar"><div class="meter-fill" id="meterNoise"></div></div>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <div class="group">
                    <div class="label">Input</div>
                    <button id="btnMic">◆ MIC</button>
                    <button id="btnStop">◾ STOP</button>
                    <div class="status" id="status">Ready</div>
                </div>
                
                <div class="group">
                    <div class="label">Mode</div>
                    <button id="btnAbstract">ABSTRACT</button>
                    <button id="btnOrganic">ORGANIC</button>
                    <button id="btnTextural">TEXTURAL</button>
                    <button id="btnInharmonic">INHARMONIC</button>
                </div>
                
                <div class="group">
                    <div class="slider-group">
                        <div class="label">Mutation</div>
                        <div class="slider-value">
                            <span>0</span>
                            <span id="mutValue">50</span>
                        </div>
                        <input type="range" id="mutation" min="0" max="100" value="50">
                    </div>
                </div>
                
                <div class="group">
                    <div class="slider-group">
                        <div class="label">Density</div>
                        <div class="slider-value">
                            <span>LOW</span>
                            <span id="denValue">40</span>
                        </div>
                        <input type="range" id="density" min="10" max="80" value="40" step="2">
                    </div>
                </div>
                
                <div class="group">
                    <div class="slider-group">
                        <div class="label">Texture</div>
                        <div class="slider-value">
                            <span>TONAL</span>
                            <span id="texValue">50</span>
                        </div>
                        <input type="range" id="texture" min="0" max="100" value="50">
                    </div>
                </div>
                
                <div class="group">
                    <div class="slider-group">
                        <div class="label">Space</div>
                        <div class="slider-value">
                            <span>MONO</span>
                            <span id="spaValue">50</span>
                        </div>
                        <input type="range" id="space" min="0" max="100" value="50">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // VOXSCULP v4 — Ultra-simple working version
        // ═══════════════════════════════════════════════════════════════

        class VoxSculp {
            constructor() {
                this.AC = null;
                this.stream = null;
                this.processor = null;
                this.analyser = null;
                this.isRunning = false;
                
                // State
                this.mode = 'organic';
                this.mutation = 0.5;
                this.density = 40;
                this.texture = 0.5;
                this.space = 0.5;
                
                // Spectral
                this.spectral = { body: 0, formant: 0, air: 0, noise: 0 };
                this.behavior = { intensity: 0, tension: 0, aggression: 0, air: 0 };
                this.prevSpectral = { body: 0, formant: 0, air: 0, noise: 0 };
                
                // Grain buffer
                this.grainBuffer = new Float32Array(16384);
                this.grainPos = 0;
                
                // Canvas
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();
                
                this.init();
            }
            
            async init() {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.AC = new AC();
                    
                    // Analyser
                    this.analyser = this.AC.createAnalyser();
                    this.analyser.fftSize = 2048;
                    
                    // Processor
                    this.processor = this.AC.createScriptProcessor(4096, 1, 2);
                    this.processor.onaudioprocess = (e) => this.onAudio(e);
                    
                    // Simple routing: processor → analyser → destination
                    this.processor.connect(this.analyser);
                    this.analyser.connect(this.AC.destination);
                    
                    // Resume if needed
                    if (this.AC.state === 'suspended') {
                        await this.AC.resume();
                    }
                    
                    this.setStatus('Ready', 'ok');
                    this.setupUI();
                    this.startDraw();
                    
                } catch (e) {
                    console.error(e);
                    this.setStatus('Init error: ' + e.message, 'error');
                }
            }
            
            setupUI() {
                document.getElementById('btnMic').addEventListener('click', () => this.startMic());
                document.getElementById('btnStop').addEventListener('click', () => this.stop());
                
                ['btnAbstract', 'btnOrganic', 'btnTextural', 'btnInharmonic'].forEach(id => {
                    document.getElementById(id).addEventListener('click', (e) => {
                        document.querySelectorAll('[id^="btn"][id$="stract"], [id$="rganic"], [id$="xtural"], [id$="nharmonic"]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.mode = id.replace('btn', '').toLowerCase();
                    });
                });
                
                document.getElementById('mutation').addEventListener('input', (e) => {
                    this.mutation = parseInt(e.target.value) / 100;
                    document.getElementById('mutValue').textContent = e.target.value;
                });
                
                document.getElementById('density').addEventListener('input', (e) => {
                    this.density = parseInt(e.target.value);
                    document.getElementById('denValue').textContent = e.target.value;
                });
                
                document.getElementById('texture').addEventListener('input', (e) => {
                    this.texture = parseInt(e.target.value) / 100;
                    document.getElementById('texValue').textContent = e.target.value;
                });
                
                document.getElementById('space').addEventListener('input', (e) => {
                    this.space = parseInt(e.target.value) / 100;
                    document.getElementById('spaValue').textContent = e.target.value;
                });
                
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            async startMic() {
                try {
                    this.AC.resume();
                    this.setStatus('Requesting mic...', 'ok');
                    
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                    
                    const source = this.AC.createMediaStreamAudioSource(this.stream);
                    source.connect(this.processor);
                    
                    this.isRunning = true;
                    this.setStatus('LISTENING', 'active');
                    
                } catch (e) {
                    console.error(e);
                    this.setStatus('Mic error: ' + e.message, 'error');
                }
            }
            
            stop() {
                if (this.stream) {
                    this.stream.getTracks().forEach(t => t.stop());
                }
                this.isRunning = false;
                this.setStatus('Stopped', 'ok');
            }
            
            onAudio(e) {
                const input = e.inputBuffer.getChannelData(0);
                const outL = e.outputBuffer.getChannelData(0);
                const outR = e.outputBuffer.getChannelData(1);
                
                // FFT
                const fft = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(fft);
                
                // Decompose
                this.analyzeSpectral(fft);
                
                // Process
                const grainLen = Math.floor((this.density / 100) * (this.AC.sampleRate * 0.08));
                
                // Write to grain buffer
                this.grainBuffer.set(input, this.grainPos);
                this.grainPos = (this.grainPos + input.length) % this.grainBuffer.length;
                
                // Process each sample
                for (let i = 0; i < input.length; i++) {
                    const dry = input[i];
                    
                    // Read grain
                    const rPos = (this.grainPos + Math.random() * grainLen) % this.grainBuffer.length | 0;
                    let wet = this.grainBuffer[rPos];
                    
                    // Mode modulation
                    if (this.mode === 'abstract') {
                        wet *= (1 + Math.sin(i * 0.05 + Math.random() * 2) * 0.4);
                    } else if (this.mode === 'organic') {
                        wet *= (1 + Math.sin(i * 0.02) * 0.2);
                    } else if (this.mode === 'textural') {
                        wet = wet * 0.6 + (Math.random() - 0.5) * 0.4 * this.texture;
                    } else if (this.mode === 'inharmonic') {
                        wet *= Math.cos(i * (0.03 + Math.random() * 0.02));
                    }
                    
                    // Mix
                    const mix = dry * (1 - this.mutation) + wet * this.mutation;
                    outL[i] = mix * (1 - this.space * 0.3);
                    outR[i] = mix * (1 + this.space * 0.2);
                }
            }
            
            analyzeSpectral(fft) {
                const freqRes = this.AC.sampleRate / 2 / fft.length;
                let body = 0, form = 0, air = 0, noise = 0, total = 0;
                
                const bodyBins = Math.ceil(300 / freqRes);
                const formBins = Math.ceil(2500 / freqRes);
                const airBins = Math.ceil(8000 / freqRes);
                
                for (let i = 0; i < fft.length; i++) {
                    const v = fft[i];
                    total += v;
                    if (i < bodyBins) body += v;
                    else if (i < formBins) form += v;
                    else if (i < airBins) air += v;
                    else noise += v;
                }
                
                const norm = total > 0 ? total : 1;
                this.spectral = {
                    body: body / norm,
                    formant: form / norm,
                    air: air / norm,
                    noise: noise / norm
                };
                
                // Behavior
                const dBody = Math.abs(this.spectral.body - this.prevSpectral.body);
                const dForm = Math.abs(this.spectral.formant - this.prevSpectral.formant);
                const dAir = Math.abs(this.spectral.air - this.prevSpectral.air);
                
                this.behavior = {
                    intensity: Math.min(1, (total / 255 / fft.length) * 2),
                    tension: Math.min(1, (dBody + dForm + dAir) * 5),
                    aggression: Math.min(1, (this.spectral.air + dAir) * 1.5),
                    air: this.spectral.noise
                };
                
                this.prevSpectral = this.spectral;
                
                // Meters
                document.getElementById('meterBody').style.height = (this.spectral.body * 100) + '%';
                document.getElementById('meterForm').style.height = (this.spectral.formant * 100) + '%';
                document.getElementById('meterAir').style.height = (this.spectral.air * 100) + '%';
                document.getElementById('meterNoise').style.height = (this.spectral.noise * 100) + '%';
            }
            
            startDraw() {
                const loop = () => {
                    this.draw();
                    requestAnimationFrame(loop);
                };
                loop();
            }
            
            draw() {
                const w = this.canvas.width / window.devicePixelRatio;
                const h = this.canvas.height / window.devicePixelRatio;
                
                this.ctx.fillStyle = 'rgba(19, 17, 31, 0.1)';
                this.ctx.fillRect(0, 0, w, h);
                
                const cx = w / 2;
                const cy = h / 2;
                const r = Math.min(w, h) * 0.3;
                
                // Rings
                this.ctx.strokeStyle = `rgba(153, 68, 255, ${this.behavior.intensity * 0.6})`;
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, r * this.behavior.intensity, 0, Math.PI * 2);
                this.ctx.stroke();
                
                this.ctx.strokeStyle = `rgba(0, 255, 255, ${this.behavior.tension * 0.6})`;
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, r * 0.7 + this.behavior.tension * 10, 0, Math.PI * 2);
                this.ctx.stroke();
                
                this.ctx.strokeStyle = `rgba(255, 0, 255, ${this.behavior.aggression * 0.6})`;
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, r * 0.5 + this.behavior.aggression * 15, 0, Math.PI * 2);
                this.ctx.stroke();
                
                // Particles
                this.ctx.fillStyle = `rgba(100, 255, 200, ${this.behavior.air * 0.8})`;
                for (let i = 0; i < Math.floor(this.behavior.air * 50); i++) {
                    const a = (i / 50) * Math.PI * 2 + Date.now() * 0.0005;
                    const rad = r * 0.3 + Math.random() * 20;
                    const x = cx + Math.cos(a) * rad;
                    const y = cy + Math.sin(a) * rad;
                    this.ctx.fillRect(x - 1, y - 1, 2, 2);
                }
                
                // Orb
                const g = this.ctx.createRadialGradient(cx, cy, 0, cx, cy, 15);
                g.addColorStop(0, `rgba(255, 255, 255, ${0.3 + this.behavior.intensity * 0.4})`);
                g.addColorStop(1, 'rgba(153, 68, 255, 0.1)');
                this.ctx.fillStyle = g;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, 15 + this.behavior.tension * 5, 0, Math.PI * 2);
                this.ctx.fill();
            }
            
            resizeCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            
            setStatus(msg, type) {
                const el = document.getElementById('status');
                el.textContent = msg;
                el.className = 'status ' + type;
            }
        }
        
        window.addEventListener('load', () => {
            new VoxSculp();
        });
    </script>
</body>
</html>
