name: CITHELA commercial readiness safety checks
on:
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/commercial-readiness.test.mjs'
      - 'cithela/sql-review/commercial-onboarding-gate.sql'
      - '.github/workflows/cithela-commercial-readiness.yml'
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/commercial-readiness.test.mjs'
      - 'cithela/sql-review/commercial-onboarding-gate.sql'
      - '.github/workflows/cithela-commercial-readiness.yml'
permissions:
  contents: read
jobs:
  validate-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/commercial-readiness.test.mjs
