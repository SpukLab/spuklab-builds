name: CITHELA formularios multirrubro (prototipo)
on:
  push:
    paths:
      - 'cithela/formularios/**'
      - '.github/workflows/cithela-formularios.yml'
  pull_request:
    paths:
      - 'cithela/formularios/**'
      - '.github/workflows/cithela-formularios.yml'
permissions:
  contents: read
jobs:
  model-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cithela/formularios/form-model.mjs
      - run: node --check cithela/formularios/prototype.mjs
      - run: node --check cithela/formularios/presets.mjs
      - run: node --check cithela/formularios/presets.test.mjs
      - run: node --check cithela/formularios/form-model.test.mjs
      - run: node --check cithela/formularios/isolation.test.mjs
      - run: node --test cithela/formularios/form-model.test.mjs cithela/formularios/isolation.test.mjs cithela/formularios/presets.test.mjs
