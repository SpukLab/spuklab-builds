name: CITHELA template backend SQL review
on:
  push:
    paths:
      - 'cithela/sql-review/form-templates-rpc-20261120.*'
      - 'cithela/docs/form-templates-backend-review-20261120.md'
      - '.github/workflows/cithela-form-templates-backend-review.yml'
  pull_request:
    paths:
      - 'cithela/sql-review/form-templates-rpc-20261120.*'
      - 'cithela/docs/form-templates-backend-review-20261120.md'
      - '.github/workflows/cithela-form-templates-backend-review.yml'
permissions:
  contents: read
jobs:
  static-security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cithela/sql-review/form-templates-rpc-20261120.test.mjs
      - run: node --test cithela/sql-review/form-templates-rpc-20261120.test.mjs
