name: CITHELA commercial foundation (disabled)
on:
  pull_request:
    paths:
      - 'cithela/commercial/**'
      - '.github/workflows/cithela-commercial-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix cithela/commercial --ignore-scripts --no-audit --no-fund
      - run: node --test cithela/commercial/*.test.mjs
