name: CITHELA test-only subscription consent
on:
  pull_request:
    paths:
      - 'cithela/payments/mercadopago-test-intent-handler.mjs'
      - 'cithela/edge/cithela-mp-test-intent/index.ts'
      - 'cithela/supabase/mercadopago-authorized-test-intent-20261103.sql'
      - 'cithela/mercadopago-test-intent.test.mjs'
      - '.github/workflows/cithela-mp-test-intent.yml'
  push:
    paths:
      - 'cithela/payments/mercadopago-test-intent-handler.mjs'
      - 'cithela/edge/cithela-mp-test-intent/index.ts'
      - 'cithela/supabase/mercadopago-authorized-test-intent-20261103.sql'
      - 'cithela/mercadopago-test-intent.test.mjs'
      - '.github/workflows/cithela-mp-test-intent.yml'
permissions:
  contents: read
jobs:
  validate-consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/mercadopago-test-intent.test.mjs cithela/mercadopago-subscription-intent.test.mjs cithela/mercadopago-webhook-inbox.test.mjs
