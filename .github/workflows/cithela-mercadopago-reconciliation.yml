name: CITHELA Mercado Pago reconciliation
on:
  pull_request:
    paths:
      - 'cithela/payments/mercadopago-reconciliation.mjs'
      - 'cithela/mercadopago-reconciliation.test.mjs'
      - '.github/workflows/cithela-mercadopago-reconciliation.yml'
  push:
    paths:
      - 'cithela/payments/mercadopago-reconciliation.mjs'
      - 'cithela/mercadopago-reconciliation.test.mjs'
      - '.github/workflows/cithela-mercadopago-reconciliation.yml'
permissions:
  contents: read
jobs:
  read-only-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/mercadopago-reconciliation.test.mjs
