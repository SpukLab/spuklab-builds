name: CITHELA account modules and expiry safety
on:
  push:
    paths:
      - 'cithela/commercial/account-packages.test.mjs'
      - 'cithela/commercial/commercial-admin-handler.mjs'
      - 'cithela/comercial-admin.html'
      - 'cithela/edge/cithela-commercial-admin/index.ts'
      - 'cithela/supabase/cithela_account_packages_20261117.sql'
      - '.github/workflows/cithela-account-modules.yml'
  pull_request:
    paths:
      - 'cithela/commercial/account-packages.test.mjs'
      - 'cithela/commercial/commercial-admin-handler.mjs'
      - 'cithela/comercial-admin.html'
      - 'cithela/edge/cithela-commercial-admin/index.ts'
      - 'cithela/supabase/cithela_account_packages_20261117.sql'
      - '.github/workflows/cithela-account-modules.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cithela/commercial/commercial-admin-handler.mjs
      - run: node --check cithela/commercial/account-packages.test.mjs
      - run: node --test cithela/commercial/account-packages.test.mjs
