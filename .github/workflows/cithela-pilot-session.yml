name: CITHELA pilot subscription session
on:
  pull_request:
    paths:
      - 'cithela/suscripcion-prueba.html'
      - 'cithela/suscripcion-prueba-session.test.mjs'
      - '.github/workflows/cithela-pilot-session.yml'
  push:
    branches: [main]
    paths:
      - 'cithela/suscripcion-prueba.html'
      - 'cithela/suscripcion-prueba-session.test.mjs'
      - '.github/workflows/cithela-pilot-session.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/suscripcion-prueba-session.test.mjs
