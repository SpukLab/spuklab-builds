name: CITHELA identity and session regression
on:
  pull_request:
    paths: ['cithela/**', '.github/workflows/cithela-identity-session.yml']
  push:
    branches: [main]
    paths: ['cithela/**', '.github/workflows/cithela-identity-session.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/*.test.mjs
      - name: Install isolated PostgreSQL test runtime
        run: npm ci --prefix cithela/test-db --ignore-scripts --no-audit --no-fund
      - name: Verify concurrent admissions and trial expiry in PostgreSQL
        run: node --test cithela/test-db/concurrency.test.mjs
