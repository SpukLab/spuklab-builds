name: CITHELA vacaciones y bloqueos prolongados
on:
  push:
    paths:
      - 'cithela/availability/**'
      - 'cithela/index.html'
      - '.github/workflows/cithela-availability-ranges.yml'
  pull_request:
    paths:
      - 'cithela/availability/**'
      - 'cithela/index.html'
      - '.github/workflows/cithela-availability-ranges.yml'
permissions:
  contents: read
jobs:
  range-and-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify range planner, inline script, UI integration and DST
        run: |
          node --check cithela/availability/ranges.js
          node --check cithela/availability/browser-smoke.cjs
          node --test cithela/availability/ranges.test.mjs
          node --test cithela/availability/cloud-save.test.mjs
      - name: Install isolated browser
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Mobile, tablet and desktop blocked-date UX
        run: node cithela/availability/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cithela-vacaciones-responsive
          path: cithela-vacaciones-*.png
          retention-days: 7
