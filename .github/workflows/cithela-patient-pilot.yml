name: CITHELA patient email pilot
on:
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/patient-pilot.test.mjs'
      - 'cithela/sdk-retry.test.mjs'
      - '.github/workflows/cithela-patient-pilot.yml'
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/patient-pilot.test.mjs'
      - '.github/workflows/cithela-patient-pilot.yml'
permissions:
  contents: read
jobs:
  validate-patient-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/patient-pilot.test.mjs cithela/sdk-retry.test.mjs
