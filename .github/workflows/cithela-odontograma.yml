name: CITHELA odontograma demo

on:
  pull_request:
    paths:
      - 'cithela/odontograma-demo.html'
      - 'cithela/odontograma-demo.test.mjs'
      - '.github/workflows/cithela-odontograma.yml'
  push:
    branches: [main]
    paths:
      - 'cithela/odontograma-demo.html'
      - 'cithela/odontograma-demo.test.mjs'
      - '.github/workflows/cithela-odontograma.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/odontograma-demo.test.mjs
