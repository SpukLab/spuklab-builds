name: CITHELA webhook source contract
on:
  pull_request:
    paths:
      - 'cithela/edge/cithela-whatsapp-webhook/**'
      - '.github/workflows/cithela-webhook-contract.yml'
  push:
    paths:
      - 'cithela/edge/cithela-whatsapp-webhook/**'
      - '.github/workflows/cithela-webhook-contract.yml'
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/edge/cithela-whatsapp-webhook/webhook-contract.test.mjs
