name: CITHELA ficha cloud agrupada
on:
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/cloud-person-profile-groups.test.mjs'
      - '.github/workflows/cithela-cloud-person-profile-groups.yml'
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/cloud-person-profile-groups.test.mjs'
      - '.github/workflows/cithela-cloud-person-profile-groups.yml'
permissions:
  contents: read
jobs:
  grouped-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/cloud-person-profile-groups.test.mjs
      - run: node --test cithela/person-intake-ux.test.mjs
