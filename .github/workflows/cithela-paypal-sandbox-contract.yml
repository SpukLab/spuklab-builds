name: CITHELA PayPal USD sandbox contract
on:
  pull_request:
    paths:
      - 'cithela/payments/paypal-sandbox-*.mjs'
      - 'cithela/paypal-sandbox-*.test.mjs'
      - 'cithela/sql-review/paypal-usd-catalog-review-20261116.sql'
      - '.github/workflows/cithela-paypal-sandbox-contract.yml'
  push:
    paths:
      - 'cithela/payments/paypal-sandbox-*.mjs'
      - 'cithela/paypal-sandbox-*.test.mjs'
      - '.github/workflows/cithela-paypal-sandbox-contract.yml'
permissions:
  contents: read
jobs:
  validate-paypal-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/paypal-sandbox-*.test.mjs
