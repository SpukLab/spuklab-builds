name: SpukLab Hub commercial pages
on:
  pull_request:
    paths:
      - "hub/**"
      - ".github/workflows/hub-commercial-pages.yml"
  push:
    branches: [main]
    paths:
      - "hub/**"
      - ".github/workflows/hub-commercial-pages.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate commercial page links and safety claims
        run: node --test hub/tests/commercial-pages.test.mjs
