name: CITHELA WhatsApp outbound safety
on:
  pull_request:
    paths:
      - 'cithela/edge/cithela-whatsapp-send/**'
      - '.github/workflows/cithela-whatsapp-send.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/edge/cithela-whatsapp-send/send.test.mjs
