name: CITHELA USA Taxes public demo check
on:
  push:
    paths:
      - 'cithela/international/taxes-public-smoke.cjs'
      - '.github/workflows/cithela-taxes-public-smoke.yml'
  pull_request:
    paths:
      - 'cithela/international/taxes-public-smoke.cjs'
      - '.github/workflows/cithela-taxes-public-smoke.yml'
permissions:
  contents: read
jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cithela/international/taxes-public-smoke.cjs
