name: CITHELA first-run onboarding checks
on:
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/first-run.test.mjs'
      - '.github/workflows/cithela-first-run.yml'
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/first-run.test.mjs'
      - '.github/workflows/cithela-first-run.yml'
permissions:
  contents: read
jobs:
  check-first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/first-run.test.mjs
