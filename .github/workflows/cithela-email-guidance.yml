name: CITHELA auth email guidance
on:
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/reservar.html'
      - 'cithela/alta-autoservicio.html'
      - 'cithela/email-guidance.test.mjs'
      - '.github/workflows/cithela-email-guidance.yml'
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/reservar.html'
      - 'cithela/alta-autoservicio.html'
      - 'cithela/email-guidance.test.mjs'
      - '.github/workflows/cithela-email-guidance.yml'
permissions:
  contents: read
jobs:
  email-hints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/email-guidance.test.mjs
