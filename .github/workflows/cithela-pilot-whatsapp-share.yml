name: CITHELA WhatsApp share-link pilot
on:
  pull_request:
    paths:
      - 'cithela/alta-whatsapp.html'
      - 'cithela/invitar-profesionales.html'
      - 'cithela/commercial/pilot-share*'
      - 'cithela/edge/cithela-pilot-share-links/**'
      - 'cithela/supabase/pilot-whatsapp-share-links-20261110.sql'
      - 'cithela/pilot-whatsapp-share.test.mjs'
      - '.github/workflows/cithela-pilot-whatsapp-share.yml'
  push:
    paths:
      - 'cithela/alta-whatsapp.html'
      - 'cithela/invitar-profesionales.html'
      - 'cithela/commercial/pilot-share*'
      - 'cithela/edge/cithela-pilot-share-links/**'
      - 'cithela/supabase/pilot-whatsapp-share-links-20261110.sql'
      - 'cithela/pilot-whatsapp-share.test.mjs'
      - '.github/workflows/cithela-pilot-whatsapp-share.yml'
permissions:
  contents: read
jobs:
  pilot-whatsapp-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/pilot-whatsapp-share.test.mjs cithela/pilot-invitations.test.mjs
