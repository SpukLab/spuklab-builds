name: CITHELA Mercado Pago pending-preapproval contract
on:
  pull_request:
    paths:
      - 'cithela/payments/mercadopago-pending-preapproval.mjs'
      - 'cithela/mercadopago-pending-preapproval.test.mjs'
      - '.github/workflows/cithela-mercadopago-pending-preapproval.yml'
  push:
    paths:
      - 'cithela/payments/mercadopago-pending-preapproval.mjs'
      - 'cithela/mercadopago-pending-preapproval.test.mjs'
      - '.github/workflows/cithela-mercadopago-pending-preapproval.yml'
permissions:
  contents: read
jobs:
  validate-pending-preapproval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/mercadopago-pending-preapproval.test.mjs
