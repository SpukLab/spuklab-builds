name: CITHELA professional pilot invitations
on:
  pull_request:
    paths:
      - 'cithela/pilot-invitations.test.mjs'
      - 'cithela/commercial/pilot-invitations-handler.mjs'
      - 'cithela/edge/cithela-pilot-invitations/**'
      - 'cithela/supabase/pilot-invitation-*.sql'
      - 'cithela/invitar-profesionales.html'
      - 'cithela/alta-profesional.html'
      - 'cithela/comercial-admin.html'
      - '.github/workflows/cithela-pilot-invitations.yml'
  push:
    branches:
      - 'cithela/pilot-professional-invitations-20261106'
    paths:
      - 'cithela/pilot-invitations.test.mjs'
      - 'cithela/commercial/pilot-invitations-handler.mjs'
      - 'cithela/edge/cithela-pilot-invitations/**'
      - 'cithela/supabase/pilot-invitation-*.sql'
      - 'cithela/invitar-profesionales.html'
      - 'cithela/alta-profesional.html'
      - 'cithela/comercial-admin.html'
      - '.github/workflows/cithela-pilot-invitations.yml'
permissions:
  contents: read
jobs:
  invitation-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/pilot-invitations.test.mjs cithela/commercial-admin.test.mjs
