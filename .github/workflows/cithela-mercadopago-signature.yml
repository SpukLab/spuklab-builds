name: CITHELA Mercado Pago signature contract
on:
  pull_request:
    paths:
      - 'cithela/payments/mercadopago-webhook-signature.mjs'
      - 'cithela/mercadopago-webhook-signature.test.mjs'
      - '.github/workflows/cithela-mercadopago-signature.yml'
  push:
    paths:
      - 'cithela/payments/mercadopago-webhook-signature.mjs'
      - 'cithela/mercadopago-webhook-signature.test.mjs'
      - '.github/workflows/cithela-mercadopago-signature.yml'
permissions:
  contents: read
jobs:
  validate-webhook-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/mercadopago-webhook-signature.test.mjs
