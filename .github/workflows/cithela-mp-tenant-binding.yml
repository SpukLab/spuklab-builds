name: CITHELA Mercado Pago tenant binding
on:
  pull_request:
    paths:
      - 'cithela/supabase/mercadopago-subscription-intent-link-20261103.sql'
      - 'cithela/mercadopago-subscription-intent.test.mjs'
      - '.github/workflows/cithela-mp-tenant-binding.yml'
  push:
    paths:
      - 'cithela/supabase/mercadopago-subscription-intent-link-20261103.sql'
      - 'cithela/mercadopago-subscription-intent.test.mjs'
      - '.github/workflows/cithela-mp-tenant-binding.yml'
permissions:
  contents: read
jobs:
  validate-tenant-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/mercadopago-subscription-intent.test.mjs cithela/mercadopago-reconciliation.test.mjs cithela/mercadopago-webhook-inbox.test.mjs
