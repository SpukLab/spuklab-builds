name: CITHELA MP test connection
on:
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/edge/cithela-mp-test-connection/**'
      - 'cithela/mercadopago-test-connection.test.mjs'
      - '.github/workflows/cithela-mp-test-connection.yml'
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/edge/cithela-mp-test-connection/**'
      - 'cithela/mercadopago-test-connection.test.mjs'
      - '.github/workflows/cithela-mp-test-connection.yml'
permissions:
  contents: read
jobs:
  verify-test-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/mercadopago-test-connection.test.mjs cithela/commercial-status.test.mjs
