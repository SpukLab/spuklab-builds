name: CITHELA UX ergonomic checks
on:
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/ux-ergonomics.test.mjs'
      - '.github/workflows/cithela-ux-ergonomics.yml'
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/ux-ergonomics.test.mjs'
      - '.github/workflows/cithela-ux-ergonomics.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UX contract and HTML script
        run: node --test cithela/ux-ergonomics.test.mjs
