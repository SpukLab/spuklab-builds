name: CITHELA UX ergonomic checks
on:
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/ux-ergonomics.test.mjs'
      - 'cithela/quick-booking.test.mjs'
      - 'cithela/pilot-ux-20261104.test.mjs'
      - 'cithela/tenant-public-name.test.mjs'
      - 'cithela/supabase/cithela_tenant_public_name_20261105.sql'
      - '.github/workflows/cithela-ux-ergonomics.yml'
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/ux-ergonomics.test.mjs'
      - 'cithela/quick-booking.test.mjs'
      - 'cithela/pilot-ux-20261104.test.mjs'
      - 'cithela/tenant-public-name.test.mjs'
      - 'cithela/supabase/cithela_tenant_public_name_20261105.sql'
      - '.github/workflows/cithela-ux-ergonomics.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UX contract and HTML script
        run: node --test cithela/ux-ergonomics.test.mjs cithela/pilot-ux-20261104.test.mjs cithela/tenant-public-name.test.mjs cithela/quick-booking.test.mjs
