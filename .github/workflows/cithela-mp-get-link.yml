name: CITHELA Mercado Pago linked checkout read-only
on:
  pull_request:
    paths:
      - 'edge/cithela-mp-pilot-get-link/index.ts'
      - 'payments/mercadopago-linked-checkout.mjs'
      - 'payments/mercadopago-linked-checkout.test.mjs'
      - 'cithela/suscripcion-prueba.html'
      - '.github/workflows/cithela-mp-get-link.yml'
  push:
    branches: [main]
    paths:
      - 'edge/cithela-mp-pilot-get-link/index.ts'
      - 'payments/mercadopago-linked-checkout.mjs'
      - 'payments/mercadopago-linked-checkout.test.mjs'
      - 'cithela/suscripcion-prueba.html'
      - '.github/workflows/cithela-mp-get-link.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test payments/mercadopago-linked-checkout.test.mjs
      - uses: denoland/setup-deno@v2
      - run: deno check edge/cithela-mp-pilot-get-link/index.ts
