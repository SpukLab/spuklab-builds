name: CITHELA trial and booking server guards
on:
  pull_request:
    paths:
      - 'cithela/index.html'
      - 'cithela/sql-review/commercial-booking-enforcement-v1.sql'
      - 'cithela/supabase/commercial-booking-enforcement-20261102.sql'
      - 'cithela/sql-review/rollback-booking-enforcement-20261102.sql'
      - 'cithela/trial-booking-enforcement.test.mjs'
      - '.github/workflows/cithela-trial-booking-guard.yml'
  push:
    paths:
      - 'cithela/index.html'
      - 'cithela/sql-review/commercial-booking-enforcement-v1.sql'
      - 'cithela/supabase/commercial-booking-enforcement-20261102.sql'
      - 'cithela/sql-review/rollback-booking-enforcement-20261102.sql'
      - 'cithela/trial-booking-enforcement.test.mjs'
      - '.github/workflows/cithela-trial-booking-guard.yml'
permissions:
  contents: read
jobs:
  validate-server-booking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/trial-booking-enforcement.test.mjs
