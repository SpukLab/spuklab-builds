name: CITHELA Mercado Pago test adapter
on:
  pull_request:
    paths:
      - 'payments/mercadopago-test-provider.mjs'
      - 'payments/mercadopago-test-provider.test.mjs'
      - 'payments/mercadopago-test-recovery.mjs'
      - 'payments/mercadopago-test-recovery.test.mjs'
      - 'payments/mercadopago-payment-proof.mjs'
      - 'payments/mercadopago-payment-proof.test.mjs'
      - '.github/workflows/cithela-mp-test-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'payments/mercadopago-test-provider.mjs'
      - 'payments/mercadopago-test-provider.test.mjs'
      - 'payments/mercadopago-test-recovery.mjs'
      - 'payments/mercadopago-test-recovery.test.mjs'
      - 'payments/mercadopago-payment-proof.mjs'
      - 'payments/mercadopago-payment-proof.test.mjs'
      - '.github/workflows/cithela-mp-test-adapter.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline unit tests
        run: node --test payments/mercadopago-test-provider.test.mjs payments/mercadopago-test-recovery.test.mjs payments/mercadopago-payment-proof.test.mjs
