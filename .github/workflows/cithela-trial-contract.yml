name: CITHELA commercial trial contract checks
on:
  pull_request:
    paths:
      - 'cithela/sql-review/commercial-trial-entitlements-v0.sql'
      - 'cithela/commercial-trial-contract.test.mjs'
      - '.github/workflows/cithela-trial-contract.yml'
  push:
    paths:
      - 'cithela/sql-review/commercial-trial-entitlements-v0.sql'
      - 'cithela/commercial-trial-contract.test.mjs'
      - '.github/workflows/cithela-trial-contract.yml'
permissions:
  contents: read
jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/commercial-trial-contract.test.mjs
