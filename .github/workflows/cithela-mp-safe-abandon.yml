name: CITHELA MP safe abandoned-intent recovery
on:
  pull_request:
    paths:
      - 'payments/mercadopago-safe-abandon.mjs'
      - 'cithela/mercadopago-safe-abandon.test.mjs'
      - 'edge/cithela-mp-pilot-recover/index.ts'
      - '.github/workflows/cithela-mp-safe-abandon.yml'
  push:
    paths:
      - 'payments/mercadopago-safe-abandon.mjs'
      - 'cithela/mercadopago-safe-abandon.test.mjs'
      - 'edge/cithela-mp-pilot-recover/index.ts'
      - '.github/workflows/cithela-mp-safe-abandon.yml'
permissions:
  contents: read
jobs:
  verify-fail-closed-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/mercadopago-safe-abandon.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check edge/cithela-mp-pilot-recover/index.ts
