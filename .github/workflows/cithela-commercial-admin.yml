name: CITHELA commercial admin safety
on:
  pull_request:
    paths:
      - 'cithela/comercial-admin.html'
      - 'cithela/commercial-admin.test.mjs'
      - 'cithela/commercial/**'
      - 'cithela/edge/cithela-commercial-admin/**'
      - 'cithela/supabase/commercial-controls-price-free-retention-20261104.sql'
      - 'cithela/supabase/commercial-admin-command-20261104.sql'
      - 'cithela/index.html'
      - '.github/workflows/cithela-commercial-admin.yml'
  push:
    paths:
      - 'cithela/comercial-admin.html'
      - 'cithela/commercial-admin.test.mjs'
      - 'cithela/commercial/**'
      - 'cithela/edge/cithela-commercial-admin/**'
      - 'cithela/supabase/commercial-controls-price-free-retention-20261104.sql'
      - 'cithela/supabase/commercial-admin-command-20261104.sql'
      - 'cithela/index.html'
      - '.github/workflows/cithela-commercial-admin.yml'
permissions:
  contents: read
jobs:
  commercial-admin-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/commercial-admin.test.mjs cithela/commercial-status.test.mjs cithela/commercial-trial-contract.test.mjs
