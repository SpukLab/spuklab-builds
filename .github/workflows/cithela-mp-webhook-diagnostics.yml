name: CITHELA MP signed webhook diagnostics
on:
  pull_request:
    paths:
      - 'edge/cithela-mercadopago-webhook/index.ts'
      - 'payments/mercadopago-webhook-handler.mjs'
      - 'payments/mercadopago-webhook-diagnostics.test.mjs'
      - '.github/workflows/cithela-mp-webhook-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'edge/cithela-mercadopago-webhook/index.ts'
      - 'payments/mercadopago-webhook-handler.mjs'
      - 'payments/mercadopago-webhook-diagnostics.test.mjs'
      - '.github/workflows/cithela-mp-webhook-diagnostics.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test payments/mercadopago-webhook-diagnostics.test.mjs
      - uses: denoland/setup-deno@v2
      - run: deno check edge/cithela-mercadopago-webhook/index.ts
