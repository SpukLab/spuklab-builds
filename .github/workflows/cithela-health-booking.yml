name: CITHELA coverage booking prototype
on:
  push:
    paths:
      - 'cithela/health-booking/**'
      - '.github/workflows/cithela-health-booking.yml'
  pull_request:
    paths:
      - 'cithela/health-booking/**'
      - '.github/workflows/cithela-health-booking.yml'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cithela/health-booking/coverage-rules.mjs
      - run: node --check cithela/health-booking/sample-data.mjs
      - run: node --test cithela/health-booking/coverage-rules.test.mjs cithela/health-booking/integration.test.mjs
