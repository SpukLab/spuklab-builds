name: CITHELA WhatsApp patient OTP checks
on:
  pull_request:
    paths:
      - 'cithela/edge/cithela-whatsapp-otp/**'
      - '.github/workflows/cithela-whatsapp-otp.yml'
permissions:
  contents: read
jobs:
  otp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cithela/edge/cithela-whatsapp-otp/diagnostics.test.mjs
