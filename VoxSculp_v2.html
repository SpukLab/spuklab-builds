<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>VoxSculp v2 — Voice Spectral Reconstruction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(155deg, #13111f, #1b1726);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 12px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
        }
        
        .header {
            text-align: center;
            padding: 8px 0;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }
        
        .header .subtitle {
            font-size: 11px;
            color: rgba(153, 68, 255, 0.6);
            margin-top: 2px;
        }
        
        .main-panel {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        
        /* LEFT: Canvas + Controls */
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        #canvas {
            width: 100%;
            flex: 1;
            background: rgba(153, 68, 255, 0.03);
            border: 1px solid rgba(153, 68, 255, 0.18);
            border-radius: 6px;
            image-rendering: crisp-edges;
        }
        
        .xy-pad-container {
            position: relative;
            width: 100%;
            height: 140px;
            background: rgba(153, 68, 255, 0.06);
            border: 1px dashed rgba(153, 68, 255, 0.18);
            border-radius: 6px;
            cursor: crosshair;
        }
        
        #xyPad {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .xy-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #00ffff, rgba(0, 255, 255, 0.3));
            border: 2px solid #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.6), inset 0 0 4px rgba(255, 0, 255, 0.3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        .xy-label {
            position: absolute;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }
        
        .xy-label.x { bottom: 2px; left: 50%; transform: translateX(-50%); }
        .xy-label.y { left: 2px; top: 50%; transform: translateY(-50%); }
        
        /* RIGHT: Controls */
        .right-section {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 6px;
        }
        
        .control-group {
            background: rgba(153, 68, 255, 0.08);
            border: 1px solid rgba(153, 68, 255, 0.18);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .control-label {
            font-size: 10px;
            font-weight: 600;
            color: rgba(153, 68, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        button {
            padding: 8px 10px;
            background: rgba(153, 68, 255, 0.12);
            border: 1px solid rgba(153, 68, 255, 0.3);
            color: #fff;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        button:active, button.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            color: #00ffff;
        }
        
        button.recording {
            background: rgba(255, 100, 100, 0.3);
            border-color: rgba(255, 100, 100, 0.6);
            color: #ff6464;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .slider-value {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(153, 68, 255, 0.2);
            border: none;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #00ffff, #9944ff);
            border: 1px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(0, 255, 255, 0.6);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #00ffff, #9944ff);
            border: 1px solid #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .status {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.4;
        }
        
        .status.ok { color: rgba(0, 255, 255, 0.7); }
        .status.error { color: rgba(255, 100, 100, 0.7); }
        
        /* Preset selector */
        .preset-select {
            width: 100%;
            padding: 6px 8px;
            background: rgba(153, 68, 255, 0.12);
            border: 1px solid rgba(153, 68, 255, 0.3);
            color: #fff;
            font-size: 10px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .preset-select option {
            background: #1b1726;
            color: #fff;
        }
        
        /* Bottom meter */
        .meter-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 8px;
            background: rgba(153, 68, 255, 0.04);
            border: 1px solid rgba(153, 68, 255, 0.12);
            border-radius: 4px;
        }
        
        .meter {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .meter-label {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }
        
        .meter-bar {
            width: 24px;
            height: 30px;
            background: rgba(153, 68, 255, 0.1);
            border: 1px solid rgba(153, 68, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        .meter-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #00ffff, #9944ff);
            height: 0%;
            transition: height 0.05s;
            box-shadow: 0 0 4px rgba(0, 255, 255, 0.6);
        }

        /* Recording time display */
        .recording-time {
            font-size: 9px;
            color: rgba(255, 100, 100, 0.8);
            text-align: center;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VOXSCULP v2</h1>
            <div class="subtitle">Spectral Voice Reconstruction + Presets + Recording</div>
        </div>
        
        <div class="main-panel">
            <div class="left-section">
                <canvas id="canvas"></canvas>
                
                <div class="xy-pad-container">
                    <div id="xyPad">
                        <div class="xy-dot"></div>
                        <div class="xy-label x">IDENTITY</div>
                        <div class="xy-label y">CHAOS</div>
                    </div>
                </div>
                
                <div class="meter-panel">
                    <div class="meter">
                        <div class="meter-label">BODY</div>
                        <div class="meter-bar"><div class="meter-fill" id="meterBody"></div></div>
                    </div>
                    <div class="meter">
                        <div class="meter-label">FORM</div>
                        <div class="meter-bar"><div class="meter-fill" id="meterForm"></div></div>
                    </div>
                    <div class="meter">
                        <div class="meter-label">AIR</div>
                        <div class="meter-bar"><div class="meter-fill" id="meterAir"></div></div>
                    </div>
                    <div class="meter">
                        <div class="meter-label">NOISE</div>
                        <div class="meter-bar"><div class="meter-fill" id="meterNoise"></div></div>
                    </div>
                </div>
            </div>
            
            <div class="right-section">
                <div class="control-group">
                    <div class="control-label">Input</div>
                    <div class="button-group">
                        <button id="btnMic">◆ MIC INPUT</button>
                        <button id="btnStop">◾ STOP</button>
                    </div>
                    <div class="status" id="status">Ready</div>
                </div>

                <div class="control-group">
                    <div class="control-label">Recording</div>
                    <div class="button-group">
                        <button id="btnRecord">● REC</button>
                        <button id="btnDownload">↓ DOWNLOAD</button>
                    </div>
                    <div class="recording-time" id="recordingTime"></div>
                </div>
                
                <div class="control-group">
                    <div class="control-label">Presets</div>
                    <select id="presetSelect" class="preset-select">
                        <option value="">— Load Preset —</option>
                    </select>
                    <div class="button-group">
                        <button id="btnSavePreset">SAVE</button>
                        <button id="btnDeletePreset">DELETE</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="control-label">Mode</div>
                    <div class="button-group">
                        <button id="btnAbstract">ABSTRACT</button>
                        <button id="btnOrganic">ORGANIC</button>
                        <button id="btnTextural">TEXTURAL</button>
                        <button id="btnInharmonic">INHARMONIC</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="slider-group">
                        <div class="control-label">Mutation</div>
                        <div class="slider-value">
                            <span>0</span>
                            <span id="mutationValue">50</span>
                        </div>
                        <input type="range" id="mutation" min="0" max="100" value="50">
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="slider-group">
                        <div class="control-label">Density</div>
                        <div class="slider-value">
                            <span>LOW</span>
                            <span id="densityValue">50</span>
                        </div>
                        <input type="range" id="density" min="10" max="80" value="40" step="2">
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="slider-group">
                        <div class="control-label">Texture</div>
                        <div class="slider-value">
                            <span>TONAL</span>
                            <span id="textureValue">50</span>
                        </div>
                        <input type="range" id="texture" min="0" max="100" value="50">
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="slider-group">
                        <div class="control-label">Space</div>
                        <div class="slider-value">
                            <span>MONO</span>
                            <span id="spaceValue">50</span>
                        </div>
                        <input type="range" id="space" min="0" max="100" value="50">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // VOXSCULP v2 — Voice Spectral Reconstruction + Recording + Presets
        // ═══════════════════════════════════════════════════════════════

        class WavRecorder {
            constructor(sampleRate) {
                this.sampleRate = sampleRate;
                this.audioData = [];
                this.isRecording = false;
            }

            start() {
                this.audioData = [];
                this.isRecording = true;
            }

            stop() {
                this.isRecording = false;
                return this.generateWav();
            }

            write(buffer) {
                if (!this.isRecording) return;
                this.audioData.push(new Float32Array(buffer));
            }

            generateWav() {
                // Concatenate all buffers
                let totalLength = 0;
                this.audioData.forEach(b => totalLength += b.length);
                
                const wav = new Float32Array(totalLength);
                let offset = 0;
                this.audioData.forEach(b => {
                    wav.set(b, offset);
                    offset += b.length;
                });

                return this.encodeWav(wav);
            }

            encodeWav(samples) {
                const buf = new ArrayBuffer(44 + samples.length * 2);
                const view = new DataView(buf);
                
                // WAV header
                const writeString = (offset, string) => {
                    for (let i = 0; i < string.length; i++) {
                        view.setUint8(offset + i, string.charCodeAt(i));
                    }
                };
                
                writeString(0, 'RIFF');
                view.setUint32(4, 36 + samples.length * 2, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true); // fmt chunk size
                view.setUint16(20, 1, true);  // PCM
                view.setUint16(22, 1, true);  // mono
                view.setUint32(24, this.sampleRate, true);
                view.setUint32(28, this.sampleRate * 2, true);
                view.setUint16(32, 2, true);  // block align
                view.setUint16(34, 16, true); // 16-bit
                writeString(36, 'data');
                view.setUint32(40, samples.length * 2, true);
                
                // Write PCM samples
                let index = 44;
                for (let i = 0; i < samples.length; i++) {
                    const s = Math.max(-1, Math.min(1, samples[i]));
                    view.setInt16(index, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                    index += 2;
                }
                
                return buf;
            }
        }

        class VoxSculp {
            constructor() {
                this.AC = null;
                this.inputStream = null;
                this.scriptProcessor = null;
                this.analyser = null;
                this.microphone = null;
                this.isRunning = false;
                
                // Recording
                this.wavRecorder = null;
                this.isRecording = false;
                this.recordingStartTime = 0;
                this.recordingUpdateInterval = null;
                
                // Spectral state
                this.spectralData = { body: 0, formant: 0, air: 0, noise: 0 };
                this.behavior = { intensity: 0, tension: 0, aggression: 0, organicity: 0, air: 0 };
                this.previousSpectralData = { body: 0, formant: 0, air: 0, noise: 0 };
                
                // Grain buffer
                this.grainBuffer = new Float32Array(8192);
                this.grainWritePos = 0;
                this.grainReadPos = 0;
                
                // Control state
                this.mode = 'organic';
                this.mutation = 0.5;
                this.density = 40;
                this.texture = 0.5;
                this.space = 0.5;
                this.xyIdentity = 0.5;
                this.xyChaos = 0.5;
                
                // Presets
                this.presets = this.loadPresetsFromStorage();
                
                // Visual
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();
                this.animationId = null;
                
                // Output nodes
                this.outputGain = null;
                this.dryGain = null;
                this.wetGain = null;
                
                this.init();
            }
            
            async init() {
                try {
                    this.AC = new (window.AudioContext || window.webkitAudioContext)();
                    this.wavRecorder = new WavRecorder(this.AC.sampleRate);
                    
                    // Create nodes
                    this.analyser = this.AC.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.analyser.smoothingTimeConstant = 0.7;
                    
                    this.scriptProcessor = this.AC.createScriptProcessor(4096, 1, 2);
                    this.scriptProcessor.onaudioprocess = (e) => this.processAudio(e);
                    
                    this.dryGain = this.AC.createGain();
                    this.wetGain = this.AC.createGain();
                    this.outputGain = this.AC.createGain();
                    this.outputGain.gain.value = 0.7;
                    
                    // Routing
                    this.scriptProcessor.connect(this.analyser);
                    this.analyser.connect(this.dryGain);
                    this.dryGain.connect(this.outputGain);
                    this.wetGain.connect(this.outputGain);
                    this.outputGain.connect(this.AC.destination);
                    
                    this.dryGain.gain.value = 0.3;
                    this.wetGain.gain.value = 0.7;
                    
                    this.updateStatus('Ready. Tap MIC INPUT.', 'ok');
                    this.setupEventListeners();
                    this.updatePresetSelect();
                    this.startAnimation();
                } catch (err) {
                    this.updateStatus(`Init error: ${err.message}`, 'error');
                }
            }
            
            setupEventListeners() {
                document.getElementById('btnMic').addEventListener('click', () => this.startInput());
                document.getElementById('btnStop').addEventListener('click', () => this.stopInput());
                document.getElementById('btnRecord').addEventListener('click', () => this.toggleRecording());
                document.getElementById('btnDownload').addEventListener('click', () => this.downloadRecording());
                document.getElementById('btnSavePreset').addEventListener('click', () => this.savePreset());
                document.getElementById('btnDeletePreset').addEventListener('click', () => this.deletePreset());
                document.getElementById('presetSelect').addEventListener('change', (e) => this.loadPreset(e.target.value));
                
                ['btnAbstract', 'btnOrganic', 'btnTextural', 'btnInharmonic'].forEach(id => {
                    document.getElementById(id).addEventListener('click', (e) => {
                        document.querySelectorAll('button[id^="btn"]').forEach(b => {
                            if (b.id.startsWith('btn') && !['btnMic', 'btnStop', 'btnRecord', 'btnDownload', 'btnSavePreset', 'btnDeletePreset'].includes(b.id)) {
                                b.classList.remove('active');
                            }
                        });
                        e.target.classList.add('active');
                        this.mode = id.replace('btn', '').toLowerCase();
                    });
                });
                
                document.getElementById('mutation').addEventListener('input', (e) => {
                    this.mutation = parseFloat(e.target.value) / 100;
                    document.getElementById('mutationValue').textContent = e.target.value;
                });
                
                document.getElementById('density').addEventListener('input', (e) => {
                    this.density = parseInt(e.target.value);
                    document.getElementById('densityValue').textContent = e.target.value;
                });
                
                document.getElementById('texture').addEventListener('input', (e) => {
                    this.texture = parseInt(e.target.value) / 100;
                    document.getElementById('textureValue').textContent = e.target.value;
                });
                
                document.getElementById('space').addEventListener('input', (e) => {
                    this.space = parseInt(e.target.value) / 100;
                    document.getElementById('spaceValue').textContent = e.target.value;
                });
                
                const xyPad = document.getElementById('xyPad');
                xyPad.addEventListener('touchmove', (e) => this.handleXYPad(e));
                xyPad.addEventListener('mousemove', (e) => this.handleXYPad(e));
                xyPad.addEventListener('touchstart', (e) => this.handleXYPad(e));
                xyPad.addEventListener('mousedown', (e) => this.handleXYPad(e));
                
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            handleXYPad(e) {
                e.preventDefault();
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const y = e.touches ? e.touches[0].clientY : e.clientY;
                
                this.xyIdentity = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
                this.xyChaos = Math.max(0, Math.min(1, 1 - (y - rect.top) / rect.height));
                
                const dot = e.currentTarget.querySelector('.xy-dot');
                dot.style.left = (this.xyIdentity * 100) + '%';
                dot.style.top = ((1 - this.xyChaos) * 100) + '%';
            }
            
            async startInput() {
                try {
                    this.AC.resume();
                    this.inputStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: false, noiseSuppression: false } 
                    });
                    this.microphone = this.AC.createMediaStreamAudioSource(this.inputStream);
                    this.microphone.connect(this.scriptProcessor);
                    this.isRunning = true;
                    this.updateStatus('Listening...', 'ok');
                } catch (err) {
                    this.updateStatus(`Mic error: ${err.message}`, 'error');
                }
            }
            
            stopInput() {
                if (this.inputStream) {
                    this.inputStream.getTracks().forEach(t => t.stop());
                }
                this.isRunning = false;
                this.updateStatus('Stopped.', 'ok');
            }

            toggleRecording() {
                const btn = document.getElementById('btnRecord');
                if (!this.isRecording) {
                    this.wavRecorder.start();
                    this.isRecording = true;
                    this.recordingStartTime = Date.now();
                    btn.classList.add('recording');
                    this.recordingUpdateInterval = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - this.recordingStartTime) / 1000);
                        const mins = Math.floor(elapsed / 60);
                        const secs = elapsed % 60;
                        document.getElementById('recordingTime').textContent = 
                            `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    }, 100);
                } else {
                    this.isRecording = false;
                    btn.classList.remove('recording');
                    clearInterval(this.recordingUpdateInterval);
                    document.getElementById('recordingTime').textContent = '';
                    this.updateStatus('Recording saved to buffer.', 'ok');
                }
            }

            downloadRecording() {
                if (this.wavRecorder.audioData.length === 0) {
                    this.updateStatus('Nothing recorded yet.', 'error');
                    return;
                }

                const wavBlob = new Blob([this.wavRecorder.generateWav()], { type: 'audio/wav' });
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
                a.download = `VoxSculp_${timeStr}.wav`;
                a.click();
                URL.revokeObjectURL(url);
                this.updateStatus('Downloaded.', 'ok');
            }

            // Presets management
            savePreset() {
                const name = prompt('Preset name:');
                if (!name) return;

                const preset = {
                    name,
                    mode: this.mode,
                    mutation: this.mutation,
                    density: this.density,
                    texture: this.texture,
                    space: this.space,
                    xyIdentity: this.xyIdentity,
                    xyChaos: this.xyChaos
                };

                this.presets[name] = preset;
                localStorage.setItem('voxsculp_presets', JSON.stringify(this.presets));
                this.updatePresetSelect();
                this.updateStatus(`Preset "${name}" saved.`, 'ok');
            }

            loadPreset(name) {
                if (!name || !this.presets[name]) return;

                const preset = this.presets[name];
                this.mode = preset.mode;
                this.mutation = preset.mutation;
                this.density = preset.density;
                this.texture = preset.texture;
                this.space = preset.space;
                this.xyIdentity = preset.xyIdentity;
                this.xyChaos = preset.xyChaos;

                // Update UI
                document.getElementById('mutation').value = Math.round(this.mutation * 100);
                document.getElementById('mutationValue').textContent = Math.round(this.mutation * 100);
                document.getElementById('density').value = this.density;
                document.getElementById('densityValue').textContent = this.density;
                document.getElementById('texture').value = Math.round(this.texture * 100);
                document.getElementById('textureValue').textContent = Math.round(this.texture * 100);
                document.getElementById('space').value = Math.round(this.space * 100);
                document.getElementById('spaceValue').textContent = Math.round(this.space * 100);

                document.querySelectorAll('button[id^="btn"]').forEach(b => {
                    if (b.id.startsWith('btn') && !['btnMic', 'btnStop', 'btnRecord', 'btnDownload', 'btnSavePreset', 'btnDeletePreset'].includes(b.id)) {
                        b.classList.remove('active');
                    }
                });
                document.getElementById('btn' + this.mode.charAt(0).toUpperCase() + this.mode.slice(1)).classList.add('active');

                const dot = document.querySelector('.xy-dot');
                dot.style.left = (this.xyIdentity * 100) + '%';
                dot.style.top = ((1 - this.xyChaos) * 100) + '%';

                this.updateStatus(`Loaded "${name}".`, 'ok');
            }

            deletePreset() {
                const select = document.getElementById('presetSelect');
                const name = select.value;
                if (!name || !this.presets[name]) return;

                if (!confirm(`Delete "${name}"?`)) return;

                delete this.presets[name];
                localStorage.setItem('voxsculp_presets', JSON.stringify(this.presets));
                this.updatePresetSelect();
                this.updateStatus(`Preset deleted.`, 'ok');
            }

            updatePresetSelect() {
                const select = document.getElementById('presetSelect');
                select.innerHTML = '<option value="">— Load Preset —</option>';
                Object.keys(this.presets).forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    select.appendChild(opt);
                });
            }

            loadPresetsFromStorage() {
                try {
                    const stored = localStorage.getItem('voxsculp_presets');
                    return stored ? JSON.parse(stored) : {};
                } catch {
                    return {};
                }
            }
            
            // ═══════════════════════════════════════════════════════════
            // A) SPECTRAL DECOMPOSITION ENGINE (Enhanced)
            // ═══════════════════════════════════════════════════════════
            decomposeSpectral(dataArray, nyquist) {
                const freqRes = nyquist / dataArray.length;
                let body = 0, formant = 0, air = 0, noise = 0;
                
                const bodyBins = Math.ceil(300 / freqRes);
                const formantBins = Math.ceil(2500 / freqRes);
                const airBins = Math.ceil(8000 / freqRes);
                
                let totalEnergy = 0;
                
                for (let i = 0; i < dataArray.length; i++) {
                    const val = dataArray[i];
                    totalEnergy += val;
                    
                    if (i < bodyBins) body += val;
                    else if (i < formantBins) formant += val;
                    else if (i < airBins) air += val;
                    else noise += val;
                }
                
                const norm = totalEnergy > 0 ? totalEnergy : 1;
                
                // Extract formant centroid (basic harmonic detection)
                let formantCentroid = 0, formantWeight = 0;
                for (let i = Math.ceil(300 / freqRes); i < formantBins; i++) {
                    formantCentroid += i * dataArray[i];
                    formantWeight += dataArray[i];
                }
                formantCentroid = formantWeight > 0 ? (formantCentroid / formantWeight) * freqRes : 0;
                
                return {
                    body: body / norm,
                    formant: formant / norm,
                    air: air / norm,
                    noise: noise / norm,
                    totalEnergy: totalEnergy / 255 / dataArray.length,
                    formantCentroid: formantCentroid
                };
            }
            
            // ═══════════════════════════════════════════════════════════
            // B) BEHAVIOR ANALYSIS ENGINE
            // ═══════════════════════════════════════════════════════════
            analyzeBehavior(spectral) {
                const dBody = Math.abs(spectral.body - this.previousSpectralData.body);
                const dForm = Math.abs(spectral.formant - this.previousSpectralData.formant);
                const dAir = Math.abs(spectral.air - this.previousSpectralData.air);
                
                return {
                    intensity: Math.min(1, spectral.totalEnergy * 2),
                    tension: Math.min(1, (dBody + dForm + dAir) * 5),
                    aggression: Math.min(1, (spectral.air + dAir) * 1.5),
                    organicity: 1 - Math.min(1, Math.abs(spectral.totalEnergy - 0.5) * 2),
                    air: spectral.noise
                };
            }
            
            // ═══════════════════════════════════════════════════════════
            // C) AUDIO PROCESSING (Main callback) — Enhanced with recording
            // ═══════════════════════════════════════════════════════════
            processAudio(e) {
                const inputData = e.inputBuffer.getChannelData(0);
                const outputL = e.outputBuffer.getChannelData(0);
                const outputR = e.outputBuffer.getChannelData(1);
                
                // Get FFT data
                const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(dataArray);
                
                // Spectral decomposition
                const spectral = this.decomposeSpectral(dataArray, this.AC.sampleRate / 2);
                this.behavior = this.analyzeBehavior(spectral);
                this.previousSpectralData = spectral;
                
                // Update meters
                document.getElementById('meterBody').style.height = (spectral.body * 100) + '%';
                document.getElementById('meterForm').style.height = (spectral.formant * 100) + '%';
                document.getElementById('meterAir').style.height = (spectral.air * 100) + '%';
                document.getElementById('meterNoise').style.height = (spectral.noise * 100) + '%';
                
                // Granular reconstruction with formant awareness
                const grainLength = Math.floor((this.density / 100) * (this.AC.sampleRate * 0.08));
                this.grainBuffer.set(inputData, this.grainWritePos);
                this.grainWritePos = (this.grainWritePos + inputData.length) % this.grainBuffer.length;
                
                const chaos = this.xyChaos * 0.3 + 0.1;
                const identity = this.xyIdentity;
                
                for (let i = 0; i < inputData.length; i++) {
                    let drySignal = inputData[i];
                    
                    // Wet: grain-based reconstruction
                    let wetSignal = 0;
                    const readPos = (this.grainReadPos + Math.floor(Math.random() * chaos * grainLength)) % this.grainBuffer.length;
                    wetSignal = this.grainBuffer[readPos];
                    
                    // Pitch micro-variation with formant tracking
                    const formantInfluence = spectral.formantCentroid / 8000; // Normalize to 0-1
                    
                    if (this.mode === 'abstract') {
                        wetSignal *= (1 + Math.sin(i * 0.05 + Math.random() * 2 + formantInfluence) * 0.4);
                    } else if (this.mode === 'organic') {
                        wetSignal *= (1 + Math.sin(i * 0.02 + formantInfluence * Math.PI) * 0.2);
                    } else if (this.mode === 'textural') {
                        wetSignal = wetSignal * 0.6 + (Math.random() - 0.5) * 0.4 * this.texture;
                    } else if (this.mode === 'inharmonic') {
                        wetSignal *= Math.cos(i * (0.03 + Math.random() * 0.02 + formantInfluence * 0.01));
                    }
                    
                    const mutate = this.mutation * identity;
                    const finalSignal = drySignal * (1 - mutate) + wetSignal * mutate;
                    
                    outputL[i] = finalSignal * (1 - this.space * 0.3);
                    outputR[i] = finalSignal * (1 + this.space * 0.2);
                }
                
                // Write to recording buffer
                if (this.isRecording) {
                    this.wavRecorder.write(outputL);
                }
                
                this.grainReadPos = (this.grainReadPos + inputData.length) % this.grainBuffer.length;
            }
            
            resizeCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth * window.devicePixelRatio;
                this.canvas.height = container.clientHeight * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            
            startAnimation() {
                const animate = () => {
                    this.draw();
                    this.animationId = requestAnimationFrame(animate);
                };
                animate();
            }
            
            draw() {
                const w = this.canvas.width / window.devicePixelRatio;
                const h = this.canvas.height / window.devicePixelRatio;
                
                // Clear
                this.ctx.fillStyle = 'rgba(19, 17, 31, 0.1)';
                this.ctx.fillRect(0, 0, w, h);
                
                // Draw energy rings
                const cx = w / 2;
                const cy = h / 2;
                const maxRadius = Math.min(w, h) * 0.35;
                
                // Body ring
                this.ctx.strokeStyle = `rgba(153, 68, 255, ${this.behavior.intensity * 0.6})`;
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, maxRadius * this.behavior.intensity, 0, Math.PI * 2);
                this.ctx.stroke();
                
                // Formant ring
                this.ctx.strokeStyle = `rgba(0, 255, 255, ${this.behavior.tension * 0.6})`;
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, maxRadius * 0.7 + this.behavior.tension * 10, 0, Math.PI * 2);
                this.ctx.stroke();
                
                // Air ring
                this.ctx.strokeStyle = `rgba(255, 0, 255, ${this.behavior.aggression * 0.6})`;
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, maxRadius * 0.5 + this.behavior.aggression * 15, 0, Math.PI * 2);
                this.ctx.stroke();
                
                // Noise particles
                this.ctx.fillStyle = `rgba(100, 255, 200, ${this.behavior.air * 0.8})`;
                for (let i = 0; i < Math.floor(this.behavior.air * 50); i++) {
                    const angle = (i / 50) * Math.PI * 2 + Date.now() * 0.0005 * (i % 3);
                    const r = maxRadius * 0.3 + Math.random() * 20;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    this.ctx.fillRect(x - 1, y - 1, 2, 2);
                }
                
                // Center orb
                const orbGradient = this.ctx.createRadialGradient(cx, cy, 0, cx, cy, 15);
                orbGradient.addColorStop(0, `rgba(255, 255, 255, ${0.3 + this.behavior.intensity * 0.4})`);
                orbGradient.addColorStop(1, 'rgba(153, 68, 255, 0.1)');
                this.ctx.fillStyle = orbGradient;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, 15 + this.behavior.tension * 5, 0, Math.PI * 2);
                this.ctx.fill();
            }
            
            updateStatus(msg, type = 'ok') {
                const status = document.getElementById('status');
                status.textContent = msg;
                status.className = 'status ' + type;
            }
        }
        
        // ═══════════════════════════════════════════════════════════════
        // Initialization
        // ═══════════════════════════════════════════════════════════════
        
        window.addEventListener('load', () => {
            window.voxSculp = new VoxSculp();
        });
    </script>
</body>
