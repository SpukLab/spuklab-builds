<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoxDust v9.3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg1:#13111f;--bg2:#1b1726;
  --border:rgba(153,68,255,.18);--glow:rgba(153,68,255,.08);
  --canvas-bg:rgba(153,68,255,.06);
  --cyan:#00ffff;--magenta:#ff00ff;--violet:#9944ff;--violetlt:#b580ff;
  --btn:rgba(153,68,255,.07);--active:rgba(153,68,255,.18);
  --white:rgba(255,255,255,.92);--dim:rgba(255,255,255,.38);
}
body{background:linear-gradient(155deg,var(--bg1),var(--bg2));min-height:100vh;color:var(--white);font-family:'Inter',sans-serif;font-size:13px;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px;gap:12px;overflow-x:hidden;}
.logo{font-family:'JetBrains Mono',monospace;font-style:italic;letter-spacing:.04em;}
.logo .spuk{font-weight:800;color:var(--white);font-size:22px;}
.logo .lab{font-weight:300;color:var(--cyan);font-size:22px;}
.logo .sub{font-size:10px;color:var(--dim);display:block;margin-top:2px;letter-spacing:.12em;}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:flex-start;}
.version{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);}
.canvas-wrap{width:100%;max-width:480px;background:var(--canvas-bg);border:1px solid var(--border);border-radius:12px;height:100px;position:relative;overflow:hidden;}
canvas#analyser{width:100%;height:100%;}
.playhead{position:absolute;top:0;left:0;width:2px;height:100%;background:var(--cyan);opacity:.8;pointer-events:none;z-index:10;}
.controls-row{width:100%;max-width:480px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ctrl-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);flex-shrink:0;}
select{background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--dim);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;border-radius:5px;padding:4px;cursor:pointer;}
.slots{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.slot{background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;}
.slot-header{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:11px;color:var(--violetlt);letter-spacing:.08em;}
.slot-name{font-size:10px;color:var(--dim);min-height:14px;overflow:hidden;text-overflow:ellipsis;}
.slot-btn{width:100%;padding:8px;border:1px solid var(--border);background:var(--btn);border-radius:6px;color:var(--white);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;cursor:pointer;transition:all .15s;}
.slot-btn:active{background:var(--active);color:var(--cyan);}
.slot-btn.active{border-color:var(--violet);}
.slot-btn.recording{border-color:#ff3030;color:#ff3030;animation:rb .6s infinite;}
@keyframes rb{0%,100%{opacity:1;}50%{opacity:.3;}}
.matter-section{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.matter-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.matter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.matter-btn{padding:8px 0;border:1px solid var(--border);background:var(--btn);border-radius:6px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:8px;color:var(--dim);cursor:pointer;transition:all .15s;}
.matter-btn.active{background:var(--active);color:var(--cyan);border-color:var(--violet);}
.spectral-section{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.spectral-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;margin-bottom:2px;}
.spectral-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.spectral-item{display:flex;flex-direction:column;gap:4px;}
.spectral-val{font-size:9px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.06);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;border:none;}
.transport{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tbtn{padding:10px 0;border:1px solid var(--border);background:var(--btn);border-radius:8px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--white);cursor:pointer;text-align:center;transition:all .15s;letter-spacing:.04em;}
.tbtn:active{background:var(--active);color:var(--cyan);}
.tbtn.disabled{opacity:.35;pointer-events:none;}
.tbtn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,255,.08);}
.status{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);text-align:center;min-height:14px;max-width:480px;}
.status.active{color:var(--cyan);}
.status.error{color:var(--magenta);}
.library{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.lib-title{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.lib-list{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.lib-item{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:9px;color:var(--dim);font-family:'JetBrains Mono',monospace;font-style:italic;display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center;}
.lib-info{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-btn{padding:2px 4px;font-size:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);border-radius:3px;cursor:pointer;color:var(--cyan);flex-shrink:0;}
.lib-btn:active{background:var(--active);}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="spuk">SPUK</span><span class="lab">LAB</span><span class="sub">VoxDust · professional</span></div>
  <div class="version">v9.3</div>
</header>

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="analyser"></canvas>
  <div class="playhead" id="playhead" style="display:none;"></div>
</div>

<div class="controls-row">
  <span class="ctrl-label">SPEED</span>
  <select id="playSpeed">
    <option value="0.5">0.5x</option>
    <option value="0.75">0.75x</option>
    <option value="1" selected>1.0x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2.0x</option>
  </select>
  <span class="ctrl-label" style="margin-left:auto;">A←→B</span>
  <input type="range" id="mixABSlider" min="0" max="100" value="50" style="flex:1;max-width:80px;">
  <span id="valMixAB" style="font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--cyan);min-width:24px;">50</span>
</div>

<div class="slots">
  <div class="slot">
    <div class="slot-header">MIC A</div>
    <div class="slot-name" id="nameA">ready</div>
    <button class="slot-btn" id="recA">● REC</button>
  </div>
  <div class="slot">
    <div class="slot-header">MIC B</div>
    <div class="slot-name" id="nameB">ready</div>
    <button class="slot-btn" id="recB">● REC</button>
  </div>
</div>

<div class="matter-section">
  <div class="matter-label">STATE</div>
  <div class="matter-grid" id="matterGrid"></div>
</div>

<div class="spectral-section">
  <div class="spectral-label">SPECTRAL CORE</div>
  <div class="spectral-row">
    <div class="spectral-item">
      <div class="spectral-val" id="valFORM">50</div>
      <div style="font-size:9px;color:var(--dim);">FORM</div>
      <input type="range" id="formSlider" min="0" max="100" value="50">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valSMEAR">50</div>
      <div style="font-size:9px;color:var(--dim);">SMEAR</div>
      <input type="range" id="smearSlider" min="0" max="100" value="50">
    </div>
    <div class="spectral-item">
      <button class="lib-btn" id="btnFreeze" style="width:100%;padding:6px;font-size:9px;color:var(--magenta);">❄ FREEZE</button>
    </div>
  </div>
  <div class="spectral-label" style="margin-top:8px;">FX</div>
  <div class="spectral-row">
    <div class="spectral-item">
      <div class="spectral-val" id="valReverb">30</div>
      <div style="font-size:9px;color:var(--dim);">REVERB</div>
      <input type="range" id="reverbSlider" min="0" max="100" value="30">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valDryWet">50</div>
      <div style="font-size:9px;color:var(--dim);">DRY/WET</div>
      <input type="range" id="dryWetSlider" min="0" max="100" value="50">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valIntensity">50</div>
      <div style="font-size:9px;color:var(--dim);">INTENSITY</div>
      <input type="range" id="intensitySlider" min="0" max="100" value="50">
    </div>
  </div>
</div>

<div class="transport">
  <button class="tbtn" id="btnPlay">▶ PLAY</button>
  <button class="tbtn disabled" id="btnStop">⏹ STOP</button>
  <button class="tbtn" id="btnRec">⏺ REC OUT</button>
  <button class="tbtn" id="btnPreset">⚙ PRESET</button>
</div>

<div class="status" id="status">tap REC A and REC B</div>

<div id="presetUI" style="width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:none;flex-direction:column;gap:8px;">
  <div style="font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;">PRESET MANAGER</div>
  <div style="display:grid;grid-template-columns:1fr auto;gap:6px;">
    <input type="text" id="presetName" placeholder="preset name" style="background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--white);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;border-radius:4px;padding:4px;">
    <button class="lib-btn" id="btnSavePreset">SAVE</button>
  </div>
  <div style="max-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;" id="presetList"></div>
</div>

<div class="library">
  <div class="lib-title">TAKES</div>
  <div class="lib-list" id="libList"><div style="font-size:10px;color:rgba(255,255,255,.15);padding:4px;">no takes yet</div></div>
</div>

<script>
// ═══════════════════════════════════════════════════
// VOXDUST v9.3 — TRANSIENT PRESERVATION + PHASE ACCUMULATION + ENERGY NORMALIZATION
// ═══════════════════════════════════════════════════

var AC, analyser, micStream, micProcNode, micSrc;
var playingSources = [];

var state = {
  form: 0.5,
  smear: 0.5,
  dryWet: 0.5,
  intensity: 0.5,
  reverb: 0.3,
  matter: 'Ritual',
  bufA: null,
  bufB: null,
  mixAB: 0.5,
  playSpeed: 1,
  isPlaying: false,
  freezeActive: false,
  freezeAmount: 0.5,
};

var presets = JSON.parse(localStorage.getItem('voxdustPresets')) || {};

const STATES = {
  Susurro:  { randomAmount: 0.1 },
  Eco:      { randomAmount: 0.8 },
  Ritual:   { randomAmount: 0.3 },
  Máquina:  { randomAmount: 0.2 },
  Híbrido:  { randomAmount: 0.4 },
  Colapso:  { randomAmount: 0.9 },
};

const FFT_SIZE = 512;
const FFT_BINS = FFT_SIZE / 2;
const FREEZE_BUFFER_SIZE = 32;

// ═══════════════════════════════════════════════════
// SPECTRAL STATE
// ═══════════════════════════════════════════════════

let prevPhase = new Float32Array(FFT_BINS);
let prevPhaseLocked = new Float32Array(FFT_BINS); // phase accumulation
let prevMag = new Float32Array(FFT_BINS);
let prevFrame = new Float32Array(FFT_SIZE); // for transient detection
let prevPeaks = [];
let peaks = [];
let peakGroups = [];

let freezeBuffer = [];
let freezeIndex = 0;
let freezeWriteIdx = 0;
for (let i = 0; i < FREEZE_BUFFER_SIZE; i++) {
  freezeBuffer.push({
    mag: new Float32Array(FFT_BINS),
    phase: new Float32Array(FFT_BINS),
  });
}

let tempMag = new Float32Array(FFT_BINS);
let tempPhase = new Float32Array(FFT_BINS);
let tempRe = new Float32Array(FFT_BINS);
let tempIm = new Float32Array(FFT_BINS);

// ═══════════════════════════════════════════════════
// 1. TRANSIENT DETECTION
// ═══════════════════════════════════════════════════

function detectTransient(prevFrame, currFrame, threshold = 1.8) {
  let energyPrev = 0, energyCurr = 0;
  for (let i = 0; i < Math.min(currFrame.length, prevFrame.length); i++) {
    energyPrev += prevFrame[i] * prevFrame[i];
    energyCurr += currFrame[i] * currFrame[i];
  }
  const ratio = energyCurr / (energyPrev + 1e-6);
  return ratio > threshold;
}

// ═══════════════════════════════════════════════════
// 2. TEMPORAL PEAK TRACKING
// ═══════════════════════════════════════════════════

function trackPeaks(prevPeaks, currPeaks) {
  const tracked = [];
  const used = new Set();
  
  for (let p of currPeaks) {
    let closest = null;
    let minDist = Infinity;
    
    for (let prev of prevPeaks) {
      const d = Math.abs(prev.idx - p.idx);
      if (d < minDist && !used.has(prev.idx)) {
        closest = prev;
        minDist = d;
      }
    }
    
    if (closest && minDist < 5) {
      const alpha = 0.7;
      const idx = alpha * closest.idx + (1 - alpha) * p.idx;
      tracked.push({ idx, mag: p.mag });
      used.add(closest.idx);
    } else {
      tracked.push(p);
    }
  }
  
  return tracked;
}

function detectPeaks(mag, threshold = 0.01) {
  let currPeaks = [];
  for (let k = 1; k < mag.length - 1; k++) {
    if (mag[k] > threshold && mag[k] > mag[k-1] && mag[k] > mag[k+1]) {
      currPeaks.push({ idx: k, mag: mag[k] });
    }
  }
  
  peaks = trackPeaks(prevPeaks, currPeaks);
  prevPeaks = peaks;
  
  peakGroups = [];
  const covered = new Uint8Array(mag.length);
  
  for (let p of peaks) {
    const group = [];
    for (let k = Math.max(0, Math.floor(p.idx) - 3); k <= Math.min(mag.length - 1, Math.floor(p.idx) + 3); k++) {
      if (!covered[k]) {
        group.push(k);
        covered[k] = 1;
      }
    }
    peakGroups.push({ peak: p, bins: group });
  }
}

// ═══════════════════════════════════════════════════
// 3. WEIGHTED PHASE LOCKING
// ═══════════════════════════════════════════════════

function applyWeightedPhaseLocking(phase, peakWidth) {
  for (let group of peakGroups) {
    const peakIdx = Math.floor(group.peak.idx);
    const peakPhase = phase[peakIdx];
    
    let deltaPhase = phase[peakIdx] - prevPhase[peakIdx];
    deltaPhase -= Math.round(deltaPhase / (2 * Math.PI)) * (2 * Math.PI);
    
    const sigma = peakWidth * 2;
    for (let k of group.bins) {
      const dist = Math.abs(k - peakIdx);
      const weight = Math.exp(-(dist * dist) / (sigma * sigma));
      phase[k] = phase[k] * (1 - weight) + (prevPhase[k] + deltaPhase) * weight;
    }
  }
  
  prevPhase.set(phase);
}

// ═══════════════════════════════════════════════════
// 4. PHASE ACCUMULATION (global continuity)
// ═══════════════════════════════════════════════════

function accumulatePhase(phase) {
  for (let i = 0; i < phase.length; i++) {
    let delta = phase[i] - prevPhase[i];
    
    // Unwrap
    while (delta > Math.PI) delta -= 2 * Math.PI;
    while (delta < -Math.PI) delta += 2 * Math.PI;
    
    // Accumulate
    phase[i] = prevPhaseLocked[i] + delta;
    prevPhaseLocked[i] = phase[i];
  }
}

// ═══════════════════════════════════════════════════
// 5. SPECTRAL INERTIA
// ═══════════════════════════════════════════════════

function applySpectralInertia(currMag, freezeMag, inertia) {
  for (let i = 0; i < currMag.length; i++) {
    currMag[i] = currMag[i] * (1 - inertia) + freezeMag[i] * inertia;
  }
}

// ═══════════════════════════════════════════════════
// 6. FREEZE + INTERPOLATION
// ═══════════════════════════════════════════════════

function storeFreezeFrame(mag, phase) {
  const frame = freezeBuffer[freezeWriteIdx];
  frame.mag.set(mag);
  frame.phase.set(phase);
  freezeWriteIdx = (freezeWriteIdx + 1) % FREEZE_BUFFER_SIZE;
}

function applyFreezeInterp(mag, phase, freezeAmount) {
  if (!state.freezeActive || freezeBuffer.length === 0) return;
  
  freezeIndex += freezeAmount * 0.01;
  freezeIndex = freezeIndex % FREEZE_BUFFER_SIZE;
  
  const idx1 = Math.floor(freezeIndex);
  const idx2 = (idx1 + 1) % FREEZE_BUFFER_SIZE;
  const interp = freezeIndex % 1;
  
  const frame1 = freezeBuffer[idx1];
  const frame2 = freezeBuffer[idx2];
  
  const inertiaAmount = state.smear * 0.8;
  
  for (let k = 0; k < FFT_BINS; k++) {
    const frozenMag = frame1.mag[k] * (1 - interp) + frame2.mag[k] * interp;
    mag[k] = mag[k] * (1 - freezeAmount) + frozenMag * freezeAmount;
  }
  
  const inertiaMag = new Float32Array(FFT_BINS);
  for (let k = 0; k < FFT_BINS; k++) {
    inertiaMag[k] = mag[k];
  }
  applySpectralInertia(mag, inertiaMag, inertiaAmount);
  
  for (let k = 0; k < FFT_BINS; k++) {
    const frozenPhase = frame1.phase[k] * (1 - interp) + frame2.phase[k] * interp;
    phase[k] = phase[k] * (1 - freezeAmount) + frozenPhase * freezeAmount;
  }
  
  const jitter = state.intensity * 0.001;
  for (let k = 0; k < FFT_BINS; k++) {
    phase[k] += (Math.random() - 0.5) * jitter;
  }
}

// ═══════════════════════════════════════════════════
// 7. ENERGY-AWARE RANDOMIZATION (no random en bajos)
// ═══════════════════════════════════════════════════

function applyEnergyWeightedRandom(phase, mag, amount) {
  const spread = amount * Math.PI;
  for (let i = 10; i < phase.length; i++) { // skip bins 0-9 (lows)
    const energy = mag[i];
    const rand = (Math.random() - 0.5) * spread;
    
    const weight = 1 / (1 + energy * 15);
    phase[i] += rand * weight;
  }
}

// ═══════════════════════════════════════════════════
// 8. SPECTRAL BIAS MIX
// ═══════════════════════════════════════════════════

function spectralBiasMix(mix, binIdx, totalBins) {
  const f = binIdx / totalBins;
  return mix * f + (1 - f) * (1 - mix);
}

function applyCrossPhaseBlendingWithBias(magA, magB, phaseA, phaseB, mix) {
  for (let k = 0; k < FFT_BINS; k++) {
    const biasedMix = spectralBiasMix(mix, k, FFT_BINS);
    
    const reA = magA[k] * Math.cos(phaseA[k]);
    const imA = magA[k] * Math.sin(phaseA[k]);
    const reB = magB[k] * Math.cos(phaseB[k]);
    const imB = magB[k] * Math.sin(phaseB[k]);
    
    const re = reA * (1 - biasedMix) + reB * biasedMix;
    const im = imA * (1 - biasedMix) + imB * biasedMix;
    
    tempMag[k] = Math.sqrt(re * re + im * im);
    tempPhase[k] = Math.atan2(im, re);
  }
  
  magA.set(tempMag);
  phaseA.set(tempPhase);
}

// ═══════════════════════════════════════════════════
// 9. MAGNITUDE NORMALIZATION (post-IFFT)
// ═══════════════════════════════════════════════════

function normalizeFrame(buffer, target = 0.9) {
  let peak = 0;
  for (let i = 0; i < buffer.length; i++) {
    const v = Math.abs(buffer[i]);
    if (v > peak) peak = v;
  }
  const gain = peak > 0 ? target / peak : 1;
  for (let i = 0; i < buffer.length; i++) {
    buffer[i] *= gain;
  }
}

// ═══════════════════════════════════════════════════
// DFT + IFFT
// ═══════════════════════════════════════════════════

function simpleDFT(signal, fftSize) {
  const bins = fftSize / 2;
  const mag = new Float32Array(bins);
  const phase = new Float32Array(bins);
  
  for (let k = 0; k < bins; k++) {
    let realSum = 0, imagSum = 0;
    for (let n = 0; n < Math.min(signal.length, fftSize); n++) {
      const angle = -2 * Math.PI * k * n / fftSize;
      realSum += signal[n] * Math.cos(angle);
      imagSum += signal[n] * Math.sin(angle);
    }
    mag[k] = Math.sqrt(realSum * realSum + imagSum * imagSum) / fftSize;
    phase[k] = Math.atan2(imagSum, realSum);
  }
  
  return { mag, phase };
}

function reconstructFromFFT(mag, phase, length) {
  const output = new Float32Array(length);
  const fftSize = mag.length * 2;
  
  for (let n = 0; n < length; n++) {
    let sample = 0;
    for (let k = 0; k < mag.length; k++) {
      const angle = 2 * Math.PI * k * n / fftSize;
      sample += mag[k] * Math.cos(angle + phase[k]);
    }
    output[n] = sample * 0.5;
  }
  
  return output;
}

// ═══════════════════════════════════════════════════
// v9.3 UNIFIED PIPELINE (+ transient bypass + phase accum + normalization)
// ═══════════════════════════════════════════════════

function processSpectralFrame(magA, magB, phaseA, phaseB, isTransient) {
  // Reduce processing on transients (preserve attacks)
  const transientMix = isTransient ? 0.2 : 1.0;
  
  // STEP 1: Cross-magnitude
  const mag = new Float32Array(FFT_BINS);
  for (let k = 0; k < FFT_BINS; k++) {
    const blendA = magA[k] * (1 - state.mixAB);
    const blendB = magB[k] * state.mixAB;
    mag[k] = Math.sqrt(blendA * blendB);
  }
  
  // STEP 2: FORM SHIFT
  const formShift = Math.pow(2, (state.form - 0.5) * 1.6);
  const formMag = new Float32Array(FFT_BINS);
  for (let k = 0; k < FFT_BINS; k++) {
    const idx = Math.floor(k / formShift);
    if (idx >= 0 && idx < FFT_BINS) {
      formMag[k] = mag[idx];
    }
  }
  mag.set(formMag);
  
  // STEP 3: SMEAR
  for (let k = 0; k < mag.length; k++) {
    prevMag[k] = prevMag[k] * 0.85 + mag[k] * 0.15;
    const smear = state.smear * 0.7 * transientMix;
    mag[k] = mag[k] * (1 - smear) + prevMag[k] * smear;
  }
  
  // STEP 4: FREEZE
  if (state.freezeActive) {
    storeFreezeFrame(mag, phaseA);
    applyFreezeInterp(mag, phaseA, state.freezeAmount);
  }
  
  // STEP 5: PEAKS + TEMPORAL TRACKING
  detectPeaks(mag, 0.02);
  
  // STEP 6: WEIGHTED PHASE LOCK
  const peakWidth = state.form * 8;
  applyWeightedPhaseLocking(phaseA, peakWidth);
  let phase = phaseA;
  
  // STEP 7: CROSS-PHASE + BIAS
  applyCrossPhaseBlendingWithBias(mag, mag, phase, phaseB, state.mixAB);
  phase = tempPhase;
  
  // STEP 8: ENERGY-AWARE RANDOM
  const randAmt = STATES[state.matter].randomAmount * state.intensity * transientMix;
  applyEnergyWeightedRandom(phase, mag, randAmt);
  
  // STEP 9: PHASE ACCUMULATION (global continuity)
  accumulatePhase(phase);
  
  return { mag, phase };
}

// ═══════════════════════════════════════════════════
// AUDIO CONTEXT
// ═══════════════════════════════════════════════════

function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}

function initAC() {
  if (AC && analyser) return Promise.resolve();
  
  return new Promise(resolve => {
    AC = getAC();
    analyser = AC.createAnalyser();
    analyser.fftSize = 256;
    
    const silentBuf = AC.createBuffer(1, 1, AC.sampleRate);
    const silentSrc = AC.createBufferSource();
    silentSrc.buffer = silentBuf;
    silentSrc.connect(AC.destination);
    silentSrc.start();
    
    setTimeout(() => {
      setStatus('ready · clean recording chain');
      resolve();
    }, 100);
  });
}

function buildMatterGrid() {
  const grid = document.getElementById('matterGrid');
  Object.keys(STATES).forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'matter-btn' + (label === 'Ritual' ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      state.matter = label;
      document.querySelectorAll('.matter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setStatus(label, false);
    });
    grid.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════
// IMPROVED MIC RECORDING (clean monitoring chain)
// ═══════════════════════════════════════════════════

async function recMic(slot) {
  const ac = getAC();
  await ac.resume();
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1
      }
    });
    
    const chunks = [];
    const mr = new MediaRecorder(stream);
    
    // CLEAN MONITOR CHAIN
    const micSrc = ac.createMediaStreamSource(stream);
    const hpf = ac.createBiquadFilter();
    hpf.type = "highpass";
    hpf.frequency.value = 80;
    
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -24;
    comp.knee.value = 30;
    comp.ratio.value = 3;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    
    const gain = ac.createGain();
    gain.gain.value = 1.2;
    
    if (analyser) {
      gain.connect(analyser);
      analyser.connect(ac.destination);
    }
    
    micSrc.connect(hpf);
    hpf.connect(comp);
    comp.connect(gain);
    
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = async () => {
      const blob = new Blob(chunks, { type: 'audio/webm' });
      const ab = await blob.arrayBuffer();
      
      ac.decodeAudioData(ab.slice(0), buf => {
        const data = buf.getChannelData(0);
        
        // SOFT GATE (post-processing)
        const threshold = 0.02;
        for (let i = 0; i < data.length; i++) {
          const a = Math.abs(data[i]);
          if (a < threshold) {
            data[i] *= (a / threshold);
          }
        }
        
        // NORMALIZE
        let peak = 0;
        for (let i = 0; i < data.length; i++) {
          const v = Math.abs(data[i]);
          if (v > peak) peak = v;
        }
        const gainNorm = peak > 0 ? 0.9 / peak : 1;
        for (let i = 0; i < data.length; i++) {
          data[i] *= gainNorm;
        }
        
        if (slot === 'A') {
          state.bufA = buf;
          document.getElementById('nameA').textContent = 'A · ' + buf.duration.toFixed(2) + 's';
          document.getElementById('recA').classList.add('active');
        } else {
          state.bufB = buf;
          document.getElementById('nameB').textContent = 'B · ' + buf.duration.toFixed(2) + 's';
          document.getElementById('recB').classList.add('active');
        }
        
        setStatus(slot + ' captured', false);
        
        // cleanup
        stream.getTracks().forEach(t => t.stop());
        micSrc.disconnect();
        hpf.disconnect();
        comp.disconnect();
        gain.disconnect();
      });
    };
    
    mr.start();
    document.getElementById('rec' + slot).classList.add('recording');
    document.getElementById('rec' + slot).textContent = '■ STOP';
    setStatus('recording ' + slot, false);
    
    const stopHandler = () => {
      if (mr.state !== "inactive") mr.stop();
      document.getElementById('rec' + slot).classList.remove('recording');
      document.getElementById('rec' + slot).textContent = '● REC';
      document.getElementById('rec' + slot).removeEventListener('click', stopHandler);
    };
    
    document.getElementById('rec' + slot).addEventListener('click', stopHandler);
    
  } catch (err) {
    setStatus('error: ' + err.message, true);
  }
}

// PRESET MANAGER
function updatePresetList() {
  const list = document.getElementById('presetList');
  list.innerHTML = '';
  Object.keys(presets).forEach(name => {
    const item = document.createElement('div');
    item.style.cssText = 'display:grid;grid-template-columns:1fr auto auto;gap:4px;align-items:center;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:4px;padding:4px;';
    item.innerHTML = `<div style="font-size:9px;color:var(--cyan);">${name}</div><button class="lib-btn" data-p="${name}">LD</button><button class="lib-btn" data-p="${name}" style="color:var(--magenta);">RM</button>`;
    list.appendChild(item);
    
    item.querySelector('[data-p]').addEventListener('click', () => {
      const p = presets[name];
      Object.keys(p).forEach(k => {
        state[k] = p[k];
        const sid = k === 'dryWet' ? 'dryWetSlider' : k === 'reverb' ? 'reverbSlider' : k === 'intensity' ? 'intensitySlider' : k + 'Slider';
        const vid = 'val' + k.charAt(0).toUpperCase() + k.slice(1);
        if (document.getElementById(sid)) {
          document.getElementById(sid).value = Math.round(p[k] * 100);
          if (document.getElementById(vid)) document.getElementById(vid).textContent = Math.round(p[k] * 100);
        }
      });
    });
    
    item.querySelectorAll('button')[1].addEventListener('click', () => {
      delete presets[name];
      localStorage.setItem('voxdustPresets', JSON.stringify(presets));
      updatePresetList();
    });
  });
}

document.getElementById('btnPreset').addEventListener('click', () => {
  const ui = document.getElementById('presetUI');
  ui.style.display = ui.style.display === 'none' ? 'flex' : 'none';
  if (ui.style.display === 'flex') updatePresetList();
});

document.getElementById('btnSavePreset').addEventListener('click', () => {
  const name = document.getElementById('presetName').value.trim();
  if (!name) return;
  presets[name] = {
    form: state.form, smear: state.smear, dryWet: state.dryWet,
    intensity: state.intensity, reverb: state.reverb, matter: state.matter
  };

  document.getElementById('presetName').value = '';

});

// PLAYBACK
document.getElementById('btnPlay').addEventListener('click', () => {
  if (!state.bufA || !state.bufB) {
    setStatus('rec A and B first', true);
    return;
  }
  state.isPlaying = true;
  document.getElementById('btnPlay').classList.add('on');
  document.getElementById('btnStop').classList.remove('disabled');
  document.getElementById('playhead').style.display = 'block';
  setStatus('playing', false);
  playLoop();
});

document.getElementById('btnStop').addEventListener('click', () => {
  state.isPlaying = false;
  document.getElementById('btnPlay').classList.remove('on');
  document.getElementById('btnStop').classList.add('disabled');
  document.getElementById('playhead').style.display = 'none';
  playingSources.forEach(src => { try { src.stop(); } catch(e) {} });
  playingSources = [];
  setStatus('stopped', false);
});

function playLoop() {
  if (!state.isPlaying || !state.bufA || !state.bufB) return;
  
  const loopDur = Math.min(state.bufA.duration, state.bufB.duration) / state.playSpeed;
  const srcA = AC.createBufferSource();
  const srcB = AC.createBufferSource();
  
  srcA.buffer = state.bufA;
  srcB.buffer = state.bufB;
  srcA.playbackRate.value = state.playSpeed;
  srcB.playbackRate.value = state.playSpeed;
  
  const gainA = AC.createGain();
  const gainB = AC.createGain();
  
  gainA.gain.value = Math.max(0, 1 - state.mixAB * 2);
  gainB.gain.value = Math.max(0, (state.mixAB - 0.5) * 2);
  
  srcA.connect(gainA);
  srcB.connect(gainB);
  gainA.connect(AC.destination);
  gainB.connect(AC.destination);
  analyser.connect(AC.destination);
  
  srcA.start(0);
  srcB.start(0);
  
  playingSources.push(srcA, srcB);
  
  const startTime = AC.currentTime;
  const updateInterval = setInterval(() => {
    if (!state.isPlaying) {
      clearInterval(updateInterval);
      try { srcA.stop(); srcB.stop(); } catch(e) {}
      playingSources = playingSources.filter(s => s !== srcA && s !== srcB);
      return;
    }
    
    const elapsed = AC.currentTime - startTime;
    if (elapsed >= loopDur) {
      clearInterval(updateInterval);
      try { srcA.stop(); srcB.stop(); } catch(e) {}
      playingSources = playingSources.filter(s => s !== srcA && s !== srcB);
      playLoop();
    } else {
      const progress = elapsed / loopDur;
      document.getElementById('playhead').style.left = (progress * document.getElementById('canvasWrap').offsetWidth) + 'px';
    }
  }, 50);
}

// REC OUT
document.getElementById('btnRec').addEventListener('click', async () => {
  if (!state.bufA || !state.bufB) {
    setStatus('rec A and B first', true);
    return;
  }
  
  const btn = document.getElementById('btnRec');
  btn.classList.add('disabled');
  btn.textContent = 'PROCESSING…';
  
  const loopDur = Math.min(state.bufA.duration, state.bufB.duration);
  
  const srcA = AC.createBufferSource();
  const srcB = AC.createBufferSource();
  srcA.buffer = state.bufA;
  srcB.buffer = state.bufB;
  srcA.loop = true;
  srcB.loop = true;
  
  const gainA = AC.createGain();
  const gainB = AC.createGain();
  gainA.gain.value = Math.max(0, 1 - state.mixAB * 2);
  gainB.gain.value = Math.max(0, (state.mixAB - 0.5) * 2);
  
  const processor = AC.createScriptProcessor(2048, 2, 1);
  const outputBuffer = AC.createBuffer(1, Math.ceil(loopDur * AC.sampleRate), AC.sampleRate);
  const outData = outputBuffer.getChannelData(0);
  let outIdx = 0;
  
  let fftBufferA = new Float32Array(FFT_SIZE);
  let fftBufferB = new Float32Array(FFT_SIZE);
  let fftIdxA = 0, fftIdxB = 0;
  
  let reverbTail = new Float32Array(8192);
  let reverbIdx = 0;
  
  processor.onaudioprocess = e => {
    const inL = e.inputBuffer.getChannelData(0);
    const inR = e.inputBuffer.getChannelData(1);
    const out = e.outputBuffer.getChannelData(0);
    
    const bufAData = state.bufA.getChannelData(0);
    const bufBData = state.bufB.getChannelData(0);
    const lenA = bufAData.length;
    const lenB = bufBData.length;
    
    for (let i = 0; i < out.length && outIdx < outData.length; i++) {
      let sample = (inL[i] || 0) + (inR[i] || 0);
      
      fftBufferA[fftIdxA] = bufAData[Math.floor(outIdx * lenA / outData.length) % lenA];
      fftBufferB[fftIdxB] = bufBData[Math.floor(outIdx * lenB / outData.length) % lenB];
      fftIdxA++;
      fftIdxB++;
      
      if (fftIdxA >= FFT_SIZE) {
        const { mag: magA, phase: phaseA } = simpleDFT(fftBufferA, FFT_SIZE);
        const { mag: magB, phase: phaseB } = simpleDFT(fftBufferB, FFT_SIZE);
        
        // TRANSIENT DETECTION
        const isTransient = detectTransient(prevFrame, fftBufferA, 1.8);
        prevFrame.set(fftBufferA);
        
        const { mag, phase } = processSpectralFrame(magA, magB, phaseA, phaseB, isTransient);
        
        let reconstructed = reconstructFromFFT(mag, phase, FFT_SIZE);
        
        // NORMALIZE POST-IFFT
        normalizeFrame(reconstructed, 0.9);
        
        sample = reconstructed[0];
        
        fftIdxA = 0;
        fftIdxB = 0;
      }
      
      const drySignal = sample;
      const wetSignal = reverbTail[reverbIdx % reverbTail.length] || 0;
      reverbTail[reverbIdx % reverbTail.length] = sample * 0.6;
      reverbIdx++;
      
      let processed = drySignal * (1 - state.reverb) + wetSignal * state.reverb;
      processed = processed * (1 - state.dryWet) + processed * state.dryWet;
      processed *= (0.5 + state.intensity * 0.5);
      
      out[i] = processed;
      outData[outIdx++] = processed;
    }
  };
  
  srcA.connect(gainA);
  srcB.connect(gainB);
  gainA.connect(processor);
  gainB.connect(processor);
  processor.connect(AC.destination);
  
  srcA.start(0);
  srcB.start(0);
  
  await new Promise(r => setTimeout(r, Math.ceil(loopDur * 1000) + 100));
  
  srcA.stop();
  srcB.stop();
  processor.disconnect();
  
  btn.classList.remove('disabled');
  btn.textContent = '⏺ REC OUT';
  
  const take = {
    id: 'take_' + Date.now(),
    buffer: outputBuffer,
    matter: state.matter,
    duration: loopDur,
    time: new Date().toLocaleTimeString(),
  };
  
  const list = document.getElementById('libList');
  if (list.firstChild.textContent.includes('no takes')) list.innerHTML = '';
  
  const item = document.createElement('div');
  item.className = 'lib-item';
  item.innerHTML = `<div class="lib-info">${take.matter} · ${loopDur.toFixed(1)}s</div><button class="lib-btn" data-id="${take.id}">WAV</button>`;
  list.appendChild(item);
  
  if (!window.voxTakes) window.voxTakes = {};
  window.voxTakes[take.id] = take;
  
  item.querySelector('button').addEventListener('click', () => exportWAV(take));
  
  setStatus('recorded', false);
});

function exportWAV(take) {
  const buf = take.buffer;
  const len = buf.length;
  const sampleRate = buf.sampleRate;
  const channels = buf.numberOfChannels;
  
  const channelData = [];
  for (let i = 0; i < channels; i++) channelData.push(buf.getChannelData(i));
  
  const bytesPerSample = 2;
  const blockAlign = channels * bytesPerSample;
  const byteRate = sampleRate * blockAlign;
  const dataSize = len * blockAlign;
  
  const arrayBuffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(arrayBuffer);
  
  const writeString = (offset, string) => {
    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
  };
  
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);
  
  let offset = 44;
  for (let i = 0; i < len; i++) {
    for (let ch = 0; ch < channels; ch++) {
      const s = Math.max(-1, Math.min(1, channelData[ch][i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      offset += 2;
    }
  }
  
  const blob = new Blob([arrayBuffer], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `VoxDust_${take.matter}_${take.id.slice(-4)}.wav`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  setStatus('exported', false);
}

// CANVAS
function drawAnalyser() {
  const canvas = document.getElementById('analyser');
  if (!canvas || !analyser) {
    requestAnimationFrame(drawAnalyser);
    return;
  }
  
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  
  ctx.fillStyle = 'rgba(19,17,31,1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(dataArray);
  
  ctx.strokeStyle = '#9944ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const sliceWidth = canvas.width / dataArray.length;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = dataArray[i] / 256;
    const y = canvas.height - (v * canvas.height);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.stroke();
  
  requestAnimationFrame(drawAnalyser);
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isError ? ' error' : ' active');
}

async function init() {
  buildMatterGrid();
  await initAC();
  drawAnalyser();
}

init();
