<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoxDust v12.5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg1:#13111f;--bg2:#1b1726;
  --border:rgba(153,68,255,.18);--glow:rgba(153,68,255,.08);
  --canvas-bg:rgba(153,68,255,.06);
  --cyan:#00ffff;--magenta:#ff00ff;--violet:#9944ff;--violetlt:#b580ff;
  --btn:rgba(153,68,255,.07);--active:rgba(153,68,255,.18);
  --white:rgba(255,255,255,.92);--dim:rgba(255,255,255,.38);
}
body{background:linear-gradient(155deg,var(--bg1),var(--bg2));min-height:100vh;color:var(--white);font-family:'Inter',sans-serif;font-size:13px;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px;gap:12px;overflow-x:hidden;}
.logo{font-family:'JetBrains Mono',monospace;font-style:italic;letter-spacing:.04em;}
.logo .spuk{font-weight:800;color:var(--white);font-size:22px;}
.logo .lab{font-weight:300;color:var(--cyan);font-size:22px;}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:flex-start;}
.version{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);}
.canvas-wrap{width:100%;max-width:480px;background:var(--canvas-bg);border:1px solid var(--border);border-radius:12px;height:100px;position:relative;overflow:hidden;}
canvas#analyser{width:100%;height:100%;display:block;}
.playhead{position:absolute;top:0;left:0;width:2px;height:100%;background:var(--cyan);opacity:.8;pointer-events:none;z-index:10;}
.controls-row{width:100%;max-width:480px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ctrl-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);flex-shrink:0;}
.slots{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.slot{background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;}
.slot-header{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:11px;color:var(--violetlt);letter-spacing:.08em;}
.slot-name{font-size:9px;color:var(--dim);min-height:12px;overflow:hidden;text-overflow:ellipsis;}
.slot-btn{width:100%;padding:6px;border:1px solid var(--border);background:var(--btn);border-radius:6px;color:var(--white);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:8px;cursor:pointer;transition:all .15s;}
.slot-btn:active{background:var(--active);color:var(--cyan);}
.slot-btn.active{border-color:var(--violet);}
.slot-btn.recording{border-color:#ff3030;color:#ff3030;animation:rb .6s infinite;}
@keyframes rb{0%,100%{opacity:1;}50%{opacity:.3;}}
.matter-section{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.matter-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.matter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.matter-btn{padding:6px 0;border:1px solid var(--border);background:var(--btn);border-radius:6px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:8px;color:var(--dim);cursor:pointer;transition:all .15s;}
.matter-btn.active{background:var(--active);color:var(--cyan);border-color:var(--violet);}
.spectral-section{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.spectral-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;margin-bottom:2px;}
.spectral-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.spectral-item{display:flex;flex-direction:column;gap:4px;}
.spectral-val{font-size:9px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.06);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;border:none;}
.transport{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tbtn{padding:8px 0;border:1px solid var(--border);background:var(--btn);border-radius:8px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:8px;color:var(--white);cursor:pointer;text-align:center;transition:all .15s;letter-spacing:.04em;}
.tbtn:active{background:var(--active);color:var(--cyan);}
.tbtn.disabled{opacity:.35;pointer-events:none;}
.tbtn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,255,.08);}
.status{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--dim);text-align:center;min-height:12px;max-width:480px;}
.status.active{color:var(--cyan);}
.status.error{color:var(--magenta);}
.library{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.lib-title{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.lib-list{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.lib-item{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:8px;color:var(--dim);font-family:'JetBrains Mono',monospace;font-style:italic;display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center;}
.lib-info{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.lib-info-name{color:var(--white);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-info-meta{color:var(--dim);font-size:7px;}
.lib-btns{display:flex;gap:2px;flex-wrap:wrap;}
.lib-btn{padding:4px 6px;font-size:7px;border:1px solid var(--border);background:rgba(0,0,0,.3);border-radius:3px;cursor:pointer;color:var(--cyan);flex-shrink:0;transition:all .15s;}
.lib-btn:active{background:var(--active);}
.lib-btn.down{color:var(--magenta);}
.presets{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.preset-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.preset-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.preset-btn{padding:10px;border:1px solid var(--border);background:var(--btn);border-radius:6px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--dim);cursor:pointer;text-align:center;transition:all .15s;font-weight:bold;}
.preset-btn:active{background:var(--active);color:var(--cyan);}
.preset-btn.saved{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,255,.08);}
.evolve-section{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.evolve-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.evolve-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
select{background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;border-radius:5px;padding:4px;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="spuk">SPUK</span><span class="lab">LAB</span></div>
  <div class="version">VoxDust v12.5</div>
</header>

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="analyser"></canvas>
  <div class="playhead" id="playhead" style="display:none;"></div>
</div>

<div class="controls-row">
  <span class="ctrl-label">STRETCH</span>
  <input type="range" id="stretchSlider" min="0.5" max="2" step="0.1" value="1" style="flex:1;max-width:70px;">
  <span id="valStretch" style="font-size:9px;color:var(--cyan);min-width:28px;">1.0x</span>
  <span class="ctrl-label" style="margin-left:auto;">A↔B</span>
  <input type="range" id="mixSlider" min="0" max="100" value="50" style="flex:1;max-width:70px;">
  <span id="valMix" style="font-size:9px;color:var(--cyan);min-width:20px;">50</span>
</div>

<div class="slots">
  <div class="slot">
    <div class="slot-header">MIC A</div>
    <div class="slot-name" id="nameA">ready</div>
    <button class="slot-btn" id="recA">● REC</button>
  </div>
  <div class="slot">
    <div class="slot-header">MIC B</div>
    <div class="slot-name" id="nameB">ready</div>
    <button class="slot-btn" id="recB">● REC</button>
  </div>
</div>

<div class="matter-section">
  <div class="matter-label">STATE</div>
  <div class="matter-grid" id="matterGrid"></div>
</div>

<div class="spectral-section">
  <div class="spectral-label">SPECTRAL</div>
  <div class="spectral-row">
    <div class="spectral-item">
      <div class="spectral-val" id="valForm">50</div>
      <div style="font-size:8px;color:var(--dim);">FORM</div>
      <input type="range" id="formSlider" min="0" max="100" value="50">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valSmear">50</div>
      <div style="font-size:8px;color:var(--dim);">SMEAR</div>
      <input type="range" id="smearSlider" min="0" max="100" value="50">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valIntensity">50</div>
      <div style="font-size:8px;color:var(--dim);">INTENSITY</div>
      <input type="range" id="intensitySlider" min="0" max="100" value="50">
    </div>
  </div>
  <div class="spectral-row" style="margin-top:8px;">
    <div class="spectral-item">
      <div class="spectral-val" id="valReverb">30</div>
      <div style="font-size:8px;color:var(--dim);">REVERB</div>
      <input type="range" id="reverbSlider" min="0" max="100" value="30">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valDryWet">50</div>
      <div style="font-size:8px;color:var(--dim);">DRY/WET</div>
      <input type="range" id="dryWetSlider" min="0" max="100" value="50">
    </div>
  </div>
</div>

<div class="transport">
  <button class="tbtn" id="btnPlay">▶ PLAY</button>
  <button class="tbtn disabled" id="btnStop">⏹ STOP</button>
  <button class="tbtn" id="btnRec">⏺ REC</button>
</div>

<div class="status" id="status">tap REC A / REC B</div>

<div class="library">
  <div class="lib-title">LIBRARY</div>
  <div class="lib-list" id="takeList"><div style="font-size:9px;color:rgba(255,255,255,.15);padding:4px;">no takes</div></div>
</div>

<div class="evolve-section">
  <div class="evolve-label">EVOLUTION</div>
  <div class="evolve-row">
    <select id="evolveFrom" style="flex:0;width:60px;">
      <option value="">FROM</option>
    </select>
    <input type="range" id="evolveSlider" min="0" max="100" value="0" style="flex:1;">
    <select id="evolveTo" style="flex:0;width:60px;">
      <option value="">TO</option>
    </select>
  </div>
</div>

<div class="presets">
  <div class="preset-label">PRESETS (tap: load / hold: save)</div>
  <div class="preset-grid" id="presetGrid"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// VOXDUST v12.5 — Fixed A-B + Downmix + Multi-Preset Evolution
// ═══════════════════════════════════════════════════════════════════════════

var AC, analyser, micStream;
var state = {
  form: 0.5, smear: 0.5, intensity: 0.5, reverb: 0.3, dryWet: 0.5,
  matter: 'Ritual', mixAB: 0.5, timeStretch: 1,
  bufA: null, bufB: null, isPlaying: false,
};

var micRecordingState = { recording: false, processor: null, chunksA: [], chunksB: [] };
var takes = JSON.parse(localStorage.getItem('voxdustTakes')) || {};
var presets = JSON.parse(localStorage.getItem('voxdustPresets')) || {};

const STATES = { Susurro:0.1, Eco:0.8, Ritual:0.3, Máquina:0.2, Híbrido:0.4, Colapso:0.9 };

// ═══════════════════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════════════════

function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}

async function initAC() {
  if (AC && analyser) return;
  AC = getAC();
  analyser = AC.createAnalyser();
  analyser.fftSize = 256;
  
  const buf = AC.createBuffer(1, 1, AC.sampleRate);
  const src = AC.createBufferSource();
  src.buffer = buf;
  src.connect(AC.destination);
  src.start();
  
  setTimeout(() => setStatus('ready v12.5'), 100);
}

function buildMatterGrid() {
  const grid = document.getElementById('matterGrid');
  Object.keys(STATES).forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'matter-btn' + (label === 'Ritual' ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      state.matter = label;
      document.querySelectorAll('.matter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    grid.appendChild(btn);
  });
}

function buildPresets() {
  const grid = document.getElementById('presetGrid');
  const fromSelect = document.getElementById('evolveFrom');
  const toSelect = document.getElementById('evolveTo');
  
  for (let i = 1; i <= 5; i++) {
    // Preset button
    const btn = document.createElement('button');
    btn.className = 'preset-btn' + (presets['P' + i] ? ' saved' : '');
    btn.textContent = 'P' + i;
    
    let touchStartTime = 0;
    
    btn.addEventListener('mousedown', () => { touchStartTime = Date.now(); });
    btn.addEventListener('mouseup', () => {
      const elapsed = Date.now() - touchStartTime;
      if (elapsed < 300) {
        loadPreset('P' + i);
      } else {
        savePreset('P' + i);
        btn.classList.add('saved');
        updateEvolveSelects();
      }
    });
    
    btn.addEventListener('touchstart', () => { touchStartTime = Date.now(); });
    btn.addEventListener('touchend', () => {
      const elapsed = Date.now() - touchStartTime;
      if (elapsed < 300) {
        loadPreset('P' + i);
      } else {
        savePreset('P' + i);
        btn.classList.add('saved');
        updateEvolveSelects();
      }
    });
    
    grid.appendChild(btn);
    
    // Evolution select options
    const opt1 = document.createElement('option');
    opt1.value = 'P' + i;
    opt1.textContent = 'P' + i;
    fromSelect.appendChild(opt1);
    
    const opt2 = document.createElement('option');
    opt2.value = 'P' + i;
    opt2.textContent = 'P' + i;
    toSelect.appendChild(opt2);
  }
}

function updateEvolveSelects() {
  // Remove options, rebuild
  const fromSelect = document.getElementById('evolveFrom');
  const toSelect = document.getElementById('evolveTo');
  
  fromSelect.innerHTML = '<option value="">FROM</option>';
  toSelect.innerHTML = '<option value="">TO</option>';
  
  for (let i = 1; i <= 5; i++) {
    if (presets['P' + i]) {
      const opt1 = document.createElement('option');
      opt1.value = 'P' + i;
      opt1.textContent = 'P' + i;
      fromSelect.appendChild(opt1);
      
      const opt2 = document.createElement('option');
      opt2.value = 'P' + i;
      opt2.textContent = 'P' + i;
      toSelect.appendChild(opt2);
    }
  }
}

function savePreset(name) {
  presets[name] = {
    form: state.form, smear: state.smear, intensity: state.intensity,
    reverb: state.reverb, dryWet: state.dryWet, matter: state.matter,
  };
  localStorage.setItem('voxdustPresets', JSON.stringify(presets));
  setStatus(name + ' saved', false);
}

function loadPreset(name) {
  if (!presets[name]) {
    setStatus(name + ' empty', true);
    return;
  }
  
  const p = presets[name];
  state.form = p.form;
  state.smear = p.smear;
  state.intensity = p.intensity;
  state.reverb = p.reverb;
  state.dryWet = p.dryWet;
  state.matter = p.matter;
  
  document.getElementById('formSlider').value = p.form * 100;
  document.getElementById('valForm').textContent = Math.round(p.form * 100);
  document.getElementById('smearSlider').value = p.smear * 100;
  document.getElementById('valSmear').textContent = Math.round(p.smear * 100);
  document.getElementById('intensitySlider').value = p.intensity * 100;
  document.getElementById('valIntensity').textContent = Math.round(p.intensity * 100);
  document.getElementById('reverbSlider').value = p.reverb * 100;
  document.getElementById('valReverb').textContent = Math.round(p.reverb * 100);
  document.getElementById('dryWetSlider').value = p.dryWet * 100;
  document.getElementById('valDryWet').textContent = Math.round(p.dryWet * 100);
  
  document.querySelectorAll('.matter-btn').forEach(b => {
    if (b.textContent === p.matter) b.classList.add('active');
    else b.classList.remove('active');
  });
  
  setStatus(name + ' loaded', false);
}

// ═══════════════════════════════════════════════════════════════════════════
// EVOLUTION ENGINE
// ═══════════════════════════════════════════════════════════════════════════

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function easeSmooth(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

document.getElementById('evolveSlider').addEventListener('input', e => {
  const fromName = document.getElementById('evolveFrom').value;
  const toName = document.getElementById('evolveTo').value;
  
  if (!fromName || !toName) {
    return;
  }
  
  const p1 = presets[fromName];
  const p2 = presets[toName];
  
  if (!p1 || !p2) return;
  
  const t = parseFloat(e.target.value) / 100;
  
  state.form = lerp(p1.form, p2.form, easeSmooth(t));
  state.smear = lerp(p1.smear, p2.smear, easeSmooth(t));
  state.intensity = lerp(p1.intensity, p2.intensity, easeSmooth(t));
  state.reverb = lerp(p1.reverb, p2.reverb, easeSmooth(t));
  state.dryWet = lerp(p1.dryWet, p2.dryWet, easeSmooth(t));
  
  document.getElementById('formSlider').value = state.form * 100;
  document.getElementById('valForm').textContent = Math.round(state.form * 100);
  document.getElementById('smearSlider').value = state.smear * 100;
  document.getElementById('valSmear').textContent = Math.round(state.smear * 100);
  document.getElementById('intensitySlider').value = state.intensity * 100;
  document.getElementById('valIntensity').textContent = Math.round(state.intensity * 100);
  document.getElementById('reverbSlider').value = state.reverb * 100;
  document.getElementById('valReverb').textContent = Math.round(state.reverb * 100);
  document.getElementById('dryWetSlider').value = state.dryWet * 100;
  document.getElementById('valDryWet').textContent = Math.round(state.dryWet * 100);
});

// ═══════════════════════════════════════════════════════════════════════════
// MIC RECORDING
// ═══════════════════════════════════════════════════════════════════════════

async function toggleMicRecording(slot) {
  if (micRecordingState.recording) {
    micRecordingState.recording = false;
    if (micRecordingState.processor) micRecordingState.processor.disconnect();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    
    document.getElementById('rec' + slot).classList.remove('recording');
    document.getElementById('rec' + slot).textContent = '● REC';
    
    const chunks = slot === 'A' ? micRecordingState.chunksA : micRecordingState.chunksB;
    const totalSamples = chunks.reduce((s, c) => s + c.length, 0);
    const buf = AC.createBuffer(1, totalSamples, AC.sampleRate);
    const data = buf.getChannelData(0);
    
    let offset = 0;
    chunks.forEach(c => { data.set(c, offset); offset += c.length; });
    
    let peak = 0;
    for (let i = 0; i < totalSamples; i++) peak = Math.max(peak, Math.abs(data[i]));
    const gain = peak > 0 ? 0.9 / peak : 1;
    for (let i = 0; i < totalSamples; i++) data[i] *= gain;
    
    if (slot === 'A') {
      state.bufA = buf;
      document.getElementById('nameA').textContent = 'A ' + buf.duration.toFixed(1) + 's';
      document.getElementById('recA').classList.add('active');
    } else {
      state.bufB = buf;
      document.getElementById('nameB').textContent = 'B ' + buf.duration.toFixed(1) + 's';
      document.getElementById('recB').classList.add('active');
    }
    setStatus(slot + ' saved', false);
  } else {
    await getAC().resume();
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      
      micRecordingState.chunksA = [];
      micRecordingState.chunksB = [];
      micRecordingState.recording = true;
      
      const src = AC.createMediaStreamSource(micStream);
      const proc = AC.createScriptProcessor(4096, 1, 1);
      micRecordingState.processor = proc;
      
      src.connect(proc);
      proc.connect(AC.destination);
      
      proc.onaudioprocess = e => {
        const input = e.inputBuffer.getChannelData(0);
        const out = new Float32Array(input.length);
        for (let i = 0; i < input.length; i++) out[i] = input[i];
        if (slot === 'A') micRecordingState.chunksA.push(new Float32Array(out));
        else micRecordingState.chunksB.push(new Float32Array(out));
      };
      
      document.getElementById('rec' + slot).classList.add('recording');
      document.getElementById('rec' + slot).textContent = '■ STOP';
      setStatus('recording ' + slot, false);
    } catch (e) {
      setStatus('error: ' + e.message, true);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PLAYBACK
// ═══════════════════════════════════════════════════════════════════════════

document.getElementById('btnPlay').addEventListener('click', () => {
  if (!state.bufA || !state.bufB) {
    setStatus('rec A + B first', true);
    return;
  }
  
  state.isPlaying = true;
  document.getElementById('btnPlay').classList.add('on');
  document.getElementById('btnStop').classList.remove('disabled');
  document.getElementById('playhead').style.display = 'block';
  setStatus('playing', false);
  
  const loopDur = Math.min(state.bufA.duration, state.bufB.duration);
  const srcA = AC.createBufferSource();
  const srcB = AC.createBufferSource();
  
  srcA.buffer = state.bufA;
  srcB.buffer = state.bufB;
  srcA.loop = true;
  srcB.loop = true;
  
  const gainA = AC.createGain();
  const gainB = AC.createGain();
  const gainSum = AC.createGain();
  gainSum.gain.value = 1;
  
  srcA.connect(gainA);
  srcB.connect(gainB);
  gainA.connect(gainSum);
  gainB.connect(gainSum);
  gainSum.connect(AC.destination);
  analyser.connect(AC.destination);
  
  srcA.start(0);
  srcB.start(0);
  
  const playStartTime = AC.currentTime;
  const updateInterval = setInterval(() => {
    if (!state.isPlaying) {
      clearInterval(updateInterval);
      try { srcA.stop(); srcB.stop(); } catch(e) {}
      return;
    }
    
    // FIX: Linear crossfade (simple, correct)
    gainA.gain.value = 1 - state.mixAB;
    gainB.gain.value = state.mixAB;
    
    const elapsed = AC.currentTime - playStartTime;
    const loopDurAdjusted = loopDur / state.timeStretch;
    
    if (elapsed >= loopDurAdjusted) {
      clearInterval(updateInterval);
      try { srcA.stop(); srcB.stop(); } catch(e) {}
      document.getElementById('btnPlay').click();
    } else {
      const progress = elapsed / loopDurAdjusted;
      document.getElementById('playhead').style.left = (progress * document.getElementById('canvasWrap').offsetWidth) + 'px';
    }
  }, 50);
});

document.getElementById('btnStop').addEventListener('click', () => {
  state.isPlaying = false;
  document.getElementById('btnPlay').classList.remove('on');
  document.getElementById('btnStop').classList.add('disabled');
  document.getElementById('playhead').style.display = 'none';
  setStatus('stopped', false);
});

// ═══════════════════════════════════════════════════════════════════════════
// REC OUT + DOWNMIX
// ═══════════════════════════════════════════════════════════════════════════

document.getElementById('btnRec').addEventListener('click', async () => {
  if (!state.bufA || !state.bufB) {
    setStatus('rec A + B first', true);
    return;
  }
  
  const btn = document.getElementById('btnRec');
  btn.classList.add('disabled');
  btn.textContent = 'PROCESSING…';
  
  const loopDur = Math.min(state.bufA.duration, state.bufB.duration);
  const outBuf = AC.createBuffer(1, Math.ceil(loopDur * AC.sampleRate * state.timeStretch), AC.sampleRate);
  const outData = outBuf.getChannelData(0);
  let outIdx = 0;
  
  const srcA = AC.createBufferSource();
  const srcB = AC.createBufferSource();
  srcA.buffer = state.bufA;
  srcB.buffer = state.bufB;
  srcA.loop = true;
  srcB.loop = true;
  
  const gainA = AC.createGain();
  const gainB = AC.createGain();
  gainA.gain.value = 1 - state.mixAB;
  gainB.gain.value = state.mixAB;
  
  const proc = AC.createScriptProcessor(256, 2, 1);
  
  let reverbBuf = new Float32Array(8192);
  let reverbIdx = 0;
  
  proc.onaudioprocess = e => {
    const inL = e.inputBuffer.getChannelData(0);
    const inR = e.inputBuffer.numberOfChannels > 1 ? e.inputBuffer.getChannelData(1) : inL;
    
    for (let i = 0; i < inL.length && outIdx < outData.length; i++) {
      let sample = (inL[i] + inR[i]) * 0.5;
      
      const wet = reverbBuf[reverbIdx % 8192] || 0;
      reverbBuf[reverbIdx % 8192] = sample * 0.6;
      reverbIdx++;
      
      sample = sample * (1 - state.reverb) + wet * state.reverb;
      sample = sample * (1 - state.dryWet) + sample * state.dryWet;
      sample *= (0.5 + state.intensity * 0.5);
      
      outData[outIdx++] = Math.max(-1, Math.min(1, sample));
    }
  };
  
  srcA.connect(gainA);
  srcB.connect(gainB);
  gainA.connect(proc);
  gainB.connect(proc);
  proc.connect(AC.destination);
  
  srcA.start(0);
  srcB.start(0);
  
  await new Promise(r => setTimeout(r, Math.ceil(loopDur * 1000 * state.timeStretch) + 200));
  
  srcA.stop();
  srcB.stop();
  proc.disconnect();
  
  btn.classList.remove('disabled');
  btn.textContent = '⏺ REC';
  
  const take = {
    id: 'take_' + Date.now(),
    name: state.matter + '_' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
    buffer: outBuf,
    matter: state.matter,
    duration: loopDur * state.timeStretch,
    date: new Date().toLocaleDateString('es-ES', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
    timestamp: Date.now()
  };
  
  takes[take.id] = take;
  localStorage.setItem('voxdustTakes', JSON.stringify(takes));
  
  updateTakeList();
  setStatus('recorded', false);
});

function downmixWAV(take) {
  // Take already processed with A-B fade applied in REC OUT
  const buf = take.buffer;
  const len = buf.length;
  const sr = buf.sampleRate;
  const ch = buf.numberOfChannels;
  
  const chData = [];
  for (let i = 0; i < ch; i++) chData.push(buf.getChannelData(i));
  
  const bps = 2;
  const ba = ch * bps;
  const br = sr * ba;
  const ds = len * ba;
  
  const ab = new ArrayBuffer(44 + ds);
  const v = new DataView(ab);
  
  const ws = (o, s) => {
    for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i));
  };
  
  ws(0, 'RIFF');
  v.setUint32(4, 36 + ds, true);
  ws(8, 'WAVE');
  ws(12, 'fmt ');
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true);
  v.setUint16(22, ch, true);
  v.setUint32(24, sr, true);
  v.setUint32(28, br, true);
  v.setUint16(32, ba, true);
  v.setUint16(34, 16, true);
  ws(36, 'data');
  v.setUint32(40, ds, true);
  
  let offset = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < ch; c++) {
      const s = Math.max(-1, Math.min(1, chData[c][i]));
      v.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      offset += 2;
    }
  }
  
  const blob = new Blob([ab], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `VoxDust_downmix_${take.matter}_${take.id.slice(-4)}.wav`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function updateTakeList() {
  const list = document.getElementById('takeList');
  list.innerHTML = '';
  
  const sortedTakes = Object.values(takes).sort((a, b) => b.timestamp - a.timestamp);
  
  sortedTakes.forEach((t, idx) => {
    const item = document.createElement('div');
    item.className = 'lib-item';
    
    const info = document.createElement('div');
    info.className = 'lib-info';
    const name = document.createElement('div');
    name.className = 'lib-info-name';
    name.textContent = t.name;
    const meta = document.createElement('div');
    meta.className = 'lib-info-meta';
    meta.textContent = t.duration.toFixed(1) + 's · ' + t.date;
    info.appendChild(name);
    info.appendChild(meta);
    
    const btns = document.createElement('div');
    btns.className = 'lib-btns';
    
    const playBtn = document.createElement('button');
    playBtn.className = 'lib-btn';
    playBtn.textContent = '▶';
    playBtn.addEventListener('click', () => setStatus('play: ' + t.name, false));
    
    const downBtn = document.createElement('button');
    downBtn.className = 'lib-btn down';
    downBtn.textContent = '⬇';
    downBtn.title = 'Downmix WAV';
    downBtn.addEventListener('click', () => {
      downmixWAV(t);
      setStatus('downmix: ' + t.name, false);
    });
    
    const delBtn = document.createElement('button');
    delBtn.className = 'lib-btn';
    delBtn.style.color = 'var(--magenta)';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => {
      delete takes[t.id];
      localStorage.setItem('voxdustTakes', JSON.stringify(takes));
      updateTakeList();
      setStatus('deleted: ' + t.name, false);
    });
    
    btns.appendChild(playBtn);
    btns.appendChild(downBtn);
    btns.appendChild(delBtn);
    
    item.appendChild(info);
    item.appendChild(btns);
    list.appendChild(item);
  });
}

// CANVAS

function drawAnalyser() {
  const canvas = document.getElementById('analyser');
  if (!canvas || !analyser) {
    requestAnimationFrame(drawAnalyser);
    return;
  }
  
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  
  ctx.fillStyle = 'rgba(19,17,31,1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  
  ctx.strokeStyle = '#9944ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const sw = canvas.width / data.length;
  let x = 0;
  for (let i = 0; i < data.length; i++) {
    const v = data[i] / 256;
    const y = canvas.height - (v * canvas.height);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sw;
  }
  ctx.stroke();
  
  requestAnimationFrame(drawAnalyser);
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isError ? ' error' : ' active');
}

async function init() {
  buildMatterGrid();
  buildPresets();
  await initAC();
  updateTakeList();
  updateEvolveSelects();
  drawAnalyser();
}

init();
