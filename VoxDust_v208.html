// ── PHRASE MEMORY LITE ───────────────────────────────────────────
// Captures consonant/semantic events into a ring buffer (~2.8s)
// Replays them probabilistically in low-energy moments
// No audio buffer manipulation — writes only to S.consEnv/semEnv/targetMatter

function pmCapture(now){
  if(!S.pmEnabled) return;
  PM.buf[PM.i]={
    t:now, consEnv:S.consEnv, semEnv:S.semEnv,
    consDir:S.consDir, zone:S.semZone,
    energy:S.energyFac, smear:S.dsmear, form:S.dform,
    fromPM:false, voice:S.voice
  };
  PM.i=(PM.i+1)%PM.len;
  // Motif capture: accumulate candidate events during active phrases
  if(S.consEnv>0.1||S.semEnv>0.1){
    PM.tmpMotif.push({
      consEnv:S.consEnv, semEnv:S.semEnv,
      consDir:S.consDir, energy:S.energyFac, dt:0
    });
    if(PM.tmpMotif.length>4) PM.tmpMotif.shift();
  }
  // Commit motif when phrase is active and pattern is long enough
  if(S.phraseEnv>0.6&&PM.tmpMotif.length>=3&&Math.random()<0.2){
    MOTIFS.list.push(JSON.parse(JSON.stringify(PM.tmpMotif)));
    if(MOTIFS.list.length>MOTIFS.max) MOTIFS.list.shift();
  }
}

function pmPick(){
  var best=null, bestW=0;
  for(var k=0;k<PM.len;k++){
    var e=PM.buf[k];
    if(!e) continue;
    // T1: deprioritize PM-generated events — avoids recursive ghost loops
    if(e.fromPM&&Math.random()<0.7) continue;
    if(S.novelty>0.3&&age<PM.len*0.3&&Math.random()<S.novelty) continue;
    // v20.8 Task 6: favor events matching current voice identity (60% filter)
    if(e.voice!==undefined&&e.voice!==S.voice&&Math.random()<0.6) continue;
    // T2: temporal bias — recent events weight more (natural phrase continuation)
    var age=(PM.i-k+PM.len)%PM.len;
    var timeBias=1-(age/PM.len);
    var w=(e.consEnv*0.6+e.semEnv*0.4)*(0.5+e.energy*0.5)*(0.6+timeBias*0.4);
    if(w>bestW&&Math.random()<0.6){best=e;bestW=w;}
  }
  return best;
}

function pmSpawnStutter(amp,durScale){
  var buf=S.bufA||S.bufB;
  if(!buf||!gainSum) return;
  var dur=(0.015+Math.random()*0.035)*(durScale||0.8);
  var src=AC.createBufferSource(); src.buffer=buf;
  var g=AC.createGain(); g.gain.value=0;
  var t0=AC.currentTime;
  var fade=Math.min(0.005,dur*0.2);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(amp,t0+dur*0.35);
  g.gain.linearRampToValueAtTime(0.0001,t0+dur-fade);
  g.gain.setValueAtTime(0.0001,t0+dur);
  var el=AC.currentTime-playStart;
  var off=Math.max(0,Math.min(buf.duration-0.01,buf.duration>0?(el%buf.duration):0));
  src.connect(g); g.connect(gainSum);
  src.start(t0,off,dur+0.015);
  src.stop(t0+dur+0.025);
  src.onended=function(){try{src.disconnect();g.disconnect();}catch(e){}};
}

function pmReplay(now,e,delayMs,isResponse){
  if(!e) return;
  delayMs=delayMs||0;
  function doReplay(){
    var phraseVar=0.9+S.phraseEnv*0.2;
    // Task 5: response mode — softer, narrower direction (system "answers" not "repeats")
    var respScale=isResponse?0.75:1.0;
    S.consEnv=Math.max(S.consEnv,e.consEnv*0.7*phraseVar*respScale);
    S.semEnv=Math.max(S.semEnv,e.semEnv*0.7*phraseVar*respScale);
    S.consDir=e.consDir*(isResponse?0.5:0.6);
    S.targetMatter=clamp(S.targetMatter+(e.semEnv*e.energy)*0.006);
    if(e.zone&&Math.random()<0.5) pmSpawnStutter(0.08*(1-S.dsmear),0.8);
    // T1: inject PM-marked snapshot
    PM.buf[PM.i]={
      t:now+delayMs/1000, consEnv:e.consEnv*0.7, semEnv:e.semEnv*0.7,
      consDir:e.consDir*0.6, zone:e.zone,
      energy:e.energy*0.6, smear:S.dsmear, form:S.dform, fromPM:true
    };
    PM.i=(PM.i+1)%PM.len;
  }
  if(delayMs>0) setTimeout(doReplay,delayMs);
  else doReplay();
  S.pmLastReplay=now;
}

function pmTick(now,dt){
  if(!S.pmEnabled) return;
  // Decay memory
  for(var k=0;k<PM.len;k++){
    var e=PM.buf[k];
    if(!e) continue;
    e.consEnv*=S.pmDecay; e.semEnv*=S.pmDecay;
  }
  // PQ: compute snap delay toward next implicit pulse
  var delayMs=0;
  if(S.pqEnabled&&S.pqIntervals.length>=3){
    var toGrid=1-S.pqPhase;                     // distance to next beat
    var snapWindow=0.18;                         // ~30ms at 180ms interval
    if(toGrid<snapWindow) delayMs=toGrid*S.pqInterval*1000;
    // if we just passed the beat and are very close, replay immediately
    if(S.pqPhase<0.05) delayMs=0;
  }
  // Replay: more likely in low-energy gaps, cooldown 120ms
  // Task 4: phrase-shaped density — build/peak → more replay; idle → almost none
  var base=(0.04+S.pmDensity*0.12)*(0.4+S.phraseEnv*0.6);
  // Task 3: intent modulates PM replay probability
  if(S.intent===1) base*=1.4;        // follow → denser
  else if(S.intent===2) base*=0.6;   // contrast → sparse
  else if(S.intent===3) base*=0.5;   // call → hold back
  else if(S.intent===4) base*=0.2;   // silence → almost nothing
  var energyGate=1-S.energyFac;
  var cooldown=(now-S.pmLastReplay)>120;
  if(S.playing&&cooldown&&Math.random()<base*energyGate){
    var e=pmPick();
    if(e) pmReplay(now,e,delayMs);
  }
}

// ── MOTIF MUTATION ENGINE (v20.3) ────────────────────────────────
function motifMutationFactor(){
  var base=Math.min(1,S.motifGen*0.15+(S.entropyEff||S.entropy)*0.3);
  // Task 4 v20.7: novelty pushes mutation higher when repetition detected
  return Math.min(1,base*(1+S.novelty*0.8));
}

// ── PHRASE MACRO MEMORY (v20.5) ──────────────────────────────────
function pickPhrase(){
  if(S.phraseMem.length===0) return null;
  return S.phraseMem[Math.floor(Math.random()*S.phraseMem.length)];
}

function applyPhraseContour(phrase){
  if(!phrase||!phrase.env||phrase.env.length===0) return;
  var len=phrase.env.length;
  var idx=0;
  // Replay step interval: use captured IOI, min 25ms, max 100ms
  var stepMs=Math.max(25,Math.min(100,(phrase.interval||0.2)*1000));
  function step(){
    if(idx>=len||!S.playing) return;
    var pe=phrase.env[idx];
    var ce=phrase.cons[idx];
    // Task 3: dominance scales injection — warped by novelty (_domWarp) when repetitive
    var dom=S.phraseDom*(S._domWarp||1);
    S.phraseEnv+=(pe-S.phraseEnv)*(0.2+dom*0.5);
    S.consEnv=Math.max(S.consEnv,ce*(0.5+dom*0.5));
    idx++;
    if(idx<len) setTimeout(step,stepMs);
  }
  step();
}

// ── CALL / RESPONSE ENGINE (v20.2) ───────────────────────────────
function triggerResponse(){
  // v20.8 Task 7: respond with opposite voice
  S.voiceTarget=1-S.voiceTarget;
  var useMotif=MOTIFS.list.length>0&&Math.random()<0.6;
  if(useMotif){
    S.motifActive=true;
    S.motif=MOTIFS.list[(Math.random()*MOTIFS.list.length)|0];
    S.motifIndex=0; S.motifTimer=0;
    S.motifGen=0;   // Task 2: generation reset on response trigger
  } else {
    var ev=pmPick();
    if(ev) pmReplay(Date.now(),ev,0,true);  // isResponse=true
  }
  // crResponding flag decays after 400ms
  setTimeout(function(){S.crResponding=false;},400);
  // Task 5: intent coupling — replay phrase macro shape on CALL/CONTRAST
  if(S.intent===3||S.intent===2){
    var pp=pickPhrase();
    if(pp) applyPhraseContour(pp);
  }
}

// ── MOTIF QUANTIZATION + HUMAN SWING (v20.1) ─────────────────────
// pqQuantize: snap a time value to the next implicit pulse grid
function pqQuantize(timeNow,interval){
  if(!interval||interval<0.08) return timeNow;  // Task 8: lock intensity
  var phase=(timeNow%interval)/interval;
  var toNext=(1-phase)*interval;
  return timeNow+toNext;
}

// pqSwingOffset: asymmetric human feel — positive beat > negative beat
function pqSwingOffset(interval,swingAmt,phaseToggle){
  var base=interval*0.12;   // max 12% of grid
  var swing=base*swingAmt;
  return phaseToggle?swing:-swing*0.6;   // asymmetric: +12% / -7.2%
}

// scheduleMotifStep: deferred step injection via setTimeout
function scheduleMotifStep(step,scheduledTime){
  var varScale=0.85+S.phraseEnv*0.3;
  var mut=motifMutationFactor();
  // Task 4: timing drift proportional to mutation
  var tDrift=(Math.random()-0.5)*S.pqInterval*0.08*mut;
  tDrift*=(1+S.novelty*0.5);   // Task 4: novelty → more timing drift
  var finalT=Math.max(AC.currentTime,scheduledTime+tDrift);
  var dtMs=Math.max(0,(finalT-AC.currentTime)*1000);
  // Task 6: form drift — pre-compute to pass into deferred closure
  var formDrift=1+(Math.random()-0.5)*0.08*mut;
  setTimeout(function(){
    // Task 4: env variation
    var eVar=1+(Math.random()-0.5)*0.3*mut;
    S.consEnv=step.consEnv*varScale*eVar;
    S.semEnv=step.semEnv*varScale*eVar;
    // Task 4: direction drift
    S.consDir=(step.consDir+(Math.random()-0.5)*0.4*mut)*0.6;
    // Task 4: matter push scales with mutation
    S.targetMatter=clamp(S.targetMatter+step.energy*0.01*(1+mut*0.5));
    // Task 6: apply formant drift via fShift on next applyDSP tick
    S._formDrift=formDrift;
  },dtMs);
}
function togglePV(){
  if(!pvNode||!S.pvEnabled){ setStatus('PV not available (iPhone or unsupported)',false); return; }
  S.pvMode=S.pvMode==='hybrid'?'off':'hybrid';
  updatePVButton();
  setStatus('PV '+S.pvMode,S.pvMode==='hybrid');
}
function updatePVButton(){
  var btn=document.getElementById('pvBtn');
  if(!btn) return;
  if(!S.pvEnabled){
    btn.textContent='PV N/A'; btn.style.opacity='0.3'; btn.className='';
  } else if(S.pvMode==='hybrid'){
    btn.textContent='PV HYBRID'; btn.style.opacity='1'; btn.className='act';
  } else {
    btn.textContent='PV OFF'; btn.style.opacity='0.6'; btn.className='';
  }
}

function initUI(){
  document.getElementById('stretch').addEventListener('input',function(e){
    S.stretch=e.target.value/100;
    document.getElementById('stretchV').textContent=S.stretch.toFixed(1)+'x';
    if(srcA) srcA.playbackRate.value=S.stretch;
    if(srcB) srcB.playbackRate.value=S.stretch;
  });
  document.getElementById('mix').addEventListener('input',function(e){
    S.mixAB=e.target.value/100;
    document.getElementById('mixV').textContent=e.target.value;
  });
  document.getElementById('lfoBtn').addEventListener('click',function(e){
    S.lfoOn=!S.lfoOn;
    e.target.textContent='LFO '+(S.lfoOn?'ON':'OFF');
    e.target.className=S.lfoOn?'on':'';
  });
  document.getElementById('lfoFreq').addEventListener('input',function(e){
    S.lfoFreq=e.target.value/100;
    document.getElementById('lfoFreqV').textContent=S.lfoFreq.toFixed(1)+'Hz';
  });
  document.getElementById('lfoDepth').addEventListener('input',function(e){
    S.lfoDepth=e.target.value/100;
    document.getElementById('lfoDepthV').textContent=e.target.value+'%';
  });
  document.getElementById('loopBtn').addEventListener('click',function(e){
    S.looping=!S.looping;
    e.target.textContent='LOOP '+(S.looping?'ON':'OFF');
    e.target.className=S.looping?'':'on';
    document.getElementById('silCtrl').style.display=S.looping?'':'none';
    if(srcA) srcA.loop=S.looping;
    if(srcB) srcB.loop=S.looping;
  });
  document.getElementById('chance').addEventListener('input',function(e){
    S.silChance=parseInt(e.target.value);
    document.getElementById('chanceV').textContent=e.target.value+'%';
  });
  document.getElementById('silMin').addEventListener('input',function(e){
    S.silMin=parseInt(e.target.value);
    document.getElementById('silMinV').textContent=e.target.value+'ms';
  });
  document.getElementById('silMax').addEventListener('input',function(e){
    S.silMax=parseInt(e.target.value);
    document.getElementById('silMaxV').textContent=e.target.value+'ms';
  });
  document.getElementById('entropy').addEventListener('input',function(e){
    S.entropy=e.target.value/100;
    document.getElementById('entropyV').textContent=e.target.value+'%';
  });
  document.getElementById('articulation').addEventListener('input',function(e){
    S.articulation=e.target.value/100;
    document.getElementById('articulV').textContent=e.target.value+'%';
  });
  document.getElementById('pmDensity').addEventListener('input',function(e){
    S.pmDensity=e.target.value/100;
    document.getElementById('pmDensV').textContent=e.target.value+'%';
  });
  // Mic REC — iOS canonical fix: resume + setTimeout before getUserMedia
  document.getElementById('recA').addEventListener('click',function(){
    AC.resume(); setTimeout(function(){toggleMic('A');},50);
  });
  document.getElementById('recB').addEventListener('click',function(){
    AC.resume(); setTimeout(function(){toggleMic('B');},50);
  });
  // File load — iOS canonical fix applied inside loadFileToSlot
  document.getElementById('loadA').addEventListener('click',function(){ loadFileToSlot('A'); });
  document.getElementById('loadB').addEventListener('click',function(){ loadFileToSlot('B'); });
  // Transport
  document.getElementById('playBtn').addEventListener('click',function(){
    AC.resume();
    if(S.playing) stopPlayback(); else startPlayback();
  });
  document.getElementById('stopBtn').addEventListener('click',stopPlayback);
  document.getElementById('recBtn').addEventListener('click',recTake);
  document.getElementById('packBtn').addEventListener('click',downloadPack);
  document.getElementById('pvBtn').addEventListener('click',togglePV);
}

  await initDB();
  buildMatterGrid();
  buildPresets();
  await initAC();
  await loadAllTakes();
  updateTakeList();
  initUI();
  drawAnalyser();
  updateSpectralUI();
  setStatus('v19 loading PV...',false);
}

init();
