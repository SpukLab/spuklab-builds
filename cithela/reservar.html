<!doctype html>

<style>

</head>
<body>

</section>

<section class="card" id="step-contact" hidden><h2><span class="step">3</span><span data-i="yourDetails"></span></h2>

<div id="email-panel">

<button class="btn secondary" id="send-email" type="button" data-i="sendLink"></button>

</div>
<div id="verified-panel" hidden><p class="msg" id="verified-text"></p><button class="btn secondary" id="switch-email" type="button" data-i="switchEmail"></button></div>
<label for="full-name" data-i="name"></label><input id="full-name" maxlength="100" autocomplete="name" required>
<p class="muted" data-i="privacy"></p>
<button class="btn" id="book" type="button" disabled data-i="request"></button>
</section>
<section class="card" id="success" hidden><h2 data-i="requestReceived"></h2><p id="success-text"></p>
<a class="btn secondary" href="./index.html" id="account" style="display:block;text-align:center;text-decoration:none" data-i="myAppointments"></a>
</section>
<p class="footer">CITHELA · SpukLab</p>
</main>

function wallIso(day,hm,tz){const [y,m,d]=day.split('-').map(Number),[h,min]=hm.split(':').map(Number);const desired=Date.UTC(y,m-1,d,h,min);let ts=desired;for(let i=0;i<4;i++){const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ts));const q=Object.fromEntries(parts.map(p=>[p.type,p.value]));ts-=Date.UTC(+q.year,+q.month-1,+q.day,+q.hour,+q.minute)-desired}return new Date(ts).toISOString()}

const selectedRate=selectedHealthRate();if(healthEnabled&&!selectedRate){msg(t('coverageChanged'),true);return;}const name=$('full-name').value.trim();if(!name||name.length>100){msg(t('name'),true);return}loading=true;updateContact();msg('');try{const attach=await rpc('cithela_public_booking_attach',{p_slug:slug,p_display_name:name});personId=attach.person_id;const key=['cithela',slug,attach.person_id,$('service').value,$('resource').value,$('date').value,chosen,selectedRate?.id||'',selectedRate?.version||''].join('|');let reqId;try{const saved=JSON.parse(sessionStorage.getItem('cithela-public-attempt')||'null');reqId=saved?.key===key?saved.id:null;}catch{}if(!reqId){reqId='public-'+crypto.randomUUID();try{sessionStorage.setItem('cithela-public-attempt',JSON.stringify({key,id:reqId}))}catch{}}
const payload={person_id:personId,service_id:$('service').value,resource_id:$('resource').value,starts_at:wallIso($('date').value,chosen,data.timezone),reason:''};
const result=selectedRate
  ?await rpc('cithela_health_booking_create',{p_tenant_id:data.tenant_id,
    p_request_id:reqId,p_payload:payload,p_rate_id:selectedRate.id,
    p_rate_version:selectedRate.version})
  :await rpc('cithela_patient_booking_create',{p_tenant_id:data.tenant_id,
    p_request_id:reqId,p_payload:payload});$('step-service').hidden=true;$('step-date').hidden=true;$('step-contact').hidden=true;$('success').hidden=false;$('success-text').textContent=t('pending');msg('');}catch(e){showError(e);if(String(e?.message)==='slot_unavailable')loadSlots()}finally{loading=false;updateContact()}}
$('language').addEventListener('click',()=>{lang=lang==='es'?'en':'es';i18n()});
$('service').addEventListener('change',()=>{renderDeposit();loadHealthRates();loadSlots()});
for(const key of ['resource','date'])$(key).addEventListener('change',()=>{renderDeposit();loadSlots()});
$('health-kind').addEventListener('change',changeHealthKind);
$('health-rate').addEventListener('change',()=>{renderHealth();updateContact();});
$('switch-email').addEventListener('click',switchEmail);$('full-name').addEventListener('input',updateContact);$('send-email').addEventListener('click',signIn);$('verify-otp').addEventListener('click',verify);$('book').addEventListener('click',book);
(async()=>{i18n();msg(t('loading'));if(!/^[a-z0-9][a-z0-9-]{2,49}$/.test(slug)){msg(t('unavailable'),true);return}try{const x=await rpc('cithela_public_booking_catalog',{p_slug:slug});loadCatalog(x);await authRefresh();client.auth.onAuthStateChange(()=>setTimeout(authRefresh,0));}catch(e){msg(t('unavailable'),true)}})();
