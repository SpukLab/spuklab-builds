<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CITHELA · Diagnóstico de suscripción</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;background:#f5f8f8;color:#172c31}
body{margin:0;padding:24px}.wrap{max-width:600px;margin:30px auto}.panel{background:#fff;border:1px solid #dce5e4;border-radius:18px;padding:24px}
h1{font-size:1.5rem}p{line-height:1.5}.muted{color:#52666a}.status{background:#edf5f4;border-radius:10px;padding:14px;white-space:pre-wrap}
button,a{font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#165c61;color:white}
a{color:#165c61}.warning{font-weight:600}
</style></head><body><main class="wrap"><section class="panel">
<h1>CITHELA · Suscripción de prueba</h1>
<p class="muted">Piloto interno de Alma y Pampa. Usá únicamente la cuenta compradora y una tarjeta de prueba de Mercado Pago.</p>
<p id="identity">Comprobando sesión…</p>
<p id="tenant"></p><button type="button" id="preflight" disabled>1. Validar requisitos</button> <button type="button" id="check" disabled>2. Consultar suscripción</button>
<p id="result" class="status" role="status" aria-live="polite">Esperando sesión.</p>
<fieldset id="pilot-checkout" hidden>
<legend>Checkout de prueba</legend>
<p><label><input type="checkbox" id="consent"> Confirmo que usaré datos de prueba.</label></p>
<button type="button" id="checkout" disabled>Preparar checkout de prueba</button>
<p><a id="mp-link" hidden rel="noreferrer">Abrir Mercado Pago</a></p>
</fieldset>
<p><a href="./">Volver a CITHELA</a></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const client=window.supabase?.createClient(
 'https://mcqknmqhtmihegmifuka.supabase.co',
 'sb_publishable__QKhInQSZjLyncQsQoRJzw_dQuwf5jc');
const ALMA_TENANT='e680ebd3-a031-4968-905a-e829ab3b5dfe';
let tenantId=null;
async function load(){
 if(!client){$('identity').textContent='No se pudo cargar la autenticación.';return;}
 const {data:{user},error}=await client.auth.getUser();
 if(error||!user){$('identity').textContent='Iniciá sesión en CITHELA antes de abrir esta página.';return;}
 $('identity').textContent='Sesión: '+(user.email||'cuenta profesional');
 const {data,error:membershipError}=await client.from('cithela_tenant_memberships')
  .select('tenant_id,role').eq('user_id',user.id).eq('role','owner');
 if(membershipError||!Array.isArray(data)){ $('result').textContent='No se pudo comprobar la titularidad.';return;}
 if(!data.some(item=>item.tenant_id===ALMA_TENANT)){$('result').textContent='Este diagnóstico está reservado a la cuenta propietaria de Alma y Pampa. No se ejecutó ninguna acción.';return;}
 if(!user.email_confirmed_at||user.email?.toLowerCase()!=='alma.y.pampa@gmail.com')return;
 $('pilot-checkout').hidden=false;
 tenantId=ALMA_TENANT;$('check').disabled=false;$('preflight').disabled=false;
 $('tenant').textContent='Establecimiento: Alma y Pampa · modo interno';
 $('result').textContent='Cuenta propietaria identificada. Podés comprobar el estado de la prueba.';
}
$('preflight').addEventListener('click',async()=>{
 if(!tenantId)return;
 $('preflight').disabled=true;$('result').textContent='Validando requisitos del servidor…';
 try{
  const {data,error}=await client.functions.invoke('cithela-mp-test-preflight',{body:{tenantId}});
  if(error)throw error;
  $('result').textContent=data?.code==='eligible_no_payment_created'&&data?.checkout_enabled===false&&data?.subscription_created===false
   ?'REQUISITOS CORRECTOS: propietario verificado, cuenta elegible.\nLa verificación no creó ningún pago.'
   :'La validación no fue aprobada: '+(data?.code||'respuesta inesperada');
 }catch{$('result').textContent='No se pudo validar. Revisá la sesión o intentá nuevamente.';}
 finally{$('preflight').disabled=false;}
});
$('check').addEventListener('click',async()=>{
 if(!tenantId)return;
 $('check').disabled=true;$('result').textContent='Consultando estado…';
 try{
  const {data,error}=await client.functions.invoke('cithela-mp-test-preflight',
   {body:{tenantId,action:'status'}});
  if(error)throw error;
  const messages={no_subscription:'Todavía no hay suscripción de prueba registrada.',
   snapshot:'Existe una solicitud registrada.',
   not_tenant_owner:'La cuenta no es propietaria del establecimiento.'};
  $('result').textContent=(messages[data?.code]||'Estado no reconocido.')+
   (data?.stage?'\nEtapa: '+data.stage:'')+
   '';
 }catch{$('result').textContent='No se pudo consultar el estado. Verificá la sesión e intentá nuevamente.';}
 finally{$('check').disabled=false;}
});
$('consent').addEventListener('change',()=>{$('checkout').disabled=!$('consent').checked;});
$('checkout').addEventListener('click',async()=>{
 if(!tenantId||!$('consent').checked)return;
 $('checkout').disabled=true;
 $('consent').disabled=true;
 $('mp-link').hidden=true;
 $('result').textContent='Preparando checkout de prueba…';
 try{
  const {data,error}=await client.functions.invoke('cithela-mp-pilot-checkout',{body:{tenantId,consent:true}});
  const response=error?.context instanceof Response ? await error.context.json().catch(()=>null) : data;
  if(!data?.ok||!data.checkout_url){
   const messages={
    checkout_disabled:'El checkout interno todavía está desactivado.',
    test_configuration_missing:'Falta configurar la cuenta compradora de prueba en Supabase.',
    test_accounts_unverified:'Mercado Pago no confirmó las cuentas configuradas para esta prueba.',
    provider_outcome_pending:'Resultado pendiente de Mercado Pago. No generes otro cobro: hay que recuperar la operación anterior.',
    provider_lookup_incomplete:'La búsqueda en Mercado Pago fue incompleta. No se puede repetir el cobro con seguridad.',
    unresolved_provider_outcome:'No se encontró una suscripción coincidente. La operación sigue bloqueada para evitar duplicados.',
    ambiguous_provider_matches:'Se encontraron varias suscripciones posibles. Requiere conciliación manual.',
    provider_identity_mismatch:'Los datos de Mercado Pago no coinciden con la solicitud de CITHELA.',
    test_accounts_unverified:'Las cuentas de prueba de comprador o vendedor no pudieron verificarse.',
    claim_unavailable:'Ya existe un intento reservado. Consultá el estado antes de reintentar.',
    subscription_already_linked:'Ya existe una suscripción de prueba vinculada.',
    subscription_linked:'La suscripción ya está vinculada. Consultá su estado.'
   };
   $('result').textContent=(messages[response?.code]||'No se completó el checkout de prueba.')+'\\nCódigo de diagnóstico: '+(response?.code||'respuesta_no_disponible');
   return;
  }
  const url=new URL(data.checkout_url);
  if(url.protocol!=='https:'||url.username||url.password||!/(^|\.)mercadopago\.(com|com\.ar)$/.test(url.hostname))throw new Error('invalid_checkout_url');
  $('mp-link').href=url.href;
  $('mp-link').hidden=false;
  $('result').textContent='Checkout preparado. Abrí Mercado Pago para continuar con los datos de prueba.';
 }catch{$('result').textContent='No se pudo preparar el checkout. Consultá el estado e intentá nuevamente.';}
 finally{$('consent').disabled=false;$('checkout').disabled=!$('consent').checked;}
});
load();
</script></body></html>
