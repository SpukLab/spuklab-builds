<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoxDust</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg1:#13111f;--bg2:#1b1726;
  --border:rgba(153,68,255,.18);--glow:rgba(153,68,255,.08);
  --canvas-bg:rgba(153,68,255,.06);
  --cyan:#00ffff;--magenta:#ff00ff;--violet:#9944ff;--violetlt:#b580ff;
  --btn:rgba(153,68,255,.07);--active:rgba(153,68,255,.18);
  --white:rgba(255,255,255,.92);--dim:rgba(255,255,255,.38);
}
body{
  background:linear-gradient(155deg,var(--bg1),var(--bg2));
  min-height:100vh;color:var(--white);
  font-family:'Inter',sans-serif;font-size:13px;
  display:flex;flex-direction:column;align-items:center;
  padding:16px 12px 32px;gap:12px;
  overflow-x:hidden;
}

.logo{font-family:'JetBrains Mono',monospace;font-style:italic;letter-spacing:.04em;line-height:1;}
.logo .spuk{font-weight:800;color:var(--white);font-size:22px;}
.logo .lab{font-weight:300;color:var(--cyan);font-size:22px;}
.logo .sub{font-size:10px;color:var(--dim);display:block;margin-top:2px;letter-spacing:.12em;}

header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:flex-start;}
.version{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);margin-top:4px;}

.canvas-wrap{
  width:100%;max-width:480px;
  background:var(--canvas-bg);
  border:1px solid var(--border);border-radius:12px;
  overflow:hidden;position:relative;height:120px;
}
canvas#analyser{width:100%;height:100%;display:block;}

.slots{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.slot{
  background:var(--btn);border:1px solid var(--border);
  border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;
}
.slot-header{
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:11px;color:var(--violetlt);letter-spacing:.08em;
}
.slot-name{
  font-size:10px;color:var(--dim);min-height:14px;
}
.waveform-mini{
  width:100%;height:28px;border-radius:4px;
  background:rgba(0,0,0,.3);border:1px solid var(--border);
}
.slot-btns{display:flex;gap:4px;}
.sbtn{
  flex:1;padding:5px 0;border:1px solid var(--border);
  background:var(--btn);border-radius:6px;color:var(--white);
  font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;
  cursor:pointer;text-align:center;transition:background .15s;
}
.sbtn:active,.sbtn.recording{background:var(--active);color:var(--cyan);}
.sbtn.active{border-color:var(--violet);}

.mic-gain-row{
  width:100%;max-width:480px;
  background:var(--btn);border:1px solid var(--border);
  border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;
}
.gain-label{
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:9px;color:var(--violetlt);letter-spacing:.06em;
}
.gain-val{
  font-size:9px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;
}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.06);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;border:none;}

.mode-row{
  width:100%;max-width:480px;
  display:flex;justify-content:center;gap:4px;
}
.mode-btn{
  padding:7px 16px;border:1px solid var(--border);
  background:var(--btn);border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;
  color:var(--dim);cursor:pointer;transition:all .15s;
}
.mode-btn.active{background:var(--active);color:var(--cyan);border-color:var(--violet);}

.matter-section{
  width:100%;max-width:480px;
  background:var(--btn);border:1px solid var(--border);
  border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;
}
.matter-label{
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:9px;color:var(--violetlt);letter-spacing:.08em;
}
.matter-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
}
.matter-btn{
  padding:8px 0;border:1px solid var(--border);
  background:var(--btn);border-radius:6px;
  font-family:'JetBrains Mono',monospace;font-style:italic;font-size:8px;
  color:var(--dim);cursor:pointer;transition:all .15s;
  letter-spacing:.04em;
}
.matter-btn.active{background:var(--active);color:var(--cyan);border-color:var(--violet);}

.macro-row{
  width:100%;max-width:480px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 4px;
}
.macro-item{
  background:var(--btn);border:1px solid var(--border);
  border-radius:8px;padding:8px;
}
.macro-label{
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:9px;color:var(--violetlt);letter-spacing:.06em;margin-bottom:4px;
}
.macro-val{
  font-size:10px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;margin-bottom:4px;
}

.knobs-row{
  width:100%;max-width:480px;
  display:flex;justify-content:space-around;align-items:flex-end;
  padding:4px 0;
}
.knob-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.knob-label{
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:9px;color:var(--dim);letter-spacing:.08em;
}
.knob-val{font-size:9px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;}
svg.knob{width:48px;height:48px;cursor:pointer;touch-action:none;}

.transport{
  width:100%;max-width:480px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.tbtn{
  padding:10px 0;border:1px solid var(--border);
  background:var(--btn);border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:10px;color:var(--white);cursor:pointer;
  text-align:center;transition:all .15s;letter-spacing:.04em;
}
.tbtn:active{background:var(--active);}
.tbtn.recording{background:rgba(255,0,255,.15);color:var(--magenta);}
.tbtn.disabled{opacity:.35;pointer-events:none;}

.library-toggle{
  width:100%;max-width:480px;
  padding:10px;border:1px solid var(--border);
  background:var(--btn);border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:10px;color:var(--white);cursor:pointer;
  text-align:center;transition:all .15s;
}
.library-toggle:active{background:var(--active);color:var(--cyan);}

.library-panel{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(to top, var(--bg1), var(--bg2));
  border-top:1px solid var(--border);
  max-height:0;overflow:hidden;transition:max-height .3s;
  z-index:1000;
}
.library-panel.open{max-height:60vh;}
.library-inner{
  padding:16px;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:12px;
}
.library-header{
  display:flex;justify-content:space-between;align-items:center;
}
.lib-title{
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:11px;color:var(--violetlt);letter-spacing:.08em;
}
.lib-close{
  background:var(--btn);border:1px solid var(--border);
  border-radius:4px;padding:4px 8px;
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:9px;color:var(--dim);cursor:pointer;
  transition:all .15s;
}
.lib-close:active{background:var(--active);color:var(--cyan);}

.library-list{
  display:flex;flex-direction:column;gap:8px;
  max-height:40vh;overflow-y:auto;
}
.lib-item{
  background:rgba(0,0,0,.3);border:1px solid var(--border);
  border-radius:6px;padding:8px;display:flex;justify-content:space-between;
  align-items:center;gap:6px;
}
.lib-name{
  flex:1;font-size:10px;color:var(--white);
  font-family:'JetBrains Mono',monospace;font-style:italic;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lib-time{
  font-size:8px;color:var(--dim);font-family:'JetBrains Mono',monospace;font-style:italic;
}
.lib-btns{
  display:flex;gap:4px;
}
.lib-btn{
  padding:4px 6px;border:1px solid var(--border);
  background:var(--btn);border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:7px;color:var(--dim);cursor:pointer;
  transition:all .15s;
}
.lib-btn:active{background:var(--active);color:var(--cyan);}

.status{
  font-family:'JetBrains Mono',monospace;font-style:italic;
  font-size:10px;color:var(--dim);text-align:center;min-height:14px;
  max-width:480px;
}
.status.active{color:var(--cyan);}
.status.error{color:var(--magenta);}

input[type=file]{display:none;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span><span class="spuk">SPUK</span><span class="lab">LAB</span></span>
    <span class="sub">VoxDust · fusión espectral</span>
  </div>
  <div class="version">v4.0</div>
</header>

<div class="canvas-wrap">
  <canvas id="analyser"></canvas>
</div>

<div class="slots">
  <div class="slot">
    <div class="slot-header">SLOT A · VOZ</div>
    <div class="slot-name" id="nameA">— empty —</div>
    <canvas class="waveform-mini" id="waveA"></canvas>
    <div class="slot-btns">
      <button class="sbtn" id="recA">● REC</button>
      <button class="sbtn" id="stopA">■ STOP</button>
    </div>
  </div>
  <div class="slot">
    <div class="slot-header">SLOT B · TEXTURA</div>
    <div class="slot-name" id="nameB">— empty —</div>
    <canvas class="waveform-mini" id="waveB"></canvas>
    <div class="slot-btns">
      <button class="sbtn" id="recB">● REC</button>
      <button class="sbtn" id="stopB">■ STOP</button>
    </div>
  </div>
</div>

<div class="mic-gain-row">
  <div class="gain-label">MIC GAIN</div>
  <div class="gain-val" id="valMicGain">100</div>
  <input type="range" id="micGainSlider" min="0" max="200" value="100">
</div>

<div class="mode-row">
  <button class="mode-btn active" id="modeAUT">AUTO</button>
  <button class="mode-btn" id="modeMAT">MATTER</button>
</div>

<div class="matter-section">
  <div class="matter-label">STATE</div>
  <div class="matter-grid" id="matterGrid"></div>
</div>

<div class="macro-row">
  <div class="macro-item">
    <div class="macro-label">DRY/WET</div>
    <div class="macro-val" id="valDryWet">50</div>
    <input type="range" id="dryWetSlider" min="0" max="100" value="50">
  </div>
  <div class="macro-item">
    <div class="macro-label">INTENSITY</div>
    <div class="macro-val" id="valIntensity">50</div>
    <input type="range" id="intensitySlider" min="0" max="100" value="50">
  </div>
</div>

<div class="knobs-row" id="knobsRow"></div>

<div class="transport">
  <button class="tbtn disabled" id="btnRec">⏺ REC</button>
  <button class="tbtn disabled" id="btnLibrary">📚 LIBRARY</button>
</div>

<div class="status" id="status">ready · start recording or load</div>

<div class="library-panel" id="libraryPanel">
  <div class="library-inner">
    <div class="library-header">
      <div class="lib-title">LIBRARY</div>
      <button class="lib-close" id="libClose">✕</button>
    </div>
    <div class="library-list" id="libraryList"></div>
  </div>
</div>

<input type="file" id="fileA" accept=".mp3,.wav,.m4a,.aiff,.aif,.caf,audio/*">
<input type="file" id="fileB" accept=".mp3,.wav,.m4a,.aiff,.aif,.caf,audio/*">

<script>
let db;
const initDB = () => {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('VoxDustLibrary', 1);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      db = req.result;
      resolve();
    };
    req.onupgradeneeded = e => {
      const dbx = e.target.result;
      if (!dbx.objectStoreNames.contains('renders')) {
        dbx.createObjectStore('renders', { keyPath: 'id', autoIncrement: true });
      }
    };
  });
};

const state = {
  ac: null,
  micGain: 1.0,
  dryWet: 0.5,
  intensity: 0.5,
  mode: 'AUTO',
  matter: 'Ritual',
  params: { FORM: 0.5, SMEAR: 0.5, CROSS: 0.7 },
  
  bufA: null,
  bufB: null,
  recorderA: null,
  recorderB: null,
  isRecordingA: false,
  isRecordingB: false,
  
  scriptProcessor: null,
  splitter: null,
  analyser: null,
  processorGain: null,
  
  analysisData: null,
  prevPhase: null,
  prevOutPhase: null,
  
  recordingBuffer: null,
  recordingIndex: 0,
};

const STATES = {
  Susurro: { FORM: 0.2, SMEAR: 0.1, CROSS: 0.1, randomAmount: 0.2 },
  Eco: { FORM: 0.3, SMEAR: 0.9, CROSS: 0.6, randomAmount: 0.8 },
  Ritual: { FORM: 0.4, SMEAR: 0.6, CROSS: 0.7, randomAmount: 0.4 },
  Máquina: { FORM: 0.7, SMEAR: 0.2, CROSS: 0.9, randomAmount: 0.1 },
  Híbrido: { FORM: 0.5, SMEAR: 0.5, CROSS: 0.5, randomAmount: 0.3 },
  Colapso: { FORM: 0.9, SMEAR: 0.8, CROSS: 1.0, randomAmount: 1.0 },
};

const MATTER_LABELS = ['Susurro', 'Eco', 'Ritual', 'Máquina', 'Híbrido', 'Colapso'];

function getAC() {
  if (!state.ac) {
    state.ac = new (window.AudioContext || window.webkitAudioContext)();
  }
  return state.ac;
}

async function initAudio() {
  const ac = getAC();
  ac.resume();
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    
    const micSource = ac.createMediaStreamSource(stream);
    state.scriptProcessor = ac.createScriptProcessor(2048, 1, 1);
    state.analyser = ac.createAnalyser();
    state.analyser.fftSize = 2048;
    
    micSource.connect(state.scriptProcessor);
    state.scriptProcessor.connect(state.analyser);
    state.scriptProcessor.connect(ac.destination);
    
    state.scriptProcessor.onaudioprocess = processAudio;
    
    setStatus('audio ready · recording enabled');
  } catch (err) {
    setStatus('mic error: ' + err.message, true);
  }
}

const BINS = 256;
let prevMag = new Float32Array(BINS);
let prevPhaseOut = new Float32Array(BINS);

function performFFT(data) {
  const N = data.length;
  const mag = new Float32Array(BINS);
  const phase = new Float32Array(BINS);
  
  for (let k = 0; k < BINS; k++) {
    let sr = 0, si = 0;
    const step = Math.floor(N / BINS);
    for (let n = 0; n < N; n += step) {
      const ang = -2 * Math.PI * k * n / N;
      sr += data[n] * Math.cos(ang);
      si += data[n] * Math.sin(ang);
    }
    mag[k] = Math.sqrt(sr * sr + si * si);
    phase[k] = Math.atan2(si, sr);
  }
  
  return { mag, phase };
}

function processAudio(e) {
  const input = e.inputBuffer.getChannelData(0);
  const output = e.outputBuffer.getChannelData(0);
  
  // Analyze
  const { mag: srcMag, phase: srcPhase } = performFFT(input);
  
  // Get texture if loaded
  let carMag = new Float32Array(BINS);
  if (state.bufB) {
    carMag = sampleTextureFrame();
  } else {
    carMag.fill(0.1); // neutral if no texture
  }
  
  // Apply FORM, SMEAR, CROSS
  let params = { ...state.params };
  
  if (state.mode === 'AUTO') {
    const w = getStateWeights(srcMag);
    const intensity = state.intensity;
    
    Object.keys(STATES).forEach(stateName => {
      Object.keys(STATES[stateName]).forEach(k => {
        if (k === 'randomAmount') return;
        const stateVal = STATES[stateName][k];
        const neutral = state.params[k] || 0.5;
        const boost = 0.5 + w[stateName] * 2.0;
        const modulated = neutral + (stateVal - neutral) * boost * intensity;
        params[k] = Math.max(0, Math.min(1, modulated));
      });
    });
  } else if (state.mode === 'MATTER') {
    const stateParams = STATES[state.matter];
    const intensity = state.intensity;
    Object.keys(stateParams).forEach(k => {
      if (k === 'randomAmount') return;
      const stateVal = stateParams[k];
      const neutral = state.params[k] || 0.5;
      const modulated = neutral + (stateVal - neutral) * intensity;
      params[k] = Math.max(0, Math.min(1, modulated));
    });
  }
  
  // Process magnitudes
  const cross = params.CROSS;
  const fusedMag = new Float32Array(BINS);
  for (let k = 0; k < BINS; k++) {
    fusedMag[k] = srcMag[k] * (1 - cross) + carMag[k] * cross;
  }
  
  const smear = params.SMEAR;
  for (let k = 0; k < BINS; k++) {
    prevMag[k] = prevMag[k] * 0.8 + fusedMag[k] * 0.2;
    fusedMag[k] = fusedMag[k] * (1 - smear) + prevMag[k] * smear;
  }
  
  // FORM (bin warping)
  const form = params.FORM;
  const formShift = Math.pow(2, (form - 0.5) * 1.6);
  const warpedMag = new Float32Array(BINS);
  for (let k = 0; k < BINS; k++) {
    const srcBin = Math.round(k * formShift);
    if (srcBin >= 0 && srcBin < BINS) {
      warpedMag[k] = fusedMag[srcBin];
    }
  }
  
  // Phase handling: LOCKING + RANDOMIZATION
  const processedPhase = new Float32Array(BINS);
  const getRandomAmount = () => {
    if (state.mode === 'MATTER') {
      return STATES[state.matter].randomAmount * state.intensity;
    } else {
      const w = getStateWeights(srcMag);
      let rand = 0;
      Object.keys(STATES).forEach(sn => {
        rand += STATES[sn].randomAmount * w[sn];
      });
      return rand * state.intensity;
    }
  };
  const randomAmount = getRandomAmount();
  
  for (let k = 0; k < BINS; k++) {
    // Phase locking (continuity)
    if (prevPhaseOut[k] === undefined) {
      prevPhaseOut[k] = srcPhase[k];
    }
    
    let deltaPhase = srcPhase[k] - (prevPhaseOut[k] || srcPhase[k]);
    deltaPhase -= Math.round(deltaPhase / (2 * Math.PI)) * (2 * Math.PI);
    let lockedPhase = prevPhaseOut[k] + deltaPhase;
    
    // Phase randomization (texture)
    const rand = (Math.random() - 0.5) * randomAmount * Math.PI;
    processedPhase[k] = lockedPhase + rand;
    prevPhaseOut[k] = lockedPhase;
  }
  
  // IFFT (synthesis)
  for (let n = 0; n < input.length; n++) {
    let s = 0;
    const step = Math.floor(input.length / BINS);
    for (let k = 0; k < BINS; k++) {
      const ang = 2 * Math.PI * k * n / input.length;
      s += warpedMag[k] * Math.cos(ang + processedPhase[k]);
    }
    output[n] = s / BINS;
  }
  
  // DRY/WET
  for (let n = 0; n < input.length; n++) {
    output[n] = input[n] * (1 - state.dryWet) + output[n] * state.dryWet;
  }
  
  // Limiter
  let peak = 0;
  for (let n = 0; n < output.length; n++) {
    if (Math.abs(output[n]) > peak) peak = Math.abs(output[n]);
  }
  if (peak > 1) {
    for (let n = 0; n < output.length; n++) {
      output[n] /= peak;
    }
  }
  
  // Recording
  if (state.recordingBuffer && state.recordingIndex + output.length < state.recordingBuffer.length) {
    state.recordingBuffer.set(output, state.recordingIndex);
    state.recordingIndex += output.length;
  }
}

function getStateWeights(mag) {
  let rms = 0;
  for (let i = 0; i < mag.length; i++) rms += mag[i] * mag[i];
  rms = Math.sqrt(rms / mag.length);
  
  const centroid = calculateCentroid(mag);
  
  const susurroW = (1 - rms) * (1 - centroid);
  const ecoW = (1 - rms * 0.7) * Math.abs(centroid - 0.6);
  const ritualW = (0.5 - Math.abs(rms - 0.5)) * (0.5 - Math.abs(centroid - 0.5));
  const maquinaW = rms * (1 - centroid);
  const hibridoW = 0.5;
  const colapsoW = Math.max(rms, (1 - centroid) * 0.5);
  
  const sum = susurroW + ecoW + ritualW + maquinaW + hibridoW + colapsoW;
  
  return {
    Susurro: susurroW / (sum || 1),
    Eco: ecoW / (sum || 1),
    Ritual: ritualW / (sum || 1),
    Máquina: maquinaW / (sum || 1),
    Híbrido: hibridoW / (sum || 1),
    Colapso: colapsoW / (sum || 1),
  };
}

function calculateCentroid(mag) {
  let num = 0, denom = 0;
  for (let k = 0; k < mag.length; k++) {
    num += k * mag[k];
    denom += mag[k];
  }
  return denom > 0 ? num / denom / mag.length : 0.5;
}

function sampleTextureFrame() {
  const mag = new Float32Array(BINS);
  if (!state.bufB) return mag;
  
  const data = state.bufB.getChannelData(0);
  const pos = Math.floor(Math.random() * data.length);
  const frame = data.slice(pos, pos + 2048);
  
  for (let k = 0; k < BINS; k++) {
    let sr = 0, si = 0;
    const step = Math.floor(frame.length / BINS);
    for (let n = 0; n < frame.length; n += step) {
      const ang = -2 * Math.PI * k * n / frame.length;
      sr += (frame[n] || 0) * Math.cos(ang);
      si += (frame[n] || 0) * Math.sin(ang);
    }
    mag[k] = Math.sqrt(sr * sr + si * si);
  }
  
  return mag;
}

function buildMatterGrid() {

function buildKnobs() {
  const row = document.getElementById('knobsRow');
  const KNOBS = [
    { id: 'FORM', label: 'FORM' },
    { id: 'SMEAR', label: 'SMEAR' },
    { id: 'CROSS', label: 'CROSS' },
  ];
  
  KNOBS.forEach(k => {
    const wrap = document.createElement('div');
    wrap.className = 'knob-wrap';
    wrap.innerHTML = `
      <div class="knob-val" id="val_${k.id}">${Math.round(state.params[k.id] * 100)}</div>
      <svg class="knob" id="knob_${k.id}" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="kg_${k.id}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffff"/>
            <stop offset="50%" stop-color="#9944ff"/>
            <stop offset="100%" stop-color="#ff00ff"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="3.5"/>
        <path id="arc_${k.id}" fill="none" stroke="url(#kg_${k.id})" stroke-width="3.5" stroke-linecap="round"/>
        <circle id="dot_${k.id}" r="2" fill="white"/>
      </svg>
      <div class="knob-label">${k.label}</div>
    `;
    row.appendChild(wrap);
    updateKnobArc(k.id);
    addKnobEvents(k.id);
  });
}

function updateKnobArc(id) {
  const v = state.params[id];
  const startAngle = -220 * Math.PI / 180;
  const endAngle = startAngle + v * 260 * Math.PI / 180;
  const cx = 24, cy = 24, r = 18;
  const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
  const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
  const large = (v * 260) > 180 ? 1 : 0;
  const path = document.getElementById('arc_' + id);
  const dot = document.getElementById('dot_' + id);
  const val = document.getElementById('val_' + id);
  if (v > 0.005) path.setAttribute('d', `M${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2}`);
  else path.setAttribute('d', '');
  dot.setAttribute('cx', cx + r * Math.cos(endAngle));
  dot.setAttribute('cy', cy + r * Math.sin(endAngle));
  val.textContent = Math.round(v * 100);
}

function addKnobEvents(id) {
  const svg = document.getElementById('knob_' + id);
  let startY, startV;
  const onStart = e => {
    e.preventDefault();
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    startV = state.params[id];
    const onMove = e2 => {
      const y = e2.touches ? e2.touches[0].clientY : e2.clientY;
      const delta = (startY - y) / 140;
      state.params[id] = Math.max(0, Math.min(1, startV + delta));
      updateKnobArc(id);
    };
    const onEnd = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('mouseup', onEnd);
      window.removeEventListener('touchend', onEnd);
    };
    window.addEventListener('mousemove', onMove, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);
  };
  svg.addEventListener('mousedown', onStart);
  svg.addEventListener('touchstart', onStart, { passive: false });
}

async function startMicRec(slot) {
  const ac = getAC();
  ac.resume();
  
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  const chunks = [];
  const mr = new MediaRecorder(stream);
  
  if (slot === 'A') {
    state.recorderA = mr;
    state.isRecordingA = true;
  } else {
    state.recorderB = mr;
    state.isRecordingB = true;
  }
  
  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstop = async () => {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const ab = await blob.arrayBuffer();
    ac.decodeAudioData(ab.slice(0), buf => {
      const data = buf.getChannelData(0);
      // Apply gain + normalize
      for (let i = 0; i < data.length; i++) data[i] *= state.micGain;
      let peak = 0;
      for (let i = 0; i < data.length; i++) if (Math.abs(data[i]) > peak) peak = Math.abs(data[i]);
      if (peak > 0.01) {
        const norm = 0.9 / peak;
        for (let i = 0; i < data.length; i++) data[i] *= norm;
      }
      
      if (slot === 'A') {
        state.bufA = buf;
        document.getElementById('nameA').textContent = 'mic_A';
        drawWaveform('waveA', buf);
        state.isRecordingA = false;
      } else {
        state.bufB = buf;
        document.getElementById('nameB').textContent = 'mic_B';
        drawWaveform('waveB', buf);
        state.isRecordingB = false;
      }
      setStatus('mic captured · playing');
    });
    stream.getTracks().forEach(t => t.stop());
  };
  
  mr.start();
  document.getElementById('rec' + slot).textContent = '■ STOP';
  document.getElementById('rec' + slot).classList.add('recording');
  setStatus('recording…');
}

function stopMicRec(slot) {
  if (slot === 'A' && state.recorderA) {
    state.recorderA.stop();
  } else if (slot === 'B' && state.recorderB) {
    state.recorderB.stop();
  }
  document.getElementById('rec' + slot).textContent = '● REC';
  document.getElementById('rec' + slot).classList.remove('recording');
}

document.getElementById('recA').addEventListener('click', () => startMicRec('A'));
document.getElementById('stopA').addEventListener('click', () => stopMicRec('A'));
document.getElementById('recB').addEventListener('click', () => startMicRec('B'));
document.getElementById('stopB').addEventListener('click', () => stopMicRec('B'));

function drawWaveform(canvasId, buf) {
  const cv = document.getElementById(canvasId);
  const ctx = cv.getContext('2d');
  cv.width = cv.offsetWidth * window.devicePixelRatio;
  cv.height = cv.offsetHeight * window.devicePixelRatio;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!buf) return;
  const data = buf.getChannelData(0);
  const step = Math.ceil(data.length / cv.width);
  const h = cv.height, w = cv.width, mid = h / 2;
  ctx.strokeStyle = '#9944ff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < w; i++) {
    let max = 0;
    for (let j = 0; j < step; j++) {
      const s = Math.abs(data[i * step + j] || 0);
      if (s > max) max = s;
    }
    ctx.moveTo(i, mid - max * mid * 0.9);
    ctx.lineTo(i, mid + max * mid * 0.9);
  }
  ctx.stroke();
}

function drawAnalyser() {
  const canvas = document.getElementById('analyser');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  
  const dataArray = new Uint8Array(state.analyser.frequencyBinCount);
  state.analyser.getByteFrequencyData(dataArray);
  
  ctx.fillStyle = 'rgba(19,17,31,1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = '#9944ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const sliceWidth = canvas.width / dataArray.length;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = dataArray[i] / 256;
    const y = canvas.height - (v * canvas.height);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.stroke();
  
  requestAnimationFrame(drawAnalyser);
}

function saveToLibrary(buf, name) {
  const wav = encodeWAV(buf);
  const reader = new FileReader();
  reader.onload = () => {
    const tx = db.transaction('renders', 'readwrite');
    const store = tx.objectStore('renders');
    store.add({
      name,
      blob: reader.result,
      timestamp: Date.now(),
    });
  };
  reader.readAsArrayBuffer(wav);
}

function encodeWAV(buf) {
  const numCh = buf.numberOfChannels;
  const numSamples = buf.length;
  const sampleRate = buf.sampleRate;
  const bitsPerSample = 32;
  const byteRate = sampleRate * numCh * bitsPerSample / 8;
  const blockAlign = numCh * bitsPerSample / 8;
  const dataSize = numSamples * numCh * bitsPerSample / 8;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); view.setUint32(16, 18, true); view.setUint16(20, 3, true);
  view.setUint16(22, numCh, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true); view.setUint16(36, 0, true);
  writeStr(38, 'data'); view.setUint32(42, dataSize, true);
  let offset = 44;
  for (let i = 0; i < numSamples; i++) for (let c = 0; c < numCh; c++) { view.setFloat32(offset, buf.getChannelData(c)[i], true); offset += 4; }
  return new Blob([ab], { type: 'audio/wav' });
}

function loadLibraryList() {
  const tx = db.transaction('renders', 'readonly');
  const store = tx.objectStore('renders');
  const req = store.getAll();
  req.onsuccess = () => {
    const items = req.result.sort((a, b) => b.timestamp - a.timestamp);
    const list = document.getElementById('libraryList');
    list.innerHTML = '';
    if (items.length === 0) {
      list.innerHTML = '<div style="font-size:10px;color:var(--dim);text-align:center;">no renders yet</div>';
      return;
    }
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'lib-item';
      const time = new Date(item.timestamp).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `
        <div class="lib-name">${item.name}</div>
        <div class="lib-time">${time}</div>
        <div class="lib-btns">
          <button class="lib-btn" onclick="playLibItem(${item.id})">▶</button>
          <button class="lib-btn" onclick="exportLibItem(${item.id})">⬇</button>
          <button class="lib-btn" onclick="deleteLibItem(${item.id})">✕</button>
        </div>
      `;
      list.appendChild(div);
    });
  };
}

window.playLibItem = (id) => {
  const tx = db.transaction('renders', 'readonly');
  const store = tx.objectStore('renders');
  const req = store.get(id);
  req.onsuccess = () => {
    const item = req.result;
    const ac = getAC();
    ac.decodeAudioData(item.blob.slice(0), buf => {
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.connect(ac.destination);
      src.start(0);
      setStatus(`▶ ${item.name}`);
    });
  };
};

window.exportLibItem = (id) => {
  const tx = db.transaction('renders', 'readonly');
  const store = tx.objectStore('renders');
  const req = store.get(id);
  req.onsuccess = () => {
    const item = req.result;
    const url = URL.createObjectURL(new Blob([item.blob], { type: 'audio/wav' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `${item.name}.wav`;
    a.click();
    URL.revokeObjectURL(url);
  };
};

window.deleteLibItem = (id) => {
  const tx = db.transaction('renders', 'readwrite');
  const store = tx.objectStore('renders');
  store.delete(id);
  loadLibraryList();
};

document.getElementById('btnLibrary').addEventListener('click', () => {
  const panel = document.getElementById('libraryPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    loadLibraryList();
  }
});

document.getElementById('libClose').addEventListener('click', () => {
  document.getElementById('libraryPanel').classList.remove('open');
});

document.getElementById('btnRec').addEventListener('click', async () => {
  if (!state.bufA || !state.bufB) {
    setStatus('load or record both slots first', true);
    return;
  }
  
  const ac = getAC();
  const btn = document.getElementById('btnRec');
  btn.classList.add('recording');
  btn.textContent = '⏹ RECORDING';
  
  const maxDuration = Math.max(state.bufA.duration, state.bufB.duration);
  const sampleRate = ac.sampleRate;
  state.recordingBuffer = new Float32Array(maxDuration * sampleRate);
  state.recordingIndex = 0;
  
  const src = ac.createBufferSource();
  src.buffer = state.bufA;
  src.connect(ac.destination);
  src.start(0);
  
  await new Promise(r => setTimeout(r, maxDuration * 1000 + 100));
  
  const recBuf = ac.createBuffer(1, state.recordingIndex, sampleRate);
  recBuf.copyToChannel(state.recordingBuffer.slice(0, state.recordingIndex), 0);
  
  const ts = new Date();
  const hhmm = `${String(ts.getHours()).padStart(2, '0')}${String(ts.getMinutes()).padStart(2, '0')}`;
  const name = `VoxDust_${hhmm}`;
  
  saveToLibrary(recBuf, name);
  
  btn.classList.remove('recording');
  btn.textContent = '⏺ REC';
  setStatus(`✓ ${name} saved to library`);
  loadLibraryList();
};

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isError ? ' error' : ' active');
}

async function init() {
  await initDB();
  buildMatterGrid();
  buildKnobs();
  await initAudio();
  drawAnalyser();
}

init();
