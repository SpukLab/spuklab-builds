<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoxDust v11</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg1:#13111f;--bg2:#1b1726;
  --border:rgba(153,68,255,.18);--glow:rgba(153,68,255,.08);
  --canvas-bg:rgba(153,68,255,.06);
  --cyan:#00ffff;--magenta:#ff00ff;--violet:#9944ff;--violetlt:#b580ff;
  --btn:rgba(153,68,255,.07);--active:rgba(153,68,255,.18);
  --white:rgba(255,255,255,.92);--dim:rgba(255,255,255,.38);
}
body{background:linear-gradient(155deg,var(--bg1),var(--bg2));min-height:100vh;color:var(--white);font-family:'Inter',sans-serif;font-size:13px;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px;gap:12px;overflow-x:hidden;}
.logo{font-family:'JetBrains Mono',monospace;font-style:italic;letter-spacing:.04em;}
.logo .spuk{font-weight:800;color:var(--white);font-size:22px;}
.logo .lab{font-weight:300;color:var(--cyan);font-size:22px;}
.logo .sub{font-size:10px;color:var(--dim);display:block;margin-top:2px;letter-spacing:.12em;}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:flex-start;}
.version{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);}
.canvas-wrap{width:100%;max-width:480px;background:var(--canvas-bg);border:1px solid var(--border);border-radius:12px;height:100px;position:relative;overflow:hidden;cursor:crosshair;}
canvas#analyser{width:100%;height:100%;display:block;}
.playhead{position:absolute;top:0;left:0;width:2px;height:100%;background:var(--cyan);opacity:.8;pointer-events:none;z-index:10;}
.gesture-pad{position:absolute;width:100%;height:100%;left:0;top:0;z-index:5;}
.controls-row{width:100%;max-width:480px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ctrl-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);flex-shrink:0;}
select{background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--dim);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;border-radius:5px;padding:4px;cursor:pointer;}
.slots{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.slot{background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;}
.slot-header{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:11px;color:var(--violetlt);letter-spacing:.08em;}
.slot-name{font-size:10px;color:var(--dim);min-height:14px;overflow:hidden;text-overflow:ellipsis;}
.slot-btn{width:100%;padding:8px;border:1px solid var(--border);background:var(--btn);border-radius:6px;color:var(--white);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;cursor:pointer;transition:all .15s;}
.slot-btn:active{background:var(--active);color:var(--cyan);}
.slot-btn.active{border-color:var(--violet);}
.slot-btn.recording{border-color:#ff3030;color:#ff3030;animation:rb .6s infinite;}
@keyframes rb{0%,100%{opacity:1;}50%{opacity:.3;}}
.matter-section{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.matter-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.matter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.matter-btn{padding:8px 0;border:1px solid var(--border);background:var(--btn);border-radius:6px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:8px;color:var(--dim);cursor:pointer;transition:all .15s;}
.matter-btn.active{background:var(--active);color:var(--cyan);border-color:var(--violet);}
.spectral-section{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.spectral-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;margin-bottom:2px;}
.spectral-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.spectral-item{display:flex;flex-direction:column;gap:4px;}
.spectral-val{font-size:9px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.06);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;border:none;}
.transport{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tbtn{padding:10px 0;border:1px solid var(--border);background:var(--btn);border-radius:8px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--white);cursor:pointer;text-align:center;transition:all .15s;letter-spacing:.04em;}
.tbtn:active{background:var(--active);color:var(--cyan);}
.tbtn.disabled{opacity:.35;pointer-events:none;}
.tbtn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,255,.08);}
.status{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);text-align:center;min-height:14px;max-width:480px;}
.status.active{color:var(--cyan);}
.status.error{color:var(--magenta);}
.library{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.lib-title{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.lib-list{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.lib-item{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:9px;color:var(--dim);font-family:'JetBrains Mono',monospace;font-style:italic;display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center;}
.lib-info{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-btn{padding:2px 4px;font-size:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);border-radius:3px;cursor:pointer;color:var(--cyan);flex-shrink:0;}
.lib-btn:active{background:var(--active);}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="spuk">SPUK</span><span class="lab">LAB</span><span class="sub">VoxDust · phase vocoder</span></div>
  <div class="version">v11</div>
</header>

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="analyser"></canvas>
  <canvas id="gesturePad" class="gesture-pad" style="display:none;"></canvas>
  <div class="playhead" id="playhead" style="display:none;"></div>
</div>

<div class="controls-row">
  <span class="ctrl-label">SPEED</span>
  <select id="playSpeed">
    <option value="0.5">0.5x</option>
    <option value="0.75">0.75x</option>
    <option value="1" selected>1.0x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2.0x</option>
  </select>
  <span class="ctrl-label" style="margin-left:auto;">A←→B</span>
  <input type="range" id="mixABSlider" min="0" max="100" value="50" style="flex:1;max-width:80px;">
  <span id="valMixAB" style="font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--cyan);min-width:24px;">50</span>
</div>

<div class="slots">
  <div class="slot">
    <div class="slot-header">MIC A</div>
    <div class="slot-name" id="nameA">ready</div>
    <button class="slot-btn" id="recA">● REC</button>
  </div>
  <div class="slot">
    <div class="slot-header">MIC B</div>
    <div class="slot-name" id="nameB">ready</div>
    <button class="slot-btn" id="recB">● REC</button>
  </div>
</div>

<div class="matter-section">
  <div class="matter-label">STATE</div>
  <div class="matter-grid" id="matterGrid"></div>
</div>

<div class="spectral-section">
  <div class="spectral-label">SPECTRAL + FREEZE MORPH</div>
  <div class="spectral-row">
    <div class="spectral-item">
      <div class="spectral-val" id="valFORM">50</div>
      <div style="font-size:9px;color:var(--dim);">FORM</div>
      <input type="range" id="formSlider" min="0" max="100" value="50">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valSMEAR">50</div>
      <div style="font-size:9px;color:var(--dim);">SMEAR</div>
      <input type="range" id="smearSlider" min="0" max="100" value="50">
    </div>
    <div class="spectral-item">
      <button class="lib-btn" id="btnFreeze1" style="width:100%;padding:6px;font-size:9px;color:var(--magenta);">❄ F1</button>
    </div>
  </div>
  <div class="spectral-label" style="margin-top:8px;">FREEZE MORPH (F1 ↔ F2)</div>
  <div style="display:flex;gap:4px;align-items:center;margin-bottom:8px;">
    <button class="lib-btn" id="btnFreeze2" style="padding:6px;font-size:9px;color:var(--magenta);">❄ F2</button>
    <input type="range" id="freezeMorphSlider" min="0" max="100" value="50" style="flex:1;">
    <span id="valFreezeMorph" style="font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--cyan);min-width:24px;">50</span>
  </div>
  <div class="spectral-label" style="margin-top:8px;">FX</div>
  <div class="spectral-row">
    <div class="spectral-item">
      <div class="spectral-val" id="valReverb">30</div>
      <div style="font-size:9px;color:var(--dim);">REVERB</div>
      <input type="range" id="reverbSlider" min="0" max="100" value="30">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valDryWet">50</div>
      <div style="font-size:9px;color:var(--dim);">DRY/WET</div>
      <input type="range" id="dryWetSlider" min="0" max="100" value="50">
    </div>
    <div class="spectral-item">
      <div class="spectral-val" id="valIntensity">50</div>
      <div style="font-size:9px;color:var(--dim);">INTENSITY</div>
      <input type="range" id="intensitySlider" min="0" max="100" value="50">
    </div>
  </div>
</div>

<div class="transport">
  <button class="tbtn" id="btnPlay">▶ PLAY</button>
  <button class="tbtn disabled" id="btnStop">⏹ STOP</button>
  <button class="tbtn" id="btnRec">⏺ REC OUT</button>
  <button class="tbtn" id="btnGesture">◆ GESTURE</button>
</div>

<div class="status" id="status">tap REC A and REC B</div>

<div class="library">
  <div class="lib-title">TAKES</div>
  <div class="lib-list" id="libList"><div style="font-size:10px;color:rgba(255,255,255,.15);padding:4px;">no takes yet</div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// VOXDUST v11 — STFT-BASED PSEUDO PHASE VOCODER
// Overlap-Add, Direct Mic Input, Smooth Normalization, Continuous Processing
// ═══════════════════════════════════════════════════════════════════════════

var AC, analyser, micStream;
var playingSources = [];

var state = {
  form: 0.5,
  smear: 0.5,
  dryWet: 0.5,
  intensity: 0.5,
  reverb: 0.3,
  matter: 'Ritual',
  bufA: null,
  bufB: null,
  mixAB: 0.5,
  playSpeed: 1,
  isPlaying: false,
  freezeActive1: false,
  freezeActive2: false,
  freezeMorph: 0.5,
  gestureRecording: false,
};

var micRecordingState = { recording: false, processor: null, chunksA: [], chunksB: [] };
var automationEvents = [];
var gestureEvents = [];

const STATES = {
  Susurro:  { randomAmount: 0.1 },
  Eco:      { randomAmount: 0.8 },
  Ritual:   { randomAmount: 0.3 },
  Máquina:  { randomAmount: 0.2 },
  Híbrido:  { randomAmount: 0.4 },
  Colapso:  { randomAmount: 0.9 },
};

// ═══════════════════════════════════════════════════════════════════════════
// FRAME PROCESSOR — STFT + OVERLAP-ADD (v11 core)
// ═══════════════════════════════════════════════════════════════════════════

class FrameProcessor {
  constructor(sampleRate) {
    this.FFT_SIZE = 512;
    this.HOP_SIZE = 128; // 75% overlap (4x overlap)
    this.sampleRate = sampleRate;
    
    // Input circular buffer
    this.inputBuffer = new Float32Array(this.FFT_SIZE);
    this.inputWritePos = 0;
    
    // Output overlap-add buffer
    this.outputBuffer = new Float32Array(this.FFT_SIZE * 2);
    this.outputReadPos = 0;
    
    // Hann window
    this.hannWindow = this.generateHannWindow();
    
    // Spectral state
    this.prevPhase = new Float32Array(this.FFT_SIZE / 2);
    this.prevPhaseLocked = new Float32Array(this.FFT_SIZE / 2);
    this.prevMag = new Float32Array(this.FFT_SIZE / 2);
    this.prevFrame = new Float32Array(this.FFT_SIZE);
    this.peaks = [];
    this.peakGroups = [];
    
    // Freeze buffers
    this.freezeBuffer1 = [];
    this.freezeBuffer2 = [];
    this.freezeWriteIdx1 = 0;
    this.freezeWriteIdx2 = 0;
    this.freezeIndex1 = 0;
    this.freezeIndex2 = 0;
    
    const FREEZE_BUFFER_SIZE = 32;
    for (let i = 0; i < FREEZE_BUFFER_SIZE; i++) {
      this.freezeBuffer1.push({ mag: new Float32Array(this.FFT_SIZE / 2), phase: new Float32Array(this.FFT_SIZE / 2) });
      this.freezeBuffer2.push({ mag: new Float32Array(this.FFT_SIZE / 2), phase: new Float32Array(this.FFT_SIZE / 2) });
    }
    
    // Working buffers
    this.tempMag = new Float32Array(this.FFT_SIZE / 2);
    this.tempPhase = new Float32Array(this.FFT_SIZE / 2);
    
    // Smooth gain (not per-frame normalization)
    this.smoothedGain = 0.9;
    this.gainAlpha = 0.1;
  }
  
  generateHannWindow() {
    const window = new Float32Array(this.FFT_SIZE);
    for (let i = 0; i < this.FFT_SIZE; i++) {
      window[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (this.FFT_SIZE - 1)));
    }
    return window;
  }
  
  pushSample(sample) {
    this.inputBuffer[this.inputWritePos++] = sample;
    
    if (this.inputWritePos >= this.FFT_SIZE) {
      this.processFrame();
      
      // Shift input buffer by HOP_SIZE
      this.inputBuffer.copyWithin(0, this.HOP_SIZE);
      this.inputWritePos = this.FFT_SIZE - this.HOP_SIZE;
    }
  }
  
  processFrame() {
    const FFT_BINS = this.FFT_SIZE / 2;
    
    // 1. Apply Hann window to input
    const windowed = new Float32Array(this.FFT_SIZE);
    for (let i = 0; i < this.FFT_SIZE; i++) {
      windowed[i] = this.inputBuffer[i] * this.hannWindow[i];
    }
    
    // 2. FFT
    const { mag: magA, phase: phaseA } = this.simpleDFT(windowed);
    
    // 3. TU PIPELINE SPECTRAL (intacto)
    const { mag, phase } = this.processSpectralFrame(magA, phaseA);
    
    // 4. IFFT
    let frame = this.reconstructFromFFT(mag, phase);
    
    // 5. Apply Hann window to output
    for (let i = 0; i < this.FFT_SIZE; i++) {
      frame[i] *= this.hannWindow[i];
    }
    
    // 6. OVERLAP-ADD
    for (let i = 0; i < this.FFT_SIZE; i++) {
      this.outputBuffer[i] += frame[i];
    }
    
    // 7. Smooth gain update (not per-frame)
    let peakOut = 0;
    for (let i = 0; i < this.FFT_SIZE; i++) {
      peakOut = Math.max(peakOut, Math.abs(this.outputBuffer[i]));
    }
    const targetGain = peakOut > 0 ? 0.9 / peakOut : 0.9;
    this.smoothedGain = this.smoothedGain * (1 - this.gainAlpha) + targetGain * this.gainAlpha;
  }
  
  pullOutput() {
    const out = new Float32Array(this.HOP_SIZE);
    
    for (let i = 0; i < this.HOP_SIZE; i++) {
      out[i] = this.outputBuffer[this.outputReadPos + i] * this.smoothedGain;
    }
    
    // Shift output buffer
    this.outputBuffer.copyWithin(0, this.HOP_SIZE);
    this.outputBuffer.fill(0, this.FFT_SIZE);
    
    return out;
  }
  
  // ═══════════════════════════════════════════════════════════════════════
  // SPECTRAL PROCESSING (from v10, optimized)
  // ═══════════════════════════════════════════════════════════════════════
  
  detectTransient(currFrame, threshold = 1.8) {
    let energyPrev = 0, energyCurr = 0;
    for (let i = 0; i < currFrame.length; i++) {
      energyPrev += this.prevFrame[i] * this.prevFrame[i];
      energyCurr += currFrame[i] * currFrame[i];
    }
    const ratio = energyCurr / (energyPrev + 1e-6);
    this.prevFrame.set(currFrame);
    return ratio > threshold;
  }
  
  detectPeaks(mag, threshold = 0.01) {
    const FFT_BINS = mag.length;
    let currPeaks = [];
    for (let k = 1; k < FFT_BINS - 1; k++) {
      if (mag[k] > threshold && mag[k] > mag[k-1] && mag[k] > mag[k+1]) {
        currPeaks.push({ idx: k, mag: mag[k] });
      }
    }
    this.peaks = currPeaks;
    
    this.peakGroups = [];
    const covered = new Uint8Array(FFT_BINS);
    for (let p of this.peaks) {
      const group = [];
      for (let k = Math.max(0, Math.floor(p.idx) - 3); k <= Math.min(FFT_BINS - 1, Math.floor(p.idx) + 3); k++) {
        if (!covered[k]) {
          group.push(k);
          covered[k] = 1;
        }
      }
      this.peakGroups.push({ peak: p, bins: group });
    }
  }
  
  applyWeightedPhaseLocking(phase, peakWidth) {
    for (let group of this.peakGroups) {
      const peakIdx = Math.floor(group.peak.idx);
      let deltaPhase = phase[peakIdx] - this.prevPhase[peakIdx];
      deltaPhase -= Math.round(deltaPhase / (2 * Math.PI)) * (2 * Math.PI);
      
      const sigma = peakWidth * 2;
      for (let k of group.bins) {
        const dist = Math.abs(k - peakIdx);
        const weight = Math.exp(-(dist * dist) / (sigma * sigma));
        phase[k] = phase[k] * (1 - weight) + (this.prevPhase[k] + deltaPhase) * weight;
      }
    }
    this.prevPhase.set(phase);
  }
  
  accumulatePhase(phase) {
    for (let i = 0; i < phase.length; i++) {
      let delta = phase[i] - this.prevPhase[i];
      while (delta > Math.PI) delta -= 2 * Math.PI;
      while (delta < -Math.PI) delta += 2 * Math.PI;
      phase[i] = this.prevPhaseLocked[i] + delta;
      this.prevPhaseLocked[i] = phase[i];
    }
  }
  
  applyFreezeMorph(mag, phase, morph) {
    const FFT_BINS = mag.length;
    if (!state.freezeActive1 && !state.freezeActive2) return;
    
    const amount1 = state.freezeActive1 ? (1 - morph) : 0;
    const amount2 = state.freezeActive2 ? morph : 0;
    
    if (amount1 > 0) {
      this.freezeIndex1 += 0.01;
      this.freezeIndex1 = this.freezeIndex1 % 32;
      
      const idx1 = Math.floor(this.freezeIndex1);
      const idx2 = (idx1 + 1) % 32;
      const interp = this.freezeIndex1 % 1;
      
      const frame1 = this.freezeBuffer1[idx1];
      const frame2 = this.freezeBuffer1[idx2];
      
      for (let k = 0; k < FFT_BINS; k++) {
        const frozenMag = frame1.mag[k] * (1 - interp) + frame2.mag[k] * interp;
        mag[k] = mag[k] * (1 - amount1) + frozenMag * amount1;
      }
    }
    
    if (amount2 > 0) {
      this.freezeIndex2 += 0.01;
      this.freezeIndex2 = this.freezeIndex2 % 32;
      
      const idx1 = Math.floor(this.freezeIndex2);
      const idx2 = (idx1 + 1) % 32;
      const interp = this.freezeIndex2 % 1;
      
      const frame1 = this.freezeBuffer2[idx1];
      const frame2 = this.freezeBuffer2[idx2];
      
      for (let k = 0; k < FFT_BINS; k++) {
        const frozenMag = frame1.mag[k] * (1 - interp) + frame2.mag[k] * interp;
        mag[k] = mag[k] * (1 - amount2) + frozenMag * amount2;
      }
    }
    
    // Energy normalization for freeze
    const total = 1 + amount1 + amount2;
    if (total > 1) {
      for (let k = 0; k < FFT_BINS; k++) {
        mag[k] /= total;
      }
    }
  }
  
  storeFreezeMorph(mag, phase, which) {
    const buffer = which === 1 ? this.freezeBuffer1 : this.freezeBuffer2;
    const frame = buffer[which === 1 ? this.freezeWriteIdx1 : this.freezeWriteIdx2];
    frame.mag.set(mag);
    frame.phase.set(phase);
    
    if (which === 1) {
      this.freezeWriteIdx1 = (this.freezeWriteIdx1 + 1) % 32;
    } else {
      this.freezeWriteIdx2 = (this.freezeWriteIdx2 + 1) % 32;
    }
  }
  
  applyEnergyWeightedRandom(phase, mag, amount) {
    const spread = amount * Math.PI;
    for (let i = 10; i < phase.length; i++) {
      const energy = mag[i];
      const delta = (Math.random() - 0.5) * spread;
      const weight = 1 / (1 + energy * 15);
      phase[i] += delta * weight;
    }
  }
  
  processSpectralFrame(magA, magB) {
    const FFT_BINS = magA.length;
    
    // Check transient
    const windowed = new Float32Array(this.FFT_SIZE);
    for (let i = 0; i < this.FFT_SIZE; i++) {
      windowed[i] = this.inputBuffer[i];
    }
    const isTransient = this.detectTransient(windowed);
    const transientMix = isTransient ? 0.2 : 1.0;
    
    // Cross magnitude
    const mag = new Float32Array(FFT_BINS);
    for (let k = 0; k < FFT_BINS; k++) {
      const blendA = magA[k] * (1 - state.mixAB);
      const blendB = magB[k] * state.mixAB;
      mag[k] = Math.sqrt(blendA * blendB);
    }
    
    // FORM shift
    const formShift = Math.pow(2, (state.form - 0.5) * 1.6);
    const formMag = new Float32Array(FFT_BINS);
    for (let k = 0; k < FFT_BINS; k++) {
      const idx = Math.floor(k / formShift);
      if (idx >= 0 && idx < FFT_BINS) formMag[k] = mag[idx];
    }
    mag.set(formMag);
    
    // SMEAR (reduced since overlap-add provides smoothing)
    for (let k = 0; k < mag.length; k++) {
      this.prevMag[k] = this.prevMag[k] * 0.85 + mag[k] * 0.15;
      const smear = state.smear * 0.4 * transientMix; // reduced
      mag[k] = mag[k] * (1 - smear) + this.prevMag[k] * smear;
    }
    
    // Freeze morph
    this.applyFreezeMorph(mag, new Float32Array(FFT_BINS), state.freezeMorph);
    if (state.freezeActive1) this.storeFreezeMorph(mag, new Float32Array(FFT_BINS), 1);
    if (state.freezeActive2) this.storeFreezeMorph(mag, new Float32Array(FFT_BINS), 2);
    
    // Peaks + locking
    this.detectPeaks(mag, 0.02);
    const phaseA = new Float32Array(FFT_BINS);
    const peakWidth = state.form * 8;
    this.applyWeightedPhaseLocking(phaseA, peakWidth);
    let phase = phaseA;
    
    // Random (energy-aware)
    const randAmt = STATES[state.matter].randomAmount * state.intensity * transientMix;
    this.applyEnergyWeightedRandom(phase, mag, randAmt);
    
    // Phase accumulation (ALWAYS active)
    this.accumulatePhase(phase);
    
    return { mag, phase };
  }
  
  simpleDFT(signal) {
    const FFT_BINS = this.FFT_SIZE / 2;
    const mag = new Float32Array(FFT_BINS);
    const phase = new Float32Array(FFT_BINS);
    
    for (let k = 0; k < FFT_BINS; k++) {
      let realSum = 0, imagSum = 0;
      for (let n = 0; n < this.FFT_SIZE; n++) {
        const angle = -2 * Math.PI * k * n / this.FFT_SIZE;
        realSum += signal[n] * Math.cos(angle);
        imagSum += signal[n] * Math.sin(angle);
      }
      mag[k] = Math.sqrt(realSum * realSum + imagSum * imagSum) / this.FFT_SIZE;
      phase[k] = Math.atan2(imagSum, realSum);
    }
    
    return { mag, phase };
  }
  
  reconstructFromFFT(mag, phase) {
    const output = new Float32Array(this.FFT_SIZE);
    const FFT_BINS = mag.length;
    
    for (let n = 0; n < this.FFT_SIZE; n++) {
      let sample = 0;
      for (let k = 0; k < FFT_BINS; k++) {
        const angle = 2 * Math.PI * k * n / this.FFT_SIZE;
        sample += mag[k] * Math.cos(angle + phase[k]);
      }
      output[n] = sample * 0.5;
    }
    
    return output;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// AUDIO CONTEXT + INITIALIZATION
// ═══════════════════════════════════════════════════════════════════════════

var frameProcessorA, frameProcessorB, frameProcessorOut;

function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}

function initAC() {
  if (AC && analyser) return Promise.resolve();
  
  return new Promise(resolve => {
    AC = getAC();
    analyser = AC.createAnalyser();
    analyser.fftSize = 256;
    
    frameProcessorA = new FrameProcessor(AC.sampleRate);
    frameProcessorB = new FrameProcessor(AC.sampleRate);
    frameProcessorOut = new FrameProcessor(AC.sampleRate);
    
    const silentBuf = AC.createBuffer(1, 1, AC.sampleRate);
    const silentSrc = AC.createBufferSource();
    silentSrc.buffer = silentBuf;
    silentSrc.connect(AC.destination);
    silentSrc.start();
    
    setTimeout(() => {
      setStatus('ready · v11 STFT');
      resolve();
    }, 100);
  });
}

function buildMatterGrid() {
  const grid = document.getElementById('matterGrid');
  Object.keys(STATES).forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'matter-btn' + (label === 'Ritual' ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      state.matter = label;
      document.querySelectorAll('.matter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    grid.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// MIC RECORDING (Direct ScriptProcessor, no MediaRecorder)
// ═══════════════════════════════════════════════════════════════════════════

async function toggleMicRecording(slot) {
  if (micRecordingState.recording) {
    micRecordingState.recording = false;
    micRecordingState.processor.disconnect();
    micStream.getTracks().forEach(t => t.stop());
    
    document.getElementById('rec' + slot).classList.remove('recording');
    document.getElementById('rec' + slot).textContent = '● REC';
    
    // Build buffer from chunks
    const chunks = slot === 'A' ? micRecordingState.chunksA : micRecordingState.chunksB;
    const totalSamples = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
    const buffer = AC.createBuffer(1, totalSamples, AC.sampleRate);
    const bufData = buffer.getChannelData(0);
    
    let offset = 0;
    chunks.forEach(chunk => {
      bufData.set(chunk, offset);
      offset += chunk.length;
    });
    
    // Normalize
    let peak = 0;
    for (let i = 0; i < totalSamples; i++) {
      peak = Math.max(peak, Math.abs(bufData[i]));
    }
    const gainNorm = peak > 0 ? 0.9 / peak : 1;
    for (let i = 0; i < totalSamples; i++) {
      bufData[i] *= gainNorm;
    }
    
    if (slot === 'A') {
      state.bufA = buffer;
      document.getElementById('nameA').textContent = 'A · ' + buffer.duration.toFixed(2) + 's';
      document.getElementById('recA').classList.add('active');
    } else {
      state.bufB = buffer;
      document.getElementById('nameB').textContent = 'B · ' + buffer.duration.toFixed(2) + 's';
      document.getElementById('recB').classList.add('active');
    }
    
    setStatus(slot + ' captured', false);
    
  } else {
    const ac = getAC();
    await ac.resume();
    
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }
      });
      
      micRecordingState.chunksA = [];
      micRecordingState.chunksB = [];
      micRecordingState.recording = true;
      
      const micSrc = ac.createMediaStreamSource(micStream);
      const processor = ac.createScriptProcessor(4096, 1, 1);
      micRecordingState.processor = processor;
      
      // HPF + Comp monitoring (optional)
      const hpf = ac.createBiquadFilter();
      hpf.type = "highpass";
      hpf.frequency.value = 80;
      
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -24;
      comp.knee.value = 30;
      comp.ratio.value = 3;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      
      micSrc.connect(hpf);
      hpf.connect(comp);
      comp.connect(processor);
      processor.connect(ac.destination);
      
      processor.onaudioprocess = e => {
        const inL = e.inputBuffer.getChannelData(0);
        const out = new Float32Array(inL.length);
        
        // Soft gate
        const threshold = 0.02;
        for (let i = 0; i < inL.length; i++) {
          const a = Math.abs(inL[i]);
          if (a < threshold) {
            out[i] = inL[i] * (a / threshold);
          } else {
            out[i] = inL[i];
          }
        }
        
        if (slot === 'A') {
          micRecordingState.chunksA.push(new Float32Array(out));
        } else {
          micRecordingState.chunksB.push(new Float32Array(out));
        }
      };
      
      document.getElementById('rec' + slot).classList.add('recording');
      document.getElementById('rec' + slot).textContent = '■ STOP';
      setStatus('recording ' + slot, false);
      
    } catch (err) {
      setStatus('error: ' + err.message, true);
      micRecordingState.recording = false;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// UI CONTROLS
// ═══════════════════════════════════════════════════════════════════════════

document.getElementById('formSlider').addEventListener('input', e => {
  state.form = parseFloat(e.target.value) / 100;
  document.getElementById('valFORM').textContent = e.target.value;
  automationEvents.push({ time: AC ? AC.currentTime : 0, param: 'form', value: state.form });
});

document.getElementById('smearSlider').addEventListener('input', e => {
  state.smear = parseFloat(e.target.value) / 100;
  document.getElementById('valSMEAR').textContent = e.target.value;
});

document.getElementById('reverbSlider').addEventListener('input', e => {
  state.reverb = parseFloat(e.target.value) / 100;
  document.getElementById('valReverb').textContent = e.target.value;
});

document.getElementById('dryWetSlider').addEventListener('input', e => {
  state.dryWet = parseFloat(e.target.value) / 100;
  document.getElementById('valDryWet').textContent = e.target.value;
});

document.getElementById('intensitySlider').addEventListener('input', e => {
  state.intensity = parseFloat(e.target.value) / 100;
  document.getElementById('valIntensity').textContent = e.target.value;
});

document.getElementById('mixABSlider').addEventListener('input', e => {
  state.mixAB = parseFloat(e.target.value) / 100;
  document.getElementById('valMixAB').textContent = e.target.value;
});

document.getElementById('playSpeed').addEventListener('change', e => {
  state.playSpeed = parseFloat(e.target.value);
});

document.getElementById('freezeMorphSlider').addEventListener('input', e => {
  state.freezeMorph = parseFloat(e.target.value) / 100;
  document.getElementById('valFreezeMorph').textContent = e.target.value;
});

document.getElementById('btnFreeze1').addEventListener('click', () => {
  state.freezeActive1 = !state.freezeActive1;
  document.getElementById('btnFreeze1').style.color = state.freezeActive1 ? 'var(--cyan)' : 'var(--magenta)';
});

document.getElementById('btnFreeze2').addEventListener('click', () => {
  state.freezeActive2 = !state.freezeActive2;
  document.getElementById('btnFreeze2').style.color = state.freezeActive2 ? 'var(--cyan)' : 'var(--magenta)';
});

document.getElementById('recA').addEventListener('click', () => toggleMicRecording('A'));
document.getElementById('recB').addEventListener('click', () => toggleMicRecording('B'));

document.getElementById('btnGesture').addEventListener('click', () => {
  state.gestureRecording = !state.gestureRecording;
  const btn = document.getElementById('btnGesture');
  const canvas = document.getElementById('gesturePad');
  
  if (state.gestureRecording) {
    gestureEvents = [];
    btn.classList.add('on');
    canvas.style.display = 'block';
    setStatus('gesture recording', false);
  } else {
    btn.classList.remove('on');
    canvas.style.display = 'none';
    setStatus('gesture recorded', false);
  }
});

let gestureStartTime = 0;
document.getElementById('gesturePad').addEventListener('touchstart', e => {
  if (!state.gestureRecording) return;
  gestureStartTime = AC ? AC.currentTime : 0;
}, { passive: true });

document.getElementById('gesturePad').addEventListener('touchmove', e => {
  if (!state.gestureRecording) return;
  const canvas = document.getElementById('gesturePad');
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  
  const x = (touch.clientX - rect.left) / rect.width;
  const y = (touch.clientY - rect.top) / rect.height;
  
  gestureEvents.push({
    time: (AC ? AC.currentTime : 0) - gestureStartTime,
    x: Math.max(0, Math.min(1, x)),
    y: Math.max(0, Math.min(1, y))
  });
}, { passive: true });

// PLAYBACK
document.getElementById('btnPlay').addEventListener('click', () => {
  if (!state.bufA || !state.bufB) {
    setStatus('rec A and B first', true);
    return;
  }
  state.isPlaying = true;
  automationEvents = [];
  document.getElementById('btnPlay').classList.add('on');
  document.getElementById('btnStop').classList.remove('disabled');
  document.getElementById('playhead').style.display = 'block';
  setStatus('playing', false);
  playLoop();
});

document.getElementById('btnStop').addEventListener('click', () => {
  state.isPlaying = false;
  document.getElementById('btnPlay').classList.remove('on');
  document.getElementById('btnStop').classList.add('disabled');
  document.getElementById('playhead').style.display = 'none';
  playingSources.forEach(src => { try { src.stop(); } catch(e) {} });
  playingSources = [];
  setStatus('stopped', false);
});

function playLoop() {
  if (!state.isPlaying || !state.bufA || !state.bufB) return;
  
  const loopDur = Math.min(state.bufA.duration, state.bufB.duration) / state.playSpeed;
  const srcA = AC.createBufferSource();
  const srcB = AC.createBufferSource();
  
  srcA.buffer = state.bufA;
  srcB.buffer = state.bufB;
  srcA.playbackRate.value = state.playSpeed;
  srcB.playbackRate.value = state.playSpeed;
  
  const gainA = AC.createGain();
  const gainB = AC.createGain();
  gainA.gain.value = Math.max(0, 1 - state.mixAB * 2);
  gainB.gain.value = Math.max(0, (state.mixAB - 0.5) * 2);
  
  srcA.connect(gainA);
  srcB.connect(gainB);
  gainA.connect(AC.destination);
  gainB.connect(AC.destination);
  analyser.connect(AC.destination);
  
  srcA.start(0);
  srcB.start(0);
  
  playingSources.push(srcA, srcB);
  
  const startTime = AC.currentTime;
  const updateInterval = setInterval(() => {
    if (!state.isPlaying) {
      clearInterval(updateInterval);
      try { srcA.stop(); srcB.stop(); } catch(e) {}
      playingSources = [];
      return;
    }
    
    const elapsed = AC.currentTime - startTime;
    if (elapsed >= loopDur) {
      clearInterval(updateInterval);
      try { srcA.stop(); srcB.stop(); } catch(e) {}
      playingSources = [];
      playLoop();
    } else {
      const progress = elapsed / loopDur;
      document.getElementById('playhead').style.left = (progress * document.getElementById('canvasWrap').offsetWidth) + 'px';
    }
  }, 50);
}

// REC OUT (with STFT processing via FrameProcessor)
document.getElementById('btnRec').addEventListener('click', async () => {
  if (!state.bufA || !state.bufB) {
    setStatus('rec A and B first', true);
    return;
  }
  
  const btn = document.getElementById('btnRec');
  btn.classList.add('disabled');
  btn.textContent = 'PROCESSING…';
  
  const loopDur = Math.min(state.bufA.duration, state.bufB.duration);
  
  const srcA = AC.createBufferSource();
  const srcB = AC.createBufferSource();
  srcA.buffer = state.bufA;
  srcB.buffer = state.bufB;
  srcA.loop = true;
  srcB.loop = true;
  
  const gainA = AC.createGain();
  const gainB = AC.createGain();
  gainA.gain.value = Math.max(0, 1 - state.mixAB * 2);
  gainB.gain.value = Math.max(0, (state.mixAB - 0.5) * 2);
  
  const processor = AC.createScriptProcessor(256, 2, 1);
  const outputBuffer = AC.createBuffer(1, Math.ceil(loopDur * AC.sampleRate), AC.sampleRate);
  const outData = outputBuffer.getChannelData(0);
  let outIdx = 0;
  
  let reverbTail = new Float32Array(8192);
  let reverbIdx = 0;
  
  processor.onaudioprocess = e => {
    const inL = e.inputBuffer.getChannelData(0);
    const inR = e.inputBuffer.numberOfChannels > 1 ? e.inputBuffer.getChannelData(1) : inL;
    const out = e.outputBuffer.getChannelData(0);
    
    for (let i = 0; i < inL.length && outIdx < outData.length; i++) {
      let sample = (inL[i] + inR[i]) * 0.5;
      
      // Push to frame processor
      frameProcessorOut.pushSample(sample);
      
      // Pull output
      const hopOutput = frameProcessorOut.pullOutput();
      for (let j = 0; j < hopOutput.length && outIdx < outData.length; j++) {
        let processed = hopOutput[j];
        
        // Reverb
        const wetSignal = reverbTail[reverbIdx % reverbTail.length] || 0;
        reverbTail[reverbIdx % reverbTail.length] = processed * 0.6;
        reverbIdx++;
        
        processed = processed * (1 - state.reverb) + wetSignal * state.reverb;
        processed = processed * (1 - state.dryWet) + processed * state.dryWet;
        processed *= (0.5 + state.intensity * 0.5);
        
        outData[outIdx++] = processed;
      }
    }
  };
  
  srcA.connect(gainA);
  srcB.connect(gainB);
  gainA.connect(processor);
  gainB.connect(processor);
  processor.connect(AC.destination);
  
  srcA.start(0);
  srcB.start(0);
  
  await new Promise(r => setTimeout(r, Math.ceil(loopDur * 1000) + 200));
  
  srcA.stop();
  srcB.stop();
  processor.disconnect();
  
  btn.classList.remove('disabled');
  btn.textContent = '⏺ REC OUT';
  
  const take = {
    id: 'take_' + Date.now(),
    buffer: outputBuffer,
    matter: state.matter,
    duration: loopDur,
    automation: [...automationEvents],
    gesture: [...gestureEvents],
  };
  
  const list = document.getElementById('libList');
  if (list.firstChild.textContent.includes('no takes')) list.innerHTML = '';
  
  const item = document.createElement('div');
  item.className = 'lib-item';
  item.innerHTML = `<div class="lib-info">${take.matter}</div><button class="lib-btn" data-id="${take.id}">WAV</button>`;
  list.appendChild(item);
  
  if (!window.voxTakes) window.voxTakes = {};
  window.voxTakes[take.id] = take;
  
  item.querySelector('button').addEventListener('click', () => exportWAV(take));
  
  setStatus('recorded', false);
});

function exportWAV(take) {
  const buf = take.buffer;
  const len = buf.length;
  const sampleRate = buf.sampleRate;
  const channels = buf.numberOfChannels;
  
  const channelData = [];
  for (let i = 0; i < channels; i++) channelData.push(buf.getChannelData(i));
  
  const bytesPerSample = 2;
  const blockAlign = channels * bytesPerSample;
  const byteRate = sampleRate * blockAlign;
  const dataSize = len * blockAlign;
  
  const arrayBuffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(arrayBuffer);
  
  const writeString = (offset, string) => {
    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
  };
  
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);
  
  let offset = 44;
  for (let i = 0; i < len; i++) {
    for (let ch = 0; ch < channels; ch++) {
      const s = Math.max(-1, Math.min(1, channelData[ch][i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      offset += 2;
    }
  }
  
  const blob = new Blob([arrayBuffer], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `VoxDust_${take.matter}_${take.id.slice(-4)}.wav`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// CANVAS
function drawAnalyser() {
  const canvas = document.getElementById('analyser');
  if (!canvas || !analyser) {
    requestAnimationFrame(drawAnalyser);
    return;
  }
  
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  
  ctx.fillStyle = 'rgba(19,17,31,1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(dataArray);
  
  ctx.strokeStyle = '#9944ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const sliceWidth = canvas.width / dataArray.length;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = dataArray[i] / 256;
    const y = canvas.height - (v * canvas.height);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.stroke();
  
  requestAnimationFrame(drawAnalyser);
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isError ? ' error' : ' active');
}

async function init() {
  buildMatterGrid();
  await initAC();
  drawAnalyser();
}

init();
