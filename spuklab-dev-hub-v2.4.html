<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SPUKLAB DEV HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0b18;
  --bg2: #13111f;
  --bg3: #1b1726;
  --cyan: #00ffff;
  --magenta: #ff00ff;
  --violet: #9944ff;
  --violet-dim: rgba(153,68,255,.18);
  --border: rgba(153,68,255,.22);
  --text: #e8e4f0;
  --text-dim: rgba(232,228,240,.5);
  --green: #00ff88;
  --red: #ff4466;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  -webkit-user-select: none;
  user-select: none;
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  height: 56px;
  background: linear-gradient(90deg, #0d0b18 0%, #13111f 100%);
  border-bottom: 2px solid var(--border);
  flex-shrink: 0;
  z-index: 100;
}

.logo { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; }
.logo span:last-child { color: var(--cyan); font-weight: 300; font-size: 8px; letter-spacing: .2em; }

.topbar-right { display: flex; gap: 8px; align-items: center; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.status-dot.ok { background: var(--green); }

.btn-icon {
  background: var(--violet-dim);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  min-height: 40px;
  -webkit-tap-highlight-color: transparent;
}

#workspace {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  margin-bottom: 60px;
}

#workspace-header {
  padding: 12px 14px;
  background: var(--bg2);
  border-bottom: 2px solid var(--border);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.workspace-title { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; color: var(--cyan); text-transform: uppercase; }

.ai-selector { display: flex; gap: 4px; flex-wrap: wrap; }
.ai-badge {
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--violet-dim);
  color: var(--text-dim);
  font-weight: 600;
  min-height: 32px;
  display: flex;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
}
.ai-badge.active { background: rgba(0,255,255,.12); border-color: var(--cyan); color: var(--cyan); }

#workspace-content {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px;
}

.workspace-section { display: none; flex: 1; overflow: hidden; flex-direction: column; gap: 8px; }
.workspace-section.active { display: flex; }

.section-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  background: linear-gradient(155deg, var(--bg2), var(--bg3));
  overflow: hidden;
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--violet);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

input, textarea, select {
  background: rgba(0,0,0,.5);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 14px;
  padding: 10px;
  width: 100%;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  min-height: 44px;
}
input:focus, textarea:focus { border-color: var(--cyan); }

textarea { resize: vertical; line-height: 1.6; min-height: 100px; }

label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: 600; }

.btn {
  background: var(--violet-dim);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 10px 16px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  -webkit-tap-highlight-color: transparent;
  min-height: 44px;
  min-width: 44px;
}
.btn:active { background: rgba(153,68,255,.3); }
.btn.btn-cyan { background: rgba(0,255,255,.1); color: var(--cyan); }
.btn.btn-cyan:active { background: rgba(0,255,255,.2); }
.btn.btn-green { background: rgba(0,255,136,.1); color: var(--green); }
.btn.btn-magenta { background: rgba(255,0,255,.1); color: var(--magenta); }

.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

#ai-messages {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 0;
}

.msg {
  border-radius: 6px;
  padding: 10px;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 95%;
}
.msg.user { background: rgba(153,68,255,.12); border: 1px solid var(--border); align-self: flex-end; }
.msg.assistant { background: rgba(0,255,255,.05); border: 1px solid rgba(0,255,255,.12); align-self: flex-start; }
.msg.system { background: rgba(255,204,0,.06); color: #ffcc00; font-size: 11px; text-align: center; max-width: 100%; }

textarea#code-editor, textarea#output-display {
  background: rgba(0,0,0,.6);
  font-size: 12px;
  min-height: 120px;
  max-height: 250px;
}

#sidebar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(180deg, var(--bg2) 0%, var(--bg3) 100%);
  border-top: 2px solid var(--border);
  display: flex;
  height: 60px;
  z-index: 99;
  justify-content: space-around;
}

.sidebar-item {
  padding: 8px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 10px;
  text-transform: uppercase;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-top: 3px solid transparent;
  -webkit-tap-highlight-color: transparent;
  font-weight: 600;
}
.sidebar-item.active { color: var(--cyan); border-top-color: var(--cyan); background: rgba(0,255,255,.04); }

#toast {
  position: fixed;
  bottom: 80px;
  left: 14px;
  right: 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-size: 12px;
  z-index: 9998;
  transform: translateY(120px);
  transition: transform .3s;
  pointer-events: none;
  font-weight: 600;
}
#toast.show { transform: translateY(0); }
#toast.ok { border-color: rgba(0,255,136,.4); color: var(--green); }
#toast.err { border-color: rgba(255,68,102,.4); color: var(--red); }

#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 500;
  align-items: flex-end;
  justify-content: center;
}
#modal-overlay.open { display: flex; }

#modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 30px;
  width: 100%;
  max-height: 85dvh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#modal-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--cyan); text-transform: uppercase; }

.modal-close { position: absolute; top: 12px; right: 12px; background: var(--violet-dim); border: 1px solid var(--border); color: var(--text); border-radius: 6px; width: 40px; height: 40px; cursor: pointer; font-size: 16px; -webkit-tap-highlight-color: transparent; }

.empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 12px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.loading { display: inline-flex; gap: 4px; }
.loading span { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); animation: pulse 1s infinite; }
.loading span:nth-child(2) { animation-delay: .2s; background: var(--violet); }
.loading span:nth-child(3) { animation-delay: .4s; background: var(--magenta); }
@keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">SPUK<span>LAB</span> v2.4</div>
  <div class="topbar-right">
    <div class="status-dot" id="status"></div>
    <button class="btn-icon" onclick="openSettings()">⚙</button>
  </div>
</div>

<div id="workspace">
  <div id="workspace-header">
    <div class="workspace-title">Main</div>
    <div class="ai-selector">
      <div class="ai-badge active" data-ai="claude" onclick="selectAI('claude')">Claude</div>
      <div class="ai-badge" data-ai="gpt" onclick="selectAI('gpt')">GPT</div>
      <div class="ai-badge" data-ai="gemini" onclick="selectAI('gemini')">Gemini</div>
    </div>
  </div>

  <div id="workspace-content">
    <div class="workspace-section active" id="section-main">
      <div class="section-box">
        <div class="section-title">Prompt</div>
        <textarea id="prompt-input" placeholder="Paste your system prompt or brief..."></textarea>
        <button class="btn btn-cyan" onclick="loadPrompt()" style="width:100%">LOAD</button>
      </div>

      <div class="section-box" style="flex:1">
        <div class="section-title">Chat</div>
        <div id="ai-messages"></div>
        <div style="display:flex;gap:6px">
          <textarea id="ai-input" placeholder="Type your message..." style="flex:1;height:50px;resize:vertical"></textarea>
          <button class="btn btn-cyan" onclick="sendToAI()" style="width:44px;padding:0">→</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">Code</div>
        <textarea id="code-editor" placeholder="Paste code here..."></textarea>
        <div class="btn-group">
          <button class="btn btn-green" onclick="sendCode()">ANALYZE</button>
          <button class="btn btn-cyan" onclick="copyLast()">COPY</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">Output</div>
        <textarea id="output-display" readonly placeholder="AI responses appear here..."></textarea>
        <div class="btn-group">
          <button class="btn btn-cyan" onclick="copyOutput()">COPY</button>
          <button class="btn btn-magenta" onclick="toGitHub()">→ GH</button>
        </div>
      </div>
    </div>

    <div class="workspace-section" id="section-github">
      <div class="section-box">
        <div class="section-title">GitHub</div>
        <button class="btn btn-cyan" onclick="loadRepos()" style="width:100%;margin-bottom:8px">LOAD REPOS</button>
        <div id="gh-list" style="flex:1;overflow-y:auto">
          <div class="empty">Add GitHub token in settings</div>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">Push</div>
        <label>Repo</label>
        <input id="gh-repo" placeholder="owner/repo">
        <label>File Path</label>
        <input id="gh-path" placeholder="src/index.js">
        <label>Commit Message</label>
        <input id="gh-msg" value="Update via Spuklab">
        <button class="btn btn-green" onclick="ghPush()" style="width:100%;margin-top:8px">PUSH</button>
      </div>
    </div>

    <div class="workspace-section" id="section-history">
      <div class="section-box" style="flex:1">
        <div class="section-title">History</div>
        <div id="history-list" style="overflow-y:auto">
          <div class="empty">No history yet</div>
        </div>
      </div>

      <div class="section-box">
        <button class="btn btn-magenta" onclick="clearHistory()" style="width:100%">CLEAR</button>
      </div>
    </div>
  </div>
</div>

<div id="sidebar">
  <div class="sidebar-item active" onclick="switchSection('main')" data-section="main">💬 Main</div>
  <div class="sidebar-item" onclick="switchSection('github')" data-section="github">🔗 GitHub</div>
  <div class="sidebar-item" onclick="switchSection('history')" data-section="history">⏱ History</div>
  <div class="sidebar-item" onclick="selectRole()" data-section="roles">👤 Role</div>
</div>

<div id="modal-overlay">
  <div id="modal" style="position:relative">
    <div style="position:absolute;top:10px;right:10px;width:30px;height:30px;cursor:pointer;font-size:18px" onclick="closeSettings()">✕</div>
    <div id="modal-title" style="margin-top:8px">API Keys</div>
    <div style="height:1px;background:var(--border);margin:8px 0"></div>

    <label>GitHub Token</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxx">

    <label>Claude API Key</label>
    <input type="password" id="claude-key" placeholder="sk-ant-xxxx">

    <label>OpenAI API Key</label>
    <input type="password" id="openai-key" placeholder="sk-proj-xxxx">

    <button class="btn btn-green" onclick="saveKeys()" style="width:100%">SAVE</button>
    <button class="btn btn-red" onclick="clearKeys()" style="width:100%">CLEAR ALL</button>
  </div>
</div>

<div id="toast"></div>

<script>
const STATE = {
  ai: 'claude',
  role: 'architect',
  keys: { github: '', claude: '', openai: '' },
  history: [],
  aiHistory: [],
  prompt: '',
  section: 'main',
};

const ROLES = {
  architect: 'You are a senior architect. Design clear structures.',
  coder: 'You are an expert coder. Write clean, efficient code.',
  designer: 'You are a creative designer. Think outside the box.',
};

(function init() {
  loadKeys();
  loadHistory();
  updateStatus();
})();

function loadKeys() {
  STATE.keys.github = localStorage.getItem('spuk_gh') || '';
  STATE.keys.claude = localStorage.getItem('spuk_claude') || '';
  STATE.keys.openai = localStorage.getItem('spuk_openai') || '';
}

function updateStatus() {
  const ok = Object.values(STATE.keys).some(k => k);
  document.getElementById('status').className = 'status-dot ' + (ok ? 'ok' : '');
}

function switchSection(s) {
  STATE.section = s;
  document.querySelectorAll('.workspace-section').forEach(el => el.classList.remove('active'));
  document.getElementById('section-' + s).classList.add('active');
  document.querySelectorAll('[data-section]').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-section="${s}"]`)?.classList.add('active');
}

function selectAI(ai) {
  STATE.ai = ai;
  document.querySelectorAll('[data-ai]').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-ai="${ai}"]`)?.classList.add('active');
  toast('AI: ' + ai, 'info');
}

function selectRole() {
  const roles = Object.keys(ROLES);
  let idx = roles.indexOf(STATE.role);
  idx = (idx + 1) % roles.length;
  STATE.role = roles[idx];
  toast('Role: ' + STATE.role, 'info');
}

function loadPrompt() {
  STATE.prompt = document.getElementById('prompt-input').value.trim();
  if (!STATE.prompt) { toast('Paste a prompt', 'err'); return; }
  addMsg('system', 'Loaded: ' + STATE.prompt.slice(0, 50) + '...');
  toast('Ready', 'ok');
}

async function sendToAI() {
  const input = document.getElementById('ai-input').value.trim();
  if (!input) return;

  const key = STATE.keys[STATE.ai === 'claude' ? 'claude' : 'openai'];
  if (!key) { toast('Add ' + STATE.ai + ' key', 'err'); return; }

  addMsg('user', input);
  STATE.aiHistory.push({ role: 'user', content: input });
  document.getElementById('ai-input').value = '';

  const loader = addMsg('assistant', null, true);

  try {
    let resp;
    const sys = ROLES[STATE.role] + (STATE.prompt ? '\n\nContext: ' + STATE.prompt : '');

    if (STATE.ai === 'claude') {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 2000,
          system: sys,
          messages: STATE.aiHistory.slice(-5).concat([{ role: 'user', content: input }])
        })
      });
      const data = await r.json();
      if (data.error) throw new Error(data.error.message);
      resp = data.content[0].text;
    } else {
      const r = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'gpt-4-turbo',
          max_tokens: 2000,
          system: sys,
          messages: STATE.aiHistory.slice(-5).concat([{ role: 'user', content: input }])
        })
      });
      const data = await r.json();
      if (data.error) throw new Error(data.error.message);
      resp = data.choices[0].message.content;
    }

    loader.remove();
    addMsg('assistant', resp);
    STATE.aiHistory.push({ role: 'assistant', content: resp });
    document.getElementById('output-display').value = resp;
    saveHistory(input, resp);
  } catch(e) {
    loader.remove();
    addMsg('assistant', 'Error: ' + e.message);
    toast(e.message, 'err');
  }
}

function sendCode() {
  const code = document.getElementById('code-editor').value.trim();
  if (!code) { toast('Paste code', 'err'); return; }
  document.getElementById('ai-input').value = 'Review (' + STATE.role + '):\n\n' + code.slice(0, 300);
}

function copyLast() {
  const msgs = document.querySelectorAll('.msg.assistant');
  if (msgs.length === 0) { toast('No response', 'err'); return; }
  navigator.clipboard.writeText(msgs[msgs.length - 1].textContent).then(() => toast('Copied', 'ok'));
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('output-display').value).then(() => toast('Copied', 'ok'));
}

function toGitHub() {
  document.getElementById('code-editor').value = document.getElementById('output-display').value;
  switchSection('github');
  toast('Output → Code', 'ok');
}

async function loadRepos() {
  if (!STATE.keys.github) { toast('Add GitHub token', 'err'); return; }
  try {
    toast('Loading...', 'info');
    const r = await fetch('https://api.github.com/user/repos?per_page=20', {
      headers: { 'Authorization': 'Bearer ' + STATE.keys.github }
    });
    const repos = await r.json();
    const el = document.getElementById('gh-list');
    el.innerHTML = repos.map(r => `<div style="padding:8px;border-bottom:1px solid var(--border);cursor:pointer;font-size:11px" onclick="setRepo('${r.full_name}')">${r.name}</div>`).join('');
    toast('Loaded ' + repos.length, 'ok');
  } catch(e) { toast(e.message, 'err'); }
}

function setRepo(name) {
  document.getElementById('gh-repo').value = name;
  toast('Repo: ' + name.split('/')[1], 'ok');
}

async function ghPush() {
  const repo = document.getElementById('gh-repo').value.trim();
  const path = document.getElementById('gh-path').value.trim();
  const msg = document.getElementById('gh-msg').value.trim();
  const content = document.getElementById('code-editor').value;

  if (!repo || !path) { toast('Fill repo + path', 'err'); return; }

  try {
    toast('Pushing...', 'info');
    const getR = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      headers: { 'Authorization': 'Bearer ' + STATE.keys.github }
    });
    let sha = undefined;
    if (getR.ok) {
      const data = await getR.json();
      sha = data.sha;
    }

    const body = {
      message: msg,
      content: btoa(unescape(encodeURIComponent(content)))
    };
    if (sha) body.sha = sha;

    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + STATE.keys.github,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (r.ok) toast('Pushed!', 'ok');
    else throw new Error('Push failed');
  } catch(e) { toast(e.message, 'err'); }
}

function saveHistory(q, a) {
  STATE.history.unshift({ q: q.slice(0, 50), a: a.slice(0, 80), t: new Date().toLocaleTimeString() });
  localStorage.setItem('spuk_history', JSON.stringify(STATE.history.slice(0, 50)));
  renderHistory();
}

function loadHistory() {
  const s = localStorage.getItem('spuk_history');
  if (s) STATE.history = JSON.parse(s);
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!STATE.history.length) { el.innerHTML = '<div class="empty">No history</div>'; return; }
  el.innerHTML = STATE.history.map((h, i) => `
    <div style="padding:8px;border-bottom:1px solid var(--border);font-size:10px;cursor:pointer" onclick="restoreItem(${i})">
      <div style="font-weight:700;color:var(--cyan)">${h.t}</div>
      <div style="color:var(--text-dim);margin-top:2px">${h.q}</div>
    </div>
  `).join('');
}

function restoreItem(i) {
  const h = STATE.history[i];
  document.getElementById('ai-input').value = h.q;
  switchSection('main');
}

function clearHistory() {
  if (!confirm('Clear all?')) return;
  STATE.history = [];
  localStorage.removeItem('spuk_history');
  renderHistory();
  toast('Cleared', 'ok');
}

function openSettings() {
  document.getElementById('gh-token').value = STATE.keys.github;
  document.getElementById('claude-key').value = STATE.keys.claude;
  document.getElementById('openai-key').value = STATE.keys.openai;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveKeys() {
  STATE.keys.github = document.getElementById('gh-token').value.trim();
  STATE.keys.claude = document.getElementById('claude-key').value.trim();
  STATE.keys.openai = document.getElementById('openai-key').value.trim();

  localStorage.setItem('spuk_gh', STATE.keys.github);
  localStorage.setItem('spuk_claude', STATE.keys.claude);
  localStorage.setItem('spuk_openai', STATE.keys.openai);

  closeSettings();
  updateStatus();
  toast('Saved', 'ok');
}

function clearKeys() {
  if (!confirm('Clear all keys?')) return;
  STATE.keys = { github: '', claude: '', openai: '' };
  ['spuk_gh', 'spuk_claude', 'spuk_openai'].forEach(k => localStorage.removeItem(k));
  closeSettings();
  updateStatus();
  toast('Cleared', 'ok');
}

function addMsg(role, text, loading = false) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (loading) {
    el.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
  } else {
    el.textContent = text;
  }
  const container = document.getElementById('ai-messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
  return el;
}

let toastTimer;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type === 'err' ? 'err' : type === 'ok' ? 'ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
