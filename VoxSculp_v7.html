<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VoxSculp v7 — Spectral Reconstruction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&family=JetBrains+Mono:ital,wght@1,300;1,400;1,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(155deg, #13111f, #1b1726);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 12px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            --mag: #ff00ff;
            --cyan: #00ffff;
            --bg: #13111f;
        }
        
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        
        .logo {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .wordmark {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .wordmark .b { color: #fff; }
        .wordmark .s { color: rgba(153, 68, 255, 0.6); font-weight: 300; }
        
        header small {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
        }
        
        .hc {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        #gcnt {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }
        
        .dot.on {
            background: var(--cyan);
            box-shadow: 0 0 6px var(--cyan);
        }
        
        .dot.rec {
            background: #ff4444;
            box-shadow: 0 0 6px #ff4444;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        #cw {
            flex: 1;
            position: relative;
            background: rgba(153, 68, 255, 0.03);
            border: 1px solid rgba(153, 68, 255, 0.18);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #viz {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #ov {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(19, 17, 31, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 1;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }
        
        #ov.gone {
            opacity: 0;
            pointer-events: none;
        }
        
        .ov-i {
            font-size: 24px;
            color: rgba(153, 68, 255, 0.5);
        }
        
        .ov-t {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.6;
        }
        
        #hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.2);
            font-style: italic;
        }
        
        #hint.gone {
            display: none;
        }
        
        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: 800;
            color: rgba(255, 100, 100, 0.8);
            opacity: 0;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
        }
        
        #countdown.show {
            animation: countdown 1s ease-out;
        }
        
        @keyframes countdown {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        }
        
        #ctrl {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 6px;
        }
        
        .btn-row {
            display: flex;
            gap: 6px;
        }
        
        .btn {
            padding: 10px 12px;
            background: rgba(153, 68, 255, 0.12);
            border: 1px solid rgba(153, 68, 255, 0.3);
            color: #fff;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            -webkit-appearance: none;
        }
        
        .btn:active, .btn.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            color: var(--cyan);
        }
        
        .btn.rec {
            background: rgba(255, 100, 100, 0.2);
            border-color: rgba(255, 100, 100, 0.6);
            color: #ff6464;
        }
        
        .btn.rec::before {
            content: '●';
            margin-right: 4px;
            animation: pulse 1s infinite;
        }
        
        .wide {
            flex: 1;
        }
        
        #mic-vu {
            display: none;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
        }
        
        #mic-vu span {
            width: 3px;
            height: 2px;
            background: var(--cyan);
            border-radius: 1px;
        }
        
        #mic-vu.active span {
            display: block;
        }
        
        #rec-time {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--mag);
            font-family: 'JetBrains Mono', monospace;
            font-style: italic;
        }
        
        /* Library bottom sheet */
        #lib-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }
        
        #lib-overlay.open {
            opacity: 1;
            pointer-events: all;
        }
        
        #lib-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 80vh;
            background: linear-gradient(180deg, #1b1726, #13111f);
            border: 1px solid rgba(153, 68, 255, 0.18);
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            z-index: 101;
        }
        
        #lib-sheet.open {
            transform: translateY(0);
        }
        
        .sheet-handle {
            width: 32px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 8px auto;
        }
        
        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(153, 68, 255, 0.12);
        }
        
        .sheet-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        
        .sheet-count {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .sheet-close {
            width: 24px;
            height: 24px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 14px;
        }
        
        #takes-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .take-item {
            padding: 12px;
            background: rgba(153, 68, 255, 0.08);
            border: 1px solid rgba(153, 68, 255, 0.18);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .take-item:active {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.6);
        }
        
        .take-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .take-name {
            font-size: 11px;
            font-weight: 600;
            color: #fff;
        }
        
        .take-time {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .take-actions {
            display: flex;
            gap: 4px;
        }
        
        .take-btn {
            width: 24px;
            height: 24px;
            background: rgba(153, 68, 255, 0.2);
            border: 1px solid rgba(153, 68, 255, 0.3);
            color: rgba(153, 68, 255, 0.8);
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .take-btn:active {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.6);
            color: var(--cyan);
        }
        
        #file-in {
            display: none;
        }
        
        .sec-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 0 4px 0;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .sline {
            flex: 1;
            height: 1px;
            background: rgba(153, 68, 255, 0.1);
        }
        
        .sline.rev {
            opacity: 0.5;
        }
        
        .sl {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }
        
        .knob-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div id="app">
        <header id="hdr">
            <div class="logo">
                <div class="wordmark"><span class="b">VOX</span><span class="s">Sculp</span></div>
                <small>SPUKLAB · V7 · SPECTRAL</small>
            </div>
            <div class="hc">
                <span id="gcnt">0 g/s</span>
                <div class="dot" id="dot"></div>
            </div>
        </header>

        <div id="cw">
            <canvas id="viz"></canvas>
            <div id="ov"><div class="ov-i">◈</div><div class="ov-t">Load audio or use Mic<br>to begin</div></div>
            <div id="hint">touch · drag · transform</div>
            <div id="countdown"><span id="countdown-num">3</span></div>
        </div>

        <div id="ctrl">
            <div class="sec-label"><div class="sline rev"></div><span class="sl">Input</span><div class="sline"></div></div>
            <div class="btn-row">
                <button class="btn wide" id="load-btn">▶ Load Audio</button>
                <button class="btn" id="mic-btn" style="position:relative; flex:1;">
                    Mic
                    <div id="mic-vu"><span></span><span></span><span></span><span></span><span></span></div>
                </button>
            </div>
            
            <div class="sec-label"><div class="sline rev"></div><span class="sl">Recording</span><div class="sline"></div></div>
            <div class="btn-row">
                <button class="btn" id="rec-btn" style="flex:2; border-radius:20px; letter-spacing:3px;">○ REC</button>
                <div id="rec-time"></div>
                <button class="btn" id="lib-btn" style="flex:1;">Library</button>
            </div>
            
            <div class="sec-label"><div class="sline rev"></div><span class="sl">Mode</span><div class="sline"></div></div>
            <div class="btn-row">
                <button class="btn active" id="btnAbs" style="flex:1;">Abstract</button>
                <button class="btn" id="btnOrg" style="flex:1;">Organic</button>
                <button class="btn" id="btnTex" style="flex:1;">Textural</button>
                <button class="btn" id="btnInh" style="flex:1;">Inharmonic</button>
            </div>
            
            <div class="sec-label"><div class="sline rev"></div><span class="sl">Controls</span><div class="sline"></div></div>
            <div class="knob-row">
                <div style="text-align:center; flex:1;">
                    <input type="range" id="s1" min="0" max="100" value="50" style="width:80%;">
                    <div style="font-size:9px; color:rgba(255,255,255,0.5); margin-top:2px;">Mutation</div>
                </div>
                <div style="text-align:center; flex:1;">
                    <input type="range" id="s2" min="10" max="80" value="40" style="width:80%;">
                    <div style="font-size:9px; color:rgba(255,255,255,0.5); margin-top:2px;">Density</div>
                </div>
                <div style="text-align:center; flex:1;">
                    <input type="range" id="s3" min="0" max="100" value="50" style="width:80%;">
                    <div style="font-size:9px; color:rgba(255,255,255,0.5); margin-top:2px;">Texture</div>
                </div>
                <div style="text-align:center; flex:1;">
                    <input type="range" id="s4" min="0" max="100" value="50" style="width:80%;">
                    <div style="font-size:9px; color:rgba(255,255,255,0.5); margin-top:2px;">Space</div>
                </div>
            </div>
        </div>
    </div>

    <div id="lib-overlay"></div>
    <div id="lib-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <span class="sheet-title">LIBRARY</span>
            <span class="sheet-count" id="take-count">0 takes</span>
            <button class="sheet-close" id="lib-close">✕</button>
        </div>
        <div id="takes-list"></div>
    </div>

    <input type="file" id="file-in" accept=".mp3,.wav,.m4a,.aiff,.aif,.ogg,.flac,.caf,audio/*">

    <script>
        // ═════════════════════════════════════════════════════════════
        // VOXSCULP v7 — BinauralSpray Architecture
        // ═════════════════════════════════════════════════════════════

        let AC = null;
        let micStream = null;
        let srcNode = null;
        let procNode = null;
        let analyser = null;
        let canvas = null;
        let ctx = null;
        let running = false;
        let isPlaying = false;

        // Recording
        let recIsRunning = false;
        let recChunksL = [];
        let recChunksR = [];
        let recStartTime = 0;
        let recTimerID = null;
        let recSampleRate = 0;
        let playSource = null;

        // Library (IndexedDB)
        let db = null;
        let takes = [];
        let nextTakeID = 1;

        // State
        let mode = 'abstract';
        let mutation = 0.5;
        let density = 40;
        let texture = 0.5;
        let space = 0.5;

        // Spectral
        let spectral = { body: 0, form: 0, air: 0, noise: 0 };
        let behavior = { intensity: 0, tension: 0, aggression: 0, air: 0 };
        let prevSpectral = { body: 0, form: 0, air: 0, noise: 0 };

        // Grain
        let grainBuf = new Float32Array(16384);
        let grainPos = 0;
        let grainCount = 0;
        let grainCountReset = Date.now();
        let grainTimer = null;

        // Mic VU
        let micAnalyser = null;
        let micVuTimer = null;

        async function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('VoxSculp', 1);
                req.onupgradeneeded = () => {
                    const store = req.result.createObjectStore('takes', { keyPath: 'id' });
                    store.createIndex('timestamp', 'timestamp');
                };
                req.onsuccess = () => {
                    db = req.result;
                    loadTakesFromDB();
                    resolve();
                };
                req.onerror = reject;
            });
        }

        function loadTakesFromDB() {
            const tx = db.transaction('takes', 'readonly');
            const store = tx.objectStore('takes');
            const req = store.getAll();
            req.onsuccess = () => {
                takes = req.result.sort((a, b) => b.timestamp - a.timestamp);
                if (takes.length > 0) nextTakeID = Math.max(...takes.map(t => t.id)) + 1;
                renderTakes();
            };
        }

        function renderTakes() {
            const list = document.getElementById('takes-list');
            const count = document.getElementById('take-count');
            
            list.innerHTML = '';
            takes.forEach(take => {
                const item = document.createElement('div');
                item.className = 'take-item';
                const dur = (take.duration || 0).toFixed(1);
                item.innerHTML = `
                    <div class="take-info">
                        <div class="take-name">${take.name}</div>
                        <div class="take-time">${dur}s · ${new Date(take.timestamp).toLocaleTimeString()}</div>
                    </div>
                    <div class="take-actions">
                        <button class="take-btn" onclick="playTake(${take.id})">▶</button>
                        <button class="take-btn" onclick="deleteTake(${take.id})">✕</button>
                    </div>
                `;
                list.appendChild(item);
            });
            
            count.textContent = `${takes.length} take${takes.length !== 1 ? 's' : ''}`;
        }

        function playTake(id) {
            const take = takes.find(t => t.id === id);
            if (!take || !take.audioBuffer) return;
            
            if (playSource) playSource.stop();
            playSource = AC.createBufferSource();
            playSource.buffer = take.audioBuffer;
            playSource.connect(procNode);
            playSource.start(0);
            
            isPlaying = true;
            document.getElementById('dot').classList.add('on');
            
            playSource.onended = () => {
                isPlaying = false;
                document.getElementById('dot').classList.remove('on');
            };
            
            closeLib();
        }

        function deleteTake(id) {
            if (!confirm('Delete take?')) return;
            
            const tx = db.transaction('takes', 'readwrite');
            tx.objectStore('takes').delete(id);
            takes = takes.filter(t => t.id !== id);
            renderTakes();
        }

        function openLib() {
            document.getElementById('lib-sheet').classList.add('open');
            document.getElementById('lib-overlay').classList.add('open');
        }

        function closeLib() {
            document.getElementById('lib-sheet').classList.remove('open');
            document.getElementById('lib-overlay').classList.remove('open');
        }

        async function init() {
            try {
                await initDB();
                
                const AC_Class = window.AudioContext || window.webkitAudioContext;
                AC = new AC_Class();
                recSampleRate = AC.sampleRate;
                
                procNode = AC.createScriptProcessor(2048, 2, 2);
                procNode.onaudioprocess = onAudio;
                
                analyser = AC.createAnalyser();
                analyser.fftSize = 2048;
                
                canvas = document.getElementById('viz');
                ctx = canvas.getContext('2d');
                resizeCanvas();
                
                setupUI();
                animate();
                
                startGrainCounter();
                
            } catch (e) {
                console.error(e);
            }
        }

        function setupUI() {
            document.getElementById('load-btn').addEventListener('click', () => {
                AC.resume();
                document.getElementById('file-in').click();
            });
            
            document.getElementById('file-in').addEventListener('change', loadFile);
            document.getElementById('mic-btn').addEventListener('click', startMic);
            document.getElementById('rec-btn').addEventListener('click', toggleRec);
            document.getElementById('lib-btn').addEventListener('click', openLib);
            document.getElementById('lib-close').addEventListener('click', closeLib);
            document.getElementById('lib-overlay').addEventListener('click', closeLib);
            
            ['btnAbs', 'btnOrg', 'btnTex', 'btnInh'].forEach(id => {
                document.getElementById(id).addEventListener('click', (e) => {
                    document.querySelectorAll('#btnAbs, #btnOrg, #btnTex, #btnInh').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    mode = { btnAbs: 'abstract', btnOrg: 'organic', btnTex: 'textural', btnInh: 'inharmonic' }[id];
                });
            });
            
            ['s1', 's2', 's3', 's4'].forEach((id, i) => {
                document.getElementById(id).addEventListener('input', (e) => {
                    const val = parseInt(e.target.value) / 100;
                    if (i === 0) mutation = val;
                    else if (i === 1) density = parseInt(e.target.value);
                    else if (i === 2) texture = val;
                    else if (i === 3) space = val;
                });
            });
            
            window.addEventListener('resize', resizeCanvas);
        }

        async function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (evt) => {
                const buf = evt.target.result.slice(0);
                AC.decodeAudioData(buf, (audioBuf) => {
                    playAudioBuffer(audioBuf);
                    document.getElementById('ov').classList.add('gone');
                    document.getElementById('hint').classList.add('gone');
                }, console.error);
            };
            reader.readAsArrayBuffer(file);
        }

        function playAudioBuffer(audioBuf) {
            if (playSource) playSource.stop();
            playSource = AC.createBufferSource();
            playSource.buffer = audioBuf;
            playSource.connect(procNode);
            playSource.start(0);
            isPlaying = true;
            document.getElementById('dot').classList.add('on');
            playSource.onended = () => {
                isPlaying = false;
                document.getElementById('dot').classList.remove('on');
            };
        }

        async function startMic() {
            try {
                if (AC.state === 'suspended') await AC.resume();
                
                const silentBuf = AC.createBuffer(1, 1, AC.sampleRate);
                const silentSrc = AC.createBufferSource();
                silentSrc.buffer = silentBuf;
                silentSrc.connect(AC.destination);
                silentSrc.start();
                await new Promise(r => setTimeout(r, 80));
                
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                    video: false
                });
                
                srcNode = AC.createMediaStreamSource(micStream);
                srcNode.connect(procNode);
                procNode.connect(AC.destination);
                procNode.connect(analyser);
                
                // Setup mic VU
                micAnalyser = AC.createAnalyser();
                micAnalyser.fftSize = 256;
                srcNode.connect(micAnalyser);
                
                running = true;
                document.getElementById('ov').classList.add('gone');
                document.getElementById('hint').classList.add('gone');
                document.getElementById('mic-btn').textContent = '■ MIC';
                document.getElementById('dot').classList.add('on');
                
                startMicVu();
                
            } catch (e) {
                console.error(e);
            }
        }

        function startMicVu() {
            const bars = document.querySelectorAll('#mic-vu span');
            document.getElementById('mic-vu').classList.add('active');
            micVuTimer = setInterval(() => {
                if (!micAnalyser) return;
                const data = new Uint8Array(micAnalyser.frequencyBinCount);
                micAnalyser.getByteTimeDomainData(data);
                const rms = Math.sqrt(data.reduce((s, v) => s + (v / 128 - 1) ** 2, 0) / data.length);
                bars.forEach(b => {
                    const h = Math.max(2, Math.round(2 + rms * 80 * (0.5 + Math.random() * 0.8)));
                    b.style.height = h + 'px';
                });
            }, 80);
        }

        function stopMicVu() {
            clearInterval(micVuTimer);
            micVuTimer = null;
            document.getElementById('mic-vu').classList.remove('active');
            document.querySelectorAll('#mic-vu span').forEach(b => b.style.height = '2px');
        }

        function toggleRec() {
            if (!recIsRunning) {
                recChunksL = [];
                recChunksR = [];
                recIsRunning = true;
                recStartTime = Date.now();
                
                document.getElementById('rec-btn').textContent = '● REC';
                document.getElementById('rec-btn').classList.add('rec');
                document.getElementById('dot').classList.add('rec');
                
                updateRecTimer();
            } else {
                recIsRunning = false;
                document.getElementById('rec-btn').textContent = '○ REC';
                document.getElementById('rec-btn').classList.remove('rec');
                document.getElementById('rec-time').textContent = '';
                document.getElementById('dot').classList.remove('rec');
                clearTimeout(recTimerID);
                
                setTimeout(() => saveToLibrary(), 120);
            }
        }

        function updateRecTimer() {
            if (!recIsRunning) return;
            const s = Math.floor((Date.now() - recStartTime) / 1000);
            const m = String(Math.floor(s / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            document.getElementById('rec-time').textContent = `${m}:${ss}`;
            recTimerID = setTimeout(updateRecTimer, 500);
        }

        function saveToLibrary() {
            if (recChunksL.length === 0) return;
            
            const totalSamples = recChunksL.length * recChunksL[0].length;
            const audioBuf = AC.createBuffer(2, totalSamples, recSampleRate);
            
            const outL = audioBuf.getChannelData(0);
            const outR = audioBuf.getChannelData(1);
            
            let offset = 0;
            for (let i = 0; i < recChunksL.length; i++) {
                outL.set(recChunksL[i], offset);
                outR.set(recChunksR[i], offset);
                offset += recChunksL[i].length;
            }
            
            const take = {
                id: nextTakeID++,
                name: `Take ${takes.length + 1}`,
                timestamp: Date.now(),
                duration: audioBuf.duration,
                audioBuffer: audioBuf
            };
            
            const tx = db.transaction('takes', 'readwrite');
            tx.objectStore('takes').add(take);
            takes.unshift(take);
            renderTakes();
        }

        function onAudio(e) {
            const inL = e.inputBuffer.getChannelData(0);
            const inR = e.inputBuffer.numberOfChannels > 1 ? e.inputBuffer.getChannelData(1) : inL;
            const outL = e.outputBuffer.getChannelData(0);
            const outR = e.outputBuffer.getChannelData(1);
            
            // Record
            if (recIsRunning) {
                recChunksL.push(new Float32Array(inL));
                recChunksR.push(new Float32Array(inR));
            }
            
            // Analyze
            const fft = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(fft);
            analyzeSpectral(fft);
            
            // Process
            const grainLen = Math.floor((density / 100) * (AC.sampleRate * 0.08));
            grainBuf.set(inL, grainPos);
            grainPos = (grainPos + inL.length) % grainBuf.length;
            
            for (let i = 0; i < inL.length; i++) {
                const dry = inL[i];
                const rPos = (grainPos + Math.random() * grainLen) % grainBuf.length | 0;
                let wet = grainBuf[rPos];
                
                if (mode === 'abstract') {
                    wet *= (1 + Math.sin(i * 0.05 + Math.random() * 2) * 0.4);
                    grainCount++;
                } else if (mode === 'organic') {
                    wet *= (1 + Math.sin(i * 0.02) * 0.2);
                } else if (mode === 'textural') {
                    wet = wet * 0.6 + (Math.random() - 0.5) * 0.4 * texture;
                } else if (mode === 'inharmonic') {
                    wet *= Math.cos(i * (0.03 + Math.random() * 0.02));
                }
                
                const mix = dry * (1 - mutation) + wet * mutation;
                outL[i] = mix * (1 - space * 0.3);
                outR[i] = mix * (1 + space * 0.2);
            }
        }

        function analyzeSpectral(fft) {
            const nyquist = AC.sampleRate / 2;
            const freqRes = nyquist / fft.length;
            
            let body = 0, form = 0, air = 0, noise = 0, total = 0;
            const bodyBins = Math.ceil(300 / freqRes);
            const formBins = Math.ceil(2500 / freqRes);
            const airBins = Math.ceil(8000 / freqRes);
            
            for (let i = 0; i < fft.length; i++) {
                const v = fft[i];
                total += v;
                if (i < bodyBins) body += v;
                else if (i < formBins) form += v;
                else if (i < airBins) air += v;
                else noise += v;
            }
            
            const norm = total > 0 ? total : 1;
            spectral = { body: body / norm, form: form / norm, air: air / norm, noise: noise / norm };
            
            const dBody = Math.abs(spectral.body - prevSpectral.body);
            const dForm = Math.abs(spectral.form - prevSpectral.form);
            const dAir = Math.abs(spectral.air - prevSpectral.air);
            
            behavior = {
                intensity: Math.min(1, (total / 255 / fft.length) * 2),
                tension: Math.min(1, (dBody + dForm + dAir) * 5),
                aggression: Math.min(1, (spectral.air + dAir) * 1.5),
                air: spectral.noise
            };
            
            prevSpectral = spectral;
        }

        function startGrainCounter() {
            grainTimer = setInterval(() => {
                const now = Date.now();
                if (now - grainCountReset > 1000) {
                    document.getElementById('gcnt').textContent = grainCount + ' g/s';
                    grainCount = 0;
                    grainCountReset = now;
                }
            }, 100);
        }

        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        function draw() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            
            ctx.fillStyle = 'rgba(19, 17, 31, 0.05)';
            ctx.fillRect(0, 0, w, h);
            
            const cx = w / 2;
            const cy = h / 2;
            const r = Math.min(w, h) * 0.3;
            
            // Rings
            ctx.strokeStyle = `rgba(153, 68, 255, ${behavior.intensity * 0.6})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, r * behavior.intensity, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.strokeStyle = `rgba(0, 255, 255, ${behavior.tension * 0.6})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.7 + behavior.tension * 10, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.strokeStyle = `rgba(255, 0, 255, ${behavior.aggression * 0.6})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.5 + behavior.aggression * 15, 0, Math.PI * 2);
            ctx.stroke();
            
            // Particles
            ctx.fillStyle = `rgba(100, 255, 200, ${behavior.air * 0.8})`;
            for (let i = 0; i < Math.floor(behavior.air * 50); i++) {
                const a = (i / 50) * Math.PI * 2 + Date.now() * 0.0005;
                const rad = r * 0.3 + Math.random() * 20;
                const x = cx + Math.cos(a) * rad;
                const y = cy + Math.sin(a) * rad;
                ctx.fillRect(x - 1, y - 1, 2, 2);
            }
            
            // Orb
            const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 15);
            g.addColorStop(0, `rgba(255, 255, 255, ${0.3 + behavior.intensity * 0.4})`);
            g.addColorStop(1, 'rgba(153, 68, 255, 0.1)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, 15 + behavior.tension * 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('load', init);
    </script>
</body>
