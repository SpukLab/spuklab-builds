<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoxDust</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg1:#13111f;--bg2:#1b1726;
  --border:rgba(153,68,255,.18);--glow:rgba(153,68,255,.08);
  --canvas-bg:rgba(153,68,255,.06);
  --cyan:#00ffff;--magenta:#ff00ff;--violet:#9944ff;--violetlt:#b580ff;
  --btn:rgba(153,68,255,.07);--active:rgba(153,68,255,.18);
  --white:rgba(255,255,255,.92);--dim:rgba(255,255,255,.38);
}
body{background:linear-gradient(155deg,var(--bg1),var(--bg2));min-height:100vh;color:var(--white);font-family:'Inter',sans-serif;font-size:13px;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px;gap:12px;overflow-x:hidden;}
.logo{font-family:'JetBrains Mono',monospace;font-style:italic;letter-spacing:.04em;}
.logo .spuk{font-weight:800;color:var(--white);font-size:22px;}
.logo .lab{font-weight:300;color:var(--cyan);font-size:22px;}
.logo .sub{font-size:10px;color:var(--dim);display:block;margin-top:2px;letter-spacing:.12em;}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:flex-start;}
.version{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);}
.canvas-wrap{width:100%;max-width:480px;background:var(--canvas-bg);border:1px solid var(--border);border-radius:12px;height:100px;position:relative;}
canvas#analyser{width:100%;height:100%;}
.slots{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.slot{background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;}
.slot-header{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:11px;color:var(--violetlt);letter-spacing:.08em;}
.slot-name{font-size:10px;color:var(--dim);min-height:14px;}
.slot-btn{width:100%;padding:8px;border:1px solid var(--border);background:var(--btn);border-radius:6px;color:var(--white);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;cursor:pointer;transition:all .15s;}
.slot-btn:active{background:var(--active);color:var(--cyan);}
.slot-btn.active{border-color:var(--violet);}
.slot-btn.recording{border-color:#ff3030;color:#ff3030;animation:rb .6s infinite;}
@keyframes rb{0%,100%{opacity:1;}50%{opacity:.3;}}
.matter-section{width:100%;max-width:480px;background:var(--btn);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.matter-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.08em;}
.matter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.matter-btn{padding:8px 0;border:1px solid var(--border);background:var(--btn);border-radius:6px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:8px;color:var(--dim);cursor:pointer;transition:all .15s;}
.matter-btn.active{background:var(--active);color:var(--cyan);border-color:var(--violet);}
.macro-row{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.macro-item{background:var(--btn);border:1px solid var(--border);border-radius:8px;padding:8px;}
.macro-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--violetlt);letter-spacing:.06em;margin-bottom:4px;}
.macro-val{font-size:10px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;margin-bottom:4px;}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.06);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;border:none;}
.knobs-row{width:100%;max-width:480px;display:flex;justify-content:space-around;align-items:flex-end;padding:4px 0;}
.knob-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.knob-label{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:9px;color:var(--dim);letter-spacing:.08em;}
.knob-val{font-size:9px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-style:italic;}
svg.knob{width:48px;height:48px;cursor:pointer;touch-action:none;}
.transport{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tbtn{padding:10px 0;border:1px solid var(--border);background:var(--btn);border-radius:8px;font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--white);cursor:pointer;text-align:center;transition:all .15s;letter-spacing:.04em;}
.tbtn:active{background:var(--active);color:var(--cyan);}
.tbtn.disabled{opacity:.35;pointer-events:none;}
.status{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:10px;color:var(--dim);text-align:center;min-height:14px;max-width:480px;}
.status.active{color:var(--cyan);}
.status.error{color:var(--magenta);}
input[type=file]{display:none;}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="spuk">SPUK</span><span class="lab">LAB</span><span class="sub">VoxDust · voice engine</span></div>
  <div class="version">v5.0</div>
</header>

<div class="canvas-wrap">
  <canvas id="analyser"></canvas>
</div>

<div class="slots">
  <div class="slot">
    <div class="slot-header">MIC A</div>
    <div class="slot-name" id="nameA">ready</div>
    <button class="slot-btn" id="recA">● REC</button>
  </div>
  <div class="slot">
    <div class="slot-header">MIC B</div>
    <div class="slot-name" id="nameB">ready</div>
    <button class="slot-btn" id="recB">● REC</button>
  </div>
</div>

<div class="matter-section">
  <div class="matter-label">STATE (AUTO)</div>
  <div class="matter-grid" id="matterGrid"></div>
</div>

<div class="macro-row">
  <div class="macro-item">
    <div class="macro-label">DRY/WET</div>
    <div class="macro-val" id="valDryWet">50</div>
    <input type="range" id="dryWetSlider" min="0" max="100" value="50">
  </div>
  <div class="macro-item">
    <div class="macro-label">INTENSITY</div>
    <div class="macro-val" id="valIntensity">50</div>
    <input type="range" id="intensitySlider" min="0" max="100" value="50">
  </div>
</div>

<div class="knobs-row" id="knobsRow"></div>

<div class="transport">
  <button class="tbtn disabled" id="btnRec">⏺ REC</button>
  <button class="tbtn" id="btnPlay">▶ PLAY</button>
</div>

<div class="status" id="status">rec slot A and B to start</div>

<script>
// ═══════════════════════════════════════════════════
// VOXDUST v5 — MIC RECORDING + SPECTRAL PROCESSING
// BinauralSpray architecture: permanent ScriptProcessor
// ═══════════════════════════════════════════════════

// AUDIO CONTEXT GLOBALS
var AC = null;
var analyser = null;
var micStream = null;
var micProcNode = null;
var micAnalyser = null;
var micChunksL = [];
var micChunksR = [];
var micRecording = false;
var micIsActive = false;

// STATE
var state = {
  ac: null,
  analyser: null,
  dryWet: 0.5,
  intensity: 0.5,
  matter: 'Ritual',
  params: { FORM: 0.5, SMEAR: 0.5, CROSS: 0.7 },
  bufA: null,
  bufB: null,
  isPlayingA: false,
  isPlayingB: false,
};

const STATES = {
  Susurro: { FORM: 0.2, SMEAR: 0.1, CROSS: 0.1, randomAmount: 0.2 },
  Eco: { FORM: 0.3, SMEAR: 0.9, CROSS: 0.6, randomAmount: 0.8 },
  Ritual: { FORM: 0.4, SMEAR: 0.6, CROSS: 0.7, randomAmount: 0.4 },
  Máquina: { FORM: 0.7, SMEAR: 0.2, CROSS: 0.9, randomAmount: 0.1 },
  Híbrido: { FORM: 0.5, SMEAR: 0.5, CROSS: 0.5, randomAmount: 0.3 },
  Colapso: { FORM: 0.9, SMEAR: 0.8, CROSS: 1.0, randomAmount: 1.0 },
};

const MATTER_LABELS = ['Susurro', 'Eco', 'Ritual', 'Máquina', 'Híbrido', 'Colapso'];

// SPECTRAL PROCESSING GLOBALS
const FFT_SIZE = 2048;
const BINS = 256;
let prevPhase = new Float32Array(BINS);
let prevOutPhase = new Float32Array(BINS);
let prevMag = new Float32Array(BINS);

function getAC() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
  }
  return AC;
}

function initAC() {
  if (AC && micProcNode) return;
  
  AC = getAC();
  
  // Create analyser for visualization
  analyser = AC.createAnalyser();
  analyser.fftSize = 256;
  
  // WARM-UP: silent buffer to activate context in Safari iOS
  const silentBuf = AC.createBuffer(1, 1, AC.sampleRate);
  const silentSrc = AC.createBufferSource();
  silentSrc.buffer = silentBuf;
  silentSrc.connect(AC.destination);
  silentSrc.start();
  
  setTimeout(() => {
    // Create permanent ScriptProcessor for mic recording
    micProcNode = AC.createScriptProcessor(4096, 2, 2);
    
    micProcNode.onaudioprocess = (e) => {
      if (!micRecording) return;
      
      const inL = e.inputBuffer.getChannelData(0);
      const inR = e.inputBuffer.numberOfChannels > 1 ? e.inputBuffer.getChannelData(1) : inL;
      
      micChunksL.push(new Float32Array(inL));
      micChunksR.push(new Float32Array(inR));
    };
    
    setStatus('mic initialized · ready to record');
  }, 100);
}

function buildMatterGrid() {
  const grid = document.getElementById('matterGrid');
  MATTER_LABELS.forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'matter-btn' + (label === 'Ritual' ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      state.matter = label;
      document.querySelectorAll('.matter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setStatus(`state: ${label.toLowerCase()}`);
    });
    grid.appendChild(btn);
  });
}

function buildKnobs() {
  const row = document.getElementById('knobsRow');
  ['FORM', 'SMEAR', 'CROSS'].forEach(k => {
    const wrap = document.createElement('div');
    wrap.className = 'knob-wrap';
    wrap.innerHTML = `
      <div class="knob-val" id="val_${k}">${Math.round(state.params[k] * 100)}</div>
      <svg class="knob" id="knob_${k}" viewBox="0 0 48 48">
        <defs><linearGradient id="kg_${k}"><stop offset="0%" stop-color="#00ffff"/><stop offset="50%" stop-color="#9944ff"/><stop offset="100%" stop-color="#ff00ff"/></linearGradient></defs>
        <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="3.5"/>
        <path id="arc_${k}" fill="none" stroke="url(#kg_${k})" stroke-width="3.5" stroke-linecap="round"/>
        <circle id="dot_${k}" r="2" fill="white"/>
      </svg>
      <div class="knob-label">${k}</div>
    `;
    row.appendChild(wrap);
    updateKnobArc(k);
    addKnobEvents(k);
  });
}

function updateKnobArc(id) {
  const v = state.params[id];
  const startAngle = -220 * Math.PI / 180;
  const endAngle = startAngle + v * 260 * Math.PI / 180;
  const cx = 24, cy = 24, r = 18;
  const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
  const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
  const large = (v * 260) > 180 ? 1 : 0;
  const path = document.getElementById('arc_' + id);
  if (path) {
    if (v > 0.005) path.setAttribute('d', `M${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2}`);
    else path.setAttribute('d', '');
    document.getElementById('dot_' + id).setAttribute('cx', cx + r * Math.cos(endAngle));
    document.getElementById('dot_' + id).setAttribute('cy', cy + r * Math.sin(endAngle));
    document.getElementById('val_' + id).textContent = Math.round(v * 100);
  }
}

function addKnobEvents(id) {
  const svg = document.getElementById('knob_' + id);
  let startY, startV;
  const onStart = e => {
    e.preventDefault();
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    startV = state.params[id];
    const onMove = e2 => {
      const y = e2.touches ? e2.touches[0].clientY : e2.clientY;
      const delta = (startY - y) / 140;
      state.params[id] = Math.max(0, Math.min(1, startV + delta));
      updateKnobArc(id);
    };
    const onEnd = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('mouseup', onEnd);
      window.removeEventListener('touchend', onEnd);
    };
    window.addEventListener('mousemove', onMove, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);
  };
  svg.addEventListener('mousedown', onStart);
  svg.addEventListener('touchstart', onStart, { passive: false });
}

document.getElementById('dryWetSlider').addEventListener('input', e => {
  state.dryWet = parseFloat(e.target.value) / 100;
  document.getElementById('valDryWet').textContent = e.target.value;
});

document.getElementById('intensitySlider').addEventListener('input', e => {
  state.intensity = parseFloat(e.target.value) / 100;
  document.getElementById('valIntensity').textContent = e.target.value;
});

async function startMicRecording(slot) {
  initAC();
  
  try {
    if (AC.state === 'suspended') await AC.resume();
  } catch (e) {}
  
  // Reset chunks
  micChunksL = [];
  micChunksR = [];
  micRecording = true;
  micIsActive = true;
  
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false },
      video: false
    });
    
    const micSrc = AC.createMediaStreamSource(micStream);
    micAnalyser = AC.createAnalyser();
    micAnalyser.fftSize = 256;
    
    micSrc.connect(micAnalyser);
    micSrc.connect(micProcNode);
    micProcNode.connect(AC.destination);
    
    document.getElementById('rec' + slot).classList.add('recording');
    document.getElementById('rec' + slot).textContent = '■ STOP';
    setStatus('recording ' + slot);
    
  } catch (err) {
    setStatus('error: ' + err.message, true);
    micRecording = false;
    micIsActive = false;
  }
}

function stopMicRecording(slot) {
  micRecording = false;
  
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  
  document.getElementById('rec' + slot).classList.remove('recording');
  document.getElementById('rec' + slot).textContent = '● REC';
  
  // Combine chunks into single buffer
  if (micChunksL.length === 0) {
    setStatus('no audio captured', true);
    return;
  }
  
  const totalSamples = micChunksL.reduce((sum, chunk) => sum + chunk.length, 0);
  const buffer = AC.createBuffer(2, totalSamples, AC.sampleRate);
  const bufL = buffer.getChannelData(0);
  const bufR = buffer.getChannelData(1);
  
  let offset = 0;
  micChunksL.forEach((chunk, i) => {
    bufL.set(chunk, offset);
    if (micChunksR[i]) bufR.set(micChunksR[i], offset);
    offset += chunk.length;
  });
  
  // Normalize to peak 0.9
  let peak = 0;
  for (let i = 0; i < totalSamples; i++) {
    peak = Math.max(peak, Math.abs(bufL[i]), Math.abs(bufR[i]));
  }
  if (peak > 0) {
    const scale = 0.9 / peak;
    for (let i = 0; i < totalSamples; i++) {
      bufL[i] *= scale;
      bufR[i] *= scale;
    }
  }
  
  if (slot === 'A') {
    state.bufA = buffer;
    document.getElementById('nameA').textContent = 'mic_A · ' + buffer.duration.toFixed(1) + 's';
    document.getElementById('recA').classList.add('active');
  } else {
    state.bufB = buffer;
    document.getElementById('nameB').textContent = 'mic_B · ' + buffer.duration.toFixed(1) + 's';
    document.getElementById('recB').classList.add('active');
  }
  
  setStatus(slot + ' captured · ' + buffer.duration.toFixed(2) + 's');
  micChunksL = [];
  micChunksR = [];
  checkReady();
}

document.getElementById('recA').addEventListener('click', () => {
  if (micRecording && micIsActive) {
    stopMicRecording('A');
  } else {
    startMicRecording('A');
  }
});

document.getElementById('recB').addEventListener('click', () => {
  if (micRecording && micIsActive) {
    stopMicRecording('B');
  } else {
    startMicRecording('B');
  }
});

function checkReady() {
  const ready = state.bufA && state.bufB;
  document.getElementById('btnRec').classList.toggle('disabled', !ready);
  if (ready) {
    setStatus('ready · tap REC to process');
  }
}

document.getElementById('btnRec').addEventListener('click', async () => {
  if (!state.bufA || !state.bufB) return;
  
  const btn = document.getElementById('btnRec');
  btn.classList.add('disabled');
  btn.textContent = 'PROCESSING…';
  
  const maxLen = Math.max(state.bufA.length, state.bufB.length);
  const recBuf = AC.createBuffer(1, maxLen * 2, AC.sampleRate);
  let recIdx = 0;
  
  const processor = AC.createScriptProcessor(2048, 1, 1);
  const srcA = AC.createBufferSource();
  const srcB = AC.createBufferSource();
  
  srcA.buffer = state.bufA;
  srcB.buffer = state.bufB;
  srcA.loop = true;
  srcB.loop = true;
  
  // === SPECTRAL PROCESSOR ===
  processor.onaudioprocess = e => {
    const input = e.inputBuffer.getChannelData(0);
    const output = e.outputBuffer.getChannelData(0);
    
    const stateDef = STATES[state.matter];
    const intensity = state.intensity;
    
    // Process in BINS-sized chunks
    for (let i = 0; i < input.length; i += BINS) {
      // === FAKE FFT (magnitude + phase domain) ===
      let mag = new Float32Array(BINS);
      let phase = new Float32Array(BINS);
      
      for (let k = 0; k < BINS; k++) {
        const sampleIdx = i + k;
        const sample = (sampleIdx < input.length) ? input[sampleIdx] : 0;
        mag[k] = Math.abs(sample);
        phase[k] = Math.atan2(sample, sample * 0.99 + 0.001);
      }
      
      // === SMEAR (spectral smoothing) ===
      for (let k = 0; k < BINS; k++) {
        prevMag[k] = prevMag[k] * 0.8 + mag[k] * 0.2;
        mag[k] = mag[k] * (1 - state.params.SMEAR) + prevMag[k] * state.params.SMEAR;
      }
      
      // === CROSS (spectral blending) ===
      for (let k = 0; k < BINS; k++) {
        mag[k] = mag[k] * (1 - state.params.CROSS) + mag[k] * state.params.CROSS;
      }
      
      // === PHASE LOCKING ===
      for (let k = 0; k < BINS; k++) {
        let delta = phase[k] - prevPhase[k];
        delta -= Math.round(delta / (2 * Math.PI)) * (2 * Math.PI);
        phase[k] = prevOutPhase[k] + delta;
        prevPhase[k] = phase[k];
        prevOutPhase[k] = phase[k];
      }
      
      // === PHASE RANDOMIZATION (state-based) ===
      const randAmt = stateDef.randomAmount * intensity;
      for (let k = 0; k < BINS; k++) {
        if (k > BINS * 0.3) {
          phase[k] += (Math.random() - 0.5) * randAmt * Math.PI;
        }
      }
      
      // === RECONSTRUCTION (sine synthesis) ===
      for (let k = 0; k < BINS; k++) {
        const idx = i + k;
        if (idx < output.length) {
          output[idx] = mag[k] * Math.cos(phase[k]) * 0.4;
        }
      }
    }
  };
  
  srcA.connect(processor);
  srcB.connect(processor);
  processor.connect(AC.destination);
  
  srcA.start(0);
  srcB.start(0);
  
  await new Promise(r => setTimeout(r, 3000));
  
  srcA.stop();
  srcB.stop();
  processor.disconnect();
  
  btn.classList.remove('disabled');
  btn.textContent = '⏺ REC';
  setStatus('processed · 3s output generated');
});

document.getElementById('btnPlay').addEventListener('click', () => {
  if (!state.bufA || !state.bufB) return;
  
  const ac = getAC();
  const srcA = ac.createBufferSource();
  const srcB = ac.createBufferSource();
  
  srcA.buffer = state.bufA;
  srcB.buffer = state.bufB;
  
  srcA.connect(ac.destination);
  srcB.connect(ac.destination);
  
  srcA.start(0);
  srcB.start(0);
  
  setStatus('playing A + B');
});

function drawAnalyser() {
  const canvas = document.getElementById('analyser');
  if (!canvas || !analyser) {
    requestAnimationFrame(drawAnalyser);
    return;
  }
  
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  
  ctx.fillStyle = 'rgba(19,17,31,1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(dataArray);
  
  ctx.strokeStyle = '#9944ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const sliceWidth = canvas.width / dataArray.length;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = dataArray[i] / 256;
    const y = canvas.height - (v * canvas.height);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.stroke();
  
  requestAnimationFrame(drawAnalyser);
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isError ? ' error' : ' active');
}

async function init() {
  initAC();
  buildMatterGrid();
  buildKnobs();
  drawAnalyser();
  setStatus('ready · tap REC on A or B');
}

init();
</script>
</body>
</html>
