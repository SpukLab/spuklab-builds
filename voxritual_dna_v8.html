<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>VOXRITUAL DNA v8</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#090714;color:#fff;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* HEADER */
#hdr{height:36px;display:flex;align-items:center;justify-content:space-between;
  padding:0 .85rem;background:rgba(9,7,20,.92);border-bottom:1px solid rgba(153,68,255,.1);flex-shrink:0}
.logo{font-size:.76rem;font-weight:800;letter-spacing:.08em}.logo span{color:#00ffff}
#semInfo{display:flex;align-items:center;gap:.38rem}
#semOrb{width:7px;height:7px;border-radius:50%;background:#ff00ff;box-shadow:0 0 5px #ff00ff;transition:background .4s,box-shadow .4s}
#semName{font-size:.64rem;color:rgba(255,255,255,.26);letter-spacing:.06em}
#acBadge{font-size:.6rem;color:rgba(255,255,255,.14);letter-spacing:.04em}

/* CATEGORY BAR */
#catBar{height:30px;display:flex;align-items:center;gap:.26rem;padding:0 .65rem;
  overflow-x:auto;flex-shrink:0;background:rgba(9,7,20,.65);border-bottom:1px solid rgba(153,68,255,.07);scrollbar-width:none}
#catBar::-webkit-scrollbar{display:none}
.cat{padding:.22rem .56rem;background:rgba(153,68,255,.05);border:1px solid rgba(153,68,255,.1);
  color:rgba(255,255,255,.35);font-size:.67rem;font-weight:700;letter-spacing:.05em;
  cursor:pointer;border-radius:2px;white-space:nowrap;flex-shrink:0;transition:all .1s}
.cat.on{background:rgba(153,68,255,.17);border-color:rgba(153,68,255,.35);color:#fff}

/* LIBRARY */
#library{flex:1;overflow-y:auto;min-height:50px;
  scrollbar-width:thin;scrollbar-color:rgba(153,68,255,.14) transparent}
#library::-webkit-scrollbar{width:2px}
#library::-webkit-scrollbar-thumb{background:rgba(153,68,255,.18)}
.sRow{display:flex;align-items:center;gap:.42rem;padding:.35rem .75rem;
  border-bottom:1px solid rgba(153,68,255,.05);cursor:pointer;position:relative;transition:background .1s}
.sRow:active{background:rgba(153,68,255,.07)}
.sRow.on{background:rgba(153,68,255,.09);border-left:2px solid rgba(153,68,255,.42)}
.sRow.fav{border-left:2px solid rgba(255,200,0,.35)}
.sWave{width:44px;height:18px;flex-shrink:0;border-radius:1px}
.sInfo{flex:1;min-width:0}
.sName{font-size:.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sTags{display:flex;gap:.2rem;margin-top:.11rem;flex-wrap:wrap}
.sTag{font-size:.59rem;padding:.06rem .26rem;border-radius:1px;background:rgba(153,68,255,.08);color:rgba(255,255,255,.38)}
.sTag.sem{background:rgba(0,255,255,.05);color:rgba(0,255,255,.48)}
.sTag.fav{background:rgba(255,200,0,.07);color:rgba(255,200,0,.55)}
.sTag.type{background:rgba(153,68,255,.12);color:rgba(200,160,255,.65)}
.sTag.norm{background:rgba(0,200,120,.06);color:rgba(0,200,120,.5)}
.sTag.intray{background:rgba(0,255,200,.08);border:1px solid rgba(0,255,200,.2);color:rgba(0,255,200,.6)}
.sRight{flex-shrink:0;text-align:right}
.sDur{font-size:.62rem;color:rgba(255,255,255,.22);font-family:'Courier New',monospace}
.sScr{font-size:.58rem;color:rgba(153,68,255,.5);margin-top:.07rem}
.sLive{position:absolute;left:0;top:0;bottom:0;width:2px;background:rgba(0,255,255,.8)}
.libEmpty{padding:1.5rem .85rem;text-align:center;color:rgba(255,255,255,.15);font-size:.72rem;line-height:2;letter-spacing:.04em}

/* CONTEXT MENU */
#ctxMenu{position:fixed;z-index:300;background:rgba(14,11,26,.97);border:1px solid rgba(153,68,255,.25);
  border-radius:3px;display:none;flex-direction:column;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,.6)}
.ctxBtn{padding:.42rem .72rem;border:none;background:transparent;color:rgba(255,255,255,.68);
  font-size:.72rem;font-weight:700;cursor:pointer;text-align:left;letter-spacing:.04em;
  border-bottom:1px solid rgba(153,68,255,.07)}
.ctxBtn:last-child{border-bottom:none}
.ctxBtn:active{background:rgba(153,68,255,.14)}
.ctxBtn.del{color:rgba(255,68,68,.6)}
.ctxBtn.fav{color:rgba(255,200,0,.65)}
.ctxBtn.tray{color:rgba(0,255,200,.65)}
#ctxOverlay{position:fixed;inset:0;z-index:299;display:none}

/* SURGERY PANEL */
#surgDiv{height:22px;display:flex;align-items:center;justify-content:space-between;
  padding:0 .75rem;background:rgba(9,7,20,.75);border-top:1px solid rgba(153,68,255,.08);
  border-bottom:1px solid rgba(153,68,255,.05);flex-shrink:0;cursor:pointer}
#surgDivL{font-size:.63rem;color:rgba(255,255,255,.26);letter-spacing:.07em}
#surgDivR{font-size:.63rem;color:rgba(153,68,255,.36)}
#surgPanel{height:0;overflow:hidden;transition:height .2s ease;flex-shrink:0;overflow-y:auto}
#surgPanel.open{height:220px}
#surgBody{padding:.45rem .75rem .3rem;display:flex;flex-direction:column;gap:.3rem}

/* Fragment identity strip */
#fragIdRow{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.fidBadge{font-size:.6rem;font-weight:700;letter-spacing:.05em;padding:.1rem .32rem;border-radius:1px;border:1px solid}
.fidBadge.type{border-color:rgba(153,68,255,.28);color:rgba(200,160,255,.7);background:rgba(153,68,255,.1)}
.fidBadge.sem{border-color:rgba(0,255,255,.2);color:rgba(0,255,255,.6);background:rgba(0,255,255,.06)}
.fidBadge.norm{border-color:rgba(0,200,120,.2);color:rgba(0,200,120,.65);background:rgba(0,200,120,.06)}
.fidBadge.prot{border-color:rgba(255,180,0,.2);color:rgba(255,180,0,.6);background:rgba(255,180,0,.06)}
#fidOrigin{font-size:.58rem;color:rgba(255,255,255,.18);font-family:'Courier New',monospace}

/* Surgery header */
#surgHdr{display:flex;align-items:center;justify-content:space-between}
#surgSrcName{font-size:.64rem;color:rgba(255,255,255,.3);letter-spacing:.06em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#surgZoomRow{display:flex;align-items:center;gap:.26rem;flex-shrink:0}
.zBtn{padding:.15rem .36rem;background:rgba(153,68,255,.07);border:1px solid rgba(153,68,255,.14);
  color:rgba(255,255,255,.46);font-size:.72rem;cursor:pointer;border-radius:2px}
.zBtn:active{background:rgba(153,68,255,.17);color:#fff}
#zLevel{font-size:.62rem;color:rgba(255,255,255,.24);font-family:'Courier New',monospace;min-width:2.2rem;text-align:center}
#lockRow{display:flex;gap:.22rem;align-items:center}
.lockBtn{padding:.15rem .4rem;background:rgba(153,68,255,.05);border:1px solid rgba(153,68,255,.11);
  color:rgba(255,255,255,.3);font-size:.63rem;font-weight:700;cursor:pointer;border-radius:2px}
.lockBtn.on{background:rgba(0,255,255,.09);border-color:rgba(0,255,255,.28);color:rgba(0,255,255,.78)}
#lockLabel{font-size:.58rem;color:rgba(255,255,255,.14);letter-spacing:.06em}

/* Surgery canvas */
#surgCanvas{width:100%;height:78px;display:block;border-radius:2px;cursor:crosshair;
  touch-action:none;background:rgba(153,68,255,.04)}

/* Norm strip */
#normStrip{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.normModeBtn{padding:.22rem .48rem;background:rgba(153,68,255,.06);border:1px solid rgba(153,68,255,.13);
  color:rgba(255,255,255,.4);font-size:.64rem;font-weight:700;letter-spacing:.04em;cursor:pointer;border-radius:2px;flex-shrink:0;transition:all .1s}
.normModeBtn.on{background:rgba(0,200,120,.1);border-color:rgba(0,200,120,.3);color:rgba(0,200,120,.85)}
.normModeBtn:active{background:rgba(153,68,255,.16)}
#normInfo{font-size:.6rem;color:rgba(255,255,255,.2);font-family:'Courier New',monospace;flex:1;overflow:hidden;white-space:nowrap}
#normApplyBtn{padding:.22rem .48rem;background:rgba(0,200,120,.07);border:1px solid rgba(0,200,120,.2);
  color:rgba(0,200,120,.65);font-size:.64rem;font-weight:700;cursor:pointer;border-radius:2px;flex-shrink:0}
.normLabel{font-size:.58rem;color:rgba(255,255,255,.18);letter-spacing:.07em;align-self:center}

/* Surgery tools */
#surgTools{display:flex;gap:.22rem;overflow-x:auto;scrollbar-width:none}
#surgTools::-webkit-scrollbar{display:none}
.sBtn{padding:.3rem .56rem;background:rgba(153,68,255,.06);border:1px solid rgba(153,68,255,.13);
  color:rgba(255,255,255,.52);font-size:.67rem;font-weight:700;letter-spacing:.04em;
  cursor:pointer;border-radius:2px;flex-shrink:0;white-space:nowrap;transition:all .1s}
.sBtn:active{background:rgba(153,68,255,.18);border-color:rgba(153,68,255,.4);color:#fff}
.sBtn.bounce{border-color:rgba(0,255,255,.18);color:rgba(0,255,255,.55)}
.sBtn.bounce:active{background:rgba(0,255,255,.1);color:#00ffff}
.sBtn.extract{border-color:rgba(0,255,200,.18);color:rgba(0,255,200,.58)}
.sBtn.extract:active{background:rgba(0,255,200,.1);color:#00ffc8}

/* Mutation strip */
#mutStrip{display:flex;gap:.22rem;overflow-x:auto;scrollbar-width:none}
#mutStrip::-webkit-scrollbar{display:none}
.mBtn{padding:.3rem .56rem;background:rgba(153,68,255,.06);border:1px solid rgba(153,68,255,.13);
  color:rgba(255,255,255,.52);font-size:.67rem;font-weight:700;cursor:pointer;border-radius:2px;flex-shrink:0;transition:all .1s}
.mBtn:active,.mBtn.on{background:rgba(153,68,255,.18);border-color:rgba(153,68,255,.42);color:#b580ff}
.mBtn.cm{border-color:rgba(0,255,255,.18);color:rgba(0,255,255,.55)}

/* Compact meta */
#surgMeta{display:flex;gap:.35rem;align-items:flex-start}
#snapRow{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;flex:1;align-items:center}
#snapRow::-webkit-scrollbar{display:none}
.sch{padding:.17rem .44rem;background:rgba(0,255,255,.04);border:1px solid rgba(0,255,255,.11);
  color:rgba(0,255,255,.5);font-size:.61rem;font-weight:700;cursor:pointer;border-radius:2px;flex-shrink:0}
.sch:active{background:rgba(0,255,255,.1)}
.sch.add{border-color:rgba(153,68,255,.15);color:rgba(153,68,255,.44)}
#histRow{display:flex;gap:.18rem;overflow-x:auto;scrollbar-width:none;flex:1;align-items:center}
#histRow::-webkit-scrollbar{display:none}
.hNode{padding:.17rem .4rem;background:rgba(153,68,255,.05);border:1px solid rgba(153,68,255,.11);
  color:rgba(255,255,255,.4);font-size:.6rem;font-weight:700;cursor:pointer;border-radius:2px;flex-shrink:0}
.hNode.on{background:rgba(153,68,255,.16);border-color:rgba(153,68,255,.35);color:#fff}
.hNode.root{border-color:rgba(0,255,255,.15);color:rgba(0,255,255,.48)}
.hArr{color:rgba(255,255,255,.12);font-size:.65rem;flex-shrink:0}

/* Recompose */
#rcToggle{font-size:.6rem;color:rgba(255,255,255,.17);letter-spacing:.07em;cursor:pointer;padding:.06rem 0}
#rcPanel{display:none;flex-direction:column;gap:.26rem}
#rcBlocks{display:flex;gap:.18rem;flex-wrap:wrap}
.rcb{padding:.2rem .45rem;background:rgba(153,68,255,.06);border:1px solid rgba(153,68,255,.14);
  color:rgba(255,255,255,.45);font-size:.6rem;cursor:pointer;border-radius:2px;font-weight:700}
.rcb.off{background:transparent;border-color:rgba(153,68,255,.05);color:rgba(255,255,255,.16);text-decoration:line-through}
.rcRender{padding:.26rem .58rem;background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.15);
  color:rgba(0,255,255,.58);font-size:.66rem;font-weight:700;cursor:pointer;border-radius:2px;align-self:flex-start}

/* ══════════════════════════════════════════════════════
   MONTAGE PANEL
══════════════════════════════════════════════════════ */
#montDiv{height:22px;display:flex;align-items:center;justify-content:space-between;
  padding:0 .75rem;background:rgba(9,7,20,.8);border-top:1px solid rgba(0,255,200,.08);
  border-bottom:1px solid rgba(0,255,200,.05);flex-shrink:0;cursor:pointer}
#montDivL{font-size:.63rem;color:rgba(0,255,200,.3);letter-spacing:.07em}
#montDivR{font-size:.63rem;color:rgba(0,255,200,.4)}
#montPanel{height:0;overflow:hidden;transition:height .2s ease;flex-shrink:0;overflow-y:auto}
#montPanel.open{height:196px}
#montBody{padding:.45rem .75rem .35rem;display:flex;flex-direction:column;gap:.3rem}

/* Montage controls */
#montCtrl{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.montBtn{padding:.28rem .56rem;background:rgba(0,255,200,.06);border:1px solid rgba(0,255,200,.15);
  color:rgba(0,255,200,.6);font-size:.66rem;font-weight:700;letter-spacing:.05em;
  cursor:pointer;border-radius:2px;flex-shrink:0;white-space:nowrap;transition:all .1s}
.montBtn:active{background:rgba(0,255,200,.16);color:#00ffc8}
.montBtn.on{background:rgba(0,255,200,.14);border-color:rgba(0,255,200,.4);color:#00ffc8}
.montBtn.play{border-color:rgba(0,255,255,.2);color:rgba(0,255,255,.65)}
.montBtn.play.on{background:rgba(0,255,255,.14);border-color:rgba(0,255,255,.45);color:#00ffff}
.montBtn.render{border-color:rgba(153,68,255,.2);color:rgba(153,68,255,.6)}
#montStatus{font-size:.64rem;color:rgba(255,255,255,.2);letter-spacing:.04em;flex:1}

/* Gap control */
#gapRow{display:flex;align-items:center;gap:.28rem}
.gapLabel{font-size:.6rem;color:rgba(255,255,255,.2);letter-spacing:.06em}
#gapVal{font-size:.65rem;color:rgba(255,255,255,.38);font-family:'Courier New',monospace;min-width:2.2rem}
.gapBtn{padding:.15rem .36rem;background:rgba(153,68,255,.06);border:1px solid rgba(153,68,255,.13);
  color:rgba(255,255,255,.45);font-size:.72rem;cursor:pointer;border-radius:2px}
.gapBtn:active{background:rgba(153,68,255,.17);color:#fff}
#driftToggle{padding:.18rem .42rem;background:rgba(153,68,255,.06);border:1px solid rgba(153,68,255,.14);
  color:rgba(255,255,255,.38);font-size:.63rem;font-weight:700;cursor:pointer;border-radius:2px}
#driftToggle.on{background:rgba(153,68,255,.16);border-color:rgba(153,68,255,.35);color:#b580ff}

/* Fragment Tray (chip row) */
#trayRow{display:flex;gap:.22rem;overflow-x:auto;scrollbar-width:none;min-height:28px;
  padding:.06rem .02rem;align-items:center}
#trayRow::-webkit-scrollbar{display:none}
.tChip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:44px;height:26px;border-radius:2px;cursor:pointer;flex-shrink:0;
  border:1px solid transparent;transition:all .1s;padding:0 .35rem}
.tChip:active{opacity:.7}
.tChip.on{box-shadow:0 0 0 1.5px rgba(0,255,255,.6)}
.tChipLabel{font-size:.58rem;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;max-width:52px;text-overflow:ellipsis}
.tChipSub{font-size:.52rem;color:rgba(255,255,255,.35);letter-spacing:.03em}
.tChipDel{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;
  background:rgba(255,60,60,.6);font-size:.58rem;color:#fff;display:none;align-items:center;
  justify-content:center;cursor:pointer;line-height:1}
.tChip:hover .tChipDel,.tChip:active .tChipDel{display:flex}
.trayEmpty{font-size:.67rem;color:rgba(255,255,255,.15);letter-spacing:.05em}

/* Montage Lane Canvas */
#montCanvas{width:100%;height:52px;display:block;border-radius:2px;
  cursor:pointer;touch-action:none;background:rgba(0,10,8,.3);
  border:1px solid rgba(0,255,200,.06)}

/* Montage snapshot strip */
#montSnapRow{display:flex;gap:.22rem;overflow-x:auto;scrollbar-width:none;align-items:center}
#montSnapRow::-webkit-scrollbar{display:none}
.msch{padding:.17rem .44rem;background:rgba(0,255,200,.04);border:1px solid rgba(0,255,200,.12);
  color:rgba(0,255,200,.5);font-size:.61rem;font-weight:700;cursor:pointer;border-radius:2px;flex-shrink:0}
.msch:active{background:rgba(0,255,200,.1)}
.msch.add{border-color:rgba(153,68,255,.15);color:rgba(153,68,255,.44)}
.noMSnap{font-size:.59rem;color:rgba(255,255,255,.14)}

/* TRANSPORT */
#transport{height:36px;display:flex;align-items:center;gap:.3rem;padding:0 .7rem;
  border-top:1px solid rgba(153,68,255,.08);background:rgba(9,7,20,.82);flex-shrink:0}
.tb{padding:.26rem .56rem;background:rgba(153,68,255,.07);border:1px solid rgba(153,68,255,.15);
  color:rgba(255,255,255,.5);font-size:.66rem;font-weight:700;cursor:pointer;border-radius:2px;transition:all .1s}
.tb:active,.tb.on{background:rgba(153,68,255,.18);border-color:rgba(153,68,255,.4);color:#fff}
#tlWrap{flex:1;position:relative;height:22px;cursor:pointer}
#tlCanvas{width:100%;height:22px;display:block;border-radius:1px;touch-action:none}
#tlPos{position:absolute;right:2px;top:50%;transform:translateY(-50%);
  font-size:.59rem;color:rgba(255,255,255,.2);font-family:'Courier New',monospace;pointer-events:none}

/* SEM BAR */
#semBar{height:16px;display:flex;align-items:center;gap:.38rem;padding:0 .75rem;
  background:rgba(9,7,20,.65);border-top:1px solid rgba(153,68,255,.06);flex-shrink:0}
#semDots{display:flex;gap:.14rem;flex-shrink:0}
.dot{width:4px;height:4px;border-radius:50%;background:rgba(153,68,255,.12)}
.dot.on{background:rgba(153,68,255,.68);box-shadow:0 0 3px rgba(153,68,255,.42)}
#specMini{flex:1;height:11px;overflow:hidden}
#specC{width:100%;height:11px;display:block}

/* ACTION BAR */
#actionBar{height:38px;display:flex;align-items:center;gap:.28rem;padding:0 .7rem;
  border-top:1px solid rgba(153,68,255,.09);background:rgba(9,7,20,.92);flex-shrink:0;
  overflow-x:auto;scrollbar-width:none}
#actionBar::-webkit-scrollbar{display:none}
.ab{padding:.28rem .58rem;border-radius:2px;font-size:.67rem;font-weight:700;letter-spacing:.05em;
  cursor:pointer;flex-shrink:0;white-space:nowrap;transition:all .1s}
.ab.cap{background:rgba(255,68,68,.06);border:1px solid rgba(255,68,68,.17);color:rgba(255,68,68,.62)}
.ab.cap.on{background:rgba(255,68,68,.15);border-color:rgba(255,68,68,.45);color:#ff4444}
.ab.neu{background:rgba(153,68,255,.06);border:1px solid rgba(153,68,255,.15);color:rgba(255,255,255,.5)}
.ab.neu:active{background:rgba(153,68,255,.16);color:#fff}
.ab.xp{background:rgba(0,255,255,.04);border:1px solid rgba(0,255,255,.14);color:rgba(0,255,255,.55)}
.ab.xp:active{background:rgba(0,255,255,.12);color:#00ffff}
.ab.warm{background:rgba(255,150,0,.04);border:1px solid rgba(255,150,0,.16);color:rgba(255,150,0,.55)}
.ab.warm.on{background:rgba(255,150,0,.13);border-color:rgba(255,150,0,.42);color:rgba(255,180,0,.88)}
#capTime{font-size:.65rem;color:rgba(255,68,68,.45);font-family:'Courier New',monospace;min-width:2rem}

#fInput{display:none}
</style>
</head>
<body>
<div id="app">
  <input type="file" id="fInput" accept=".wav,.mp3,.m4a,.aiff,.aif,.caf,audio/*">
  <div id="ctxOverlay"></div>
  <div id="ctxMenu">
    <button class="ctxBtn fav"  data-a="fav">FAVORITE</button>
    <button class="ctxBtn tray" data-a="tray">ADD TO TRAY</button>
    <button class="ctxBtn"      data-a="rename">RENAME</button>
    <button class="ctxBtn"      data-a="dupe">DUPLICATE</button>
    <button class="ctxBtn"      data-a="moveCat">MOVE CATEGORY</button>
    <button class="ctxBtn"      data-a="normNow">NORMALIZE NOW</button>
    <button class="ctxBtn del"  data-a="del">DELETE</button>
  </div>

  <div id="hdr">
    <div class="logo">SPUK<span>LAB</span> / VOXRITUAL DNA</div>
    <div id="semInfo">
      <div id="acBadge">ready</div>
      <div id="semOrb"></div>
      <div id="semName">fragile</div>
    </div>
  </div>

  <div id="catBar">
    <button class="cat on" data-c="all">ALL</button>
    <button class="cat" data-c="captures">CAPTURES</button>
    <button class="cat" data-c="favorites">FAVS</button>
    <button class="cat" data-c="spoken">SPOKEN</button>
    <button class="cat" data-c="whispers">WHISPERS</button>
    <button class="cat" data-c="breaths">BREATHS</button>
    <button class="cat" data-c="hooks">HOOKS</button>
    <button class="cat" data-c="fragments">FRAGMENTS</button>
    <button class="cat" data-c="corrupted">CORRUPTED</button>
    <button class="cat" data-c="textures">TEXTURES</button>
    <button class="cat" data-c="ritual">RITUAL</button>
  </div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════════
// VOXRITUAL DNA ENGINE v8 — SEMANTIC MONTAGE FOUNDATION
// ═══════════════════════════════════════════════════════════════════════════

// ─── MUTATION WEIGHTS ────────────────────────────────────────────────────
const WEIGHTS = {
  source:   {timing:0,   spectral:0,   distort:0,   instability:0,   drift:0   },
  dissolve: {timing:0.1, spectral:0.7, distort:0.05, instability:0.3, drift:0.5 },
  collapse: {timing:0.4, spectral:0.3, distort:0.25, instability:0.7, drift:0.2 },
  ritual:   {timing:0.6, spectral:0.2, distort:0,   instability:0.2, drift:0.4 },
  fever:    {timing:0.3, spectral:0.2, distort:0.15, instability:0.9, drift:0.7 }
};

// ─── STATE ────────────────────────────────────────────────────────────────
const A = {
  AC: null, analyser: null, freqData: null,
  db: null, samples: [], cat: 'all',
  selectedId: null, semState: 'fragile',
  snapshots: [], normMode: 'off',
  cap: { stream:null, recorder:null, chunks:[], timer:null, startMs:0, msrc:null }
};

const STATES  = ['fragile','collapse','ritual','ghost','fever'];
const SCOLORS = ['#ff00ff','#ff0055','#00ffff','#9944ff','#ff4488'];
const CATS    = ['captures','spoken','whispers','breaths','hooks','fragments','corrupted','textures','ritual'];

const TP = { state:'stopped', looping:false, startedAt:0, offsetSec:0, duration:0 };

// ─── EDITOR STATE ─────────────────────────────────────────────────────────
const ED = {
  zoom:1.0, viewStart:0.0, trimL:0.0, trimR:1.0,
  drag:null, dragStartX:0, dragStartVal:0,
  peaks:null, peaksFor:null, tlPeaks:null, tlPeaksFor:null,
  locks:{ breaths:false, consonants:false }
};

// ─── PRE-ROLL ─────────────────────────────────────────────────────────────
const WARM = { active:false, stream:null, recorder:null, chunks:[], msrc:null, max:32 };

// ═══════════════════════════════════════════════════════════════════════════
// ── MONTAGE ENGINE ─────────────────────────────────────────────────────────
// The fragmented cinematic vocal memory reconstruction system
// ═══════════════════════════════════════════════════════════════════════════
const MONTAGE = {
  slots: [],          // [{id, fragId, gap, semanticContinuity, emotionalWeight}]
  gap: 0.4,           // default gap between fragments in seconds
  drift: true,        // human desync: imperfect timing
  playing: false,
  activeSrcs: [],     // currently playing AudioBufferSourceNodes
  playStartTime: 0,   // AC.currentTime when montage started
  playingSlotIdx: -1, // currently playing slot
  snapshots: [],      // narrative memory states

  // Fragment color language — semantic readability
  fragColor(type) {
    const map = {
      breath:    [0, 220, 220],
      consonant: [255, 175, 0],
      texture:   [153, 68, 255],
      whisper:   [140, 180, 255],
      spoken:    [180, 180, 180],
      fragment:  [160, 150, 200],
      collapse:  [255, 65, 65]
    };
    return map[type] || [153, 68, 200];
  },

  totalDuration() {
    return this.slots.reduce((sum, s) => {
      const frag = A.samples.find(x => x.id === s.fragId);
      return sum + (frag ? frag.duration : 0) + s.gap;
    }, 0);
  },

  addFrag(sample, gap) {
    const g = gap !== undefined ? gap : this.gap;
    this.slots.push({
      id: uid(),
      fragId: sample.id,
      gap: g,
      semanticContinuity: sample.semState,
      emotionalWeight: Math.min(1, (sample.scores.fragility + sample.scores.ghost) / 200)
    });
    renderTray();
    drawMontageCanvas();
  },

  removeFrag(slotId) {
    this.slots = this.slots.filter(s => s.id !== slotId);
    renderTray();
    drawMontageCanvas();
  },

  clear() {
    this.stop();
    this.slots = [];
    renderTray();
    drawMontageCanvas();
    document.getElementById('montStatus').textContent = 'empty tray';
  },

  async play() {
    if (!A.AC || !this.slots.length) return;
    this.stop();
    this.playing = true;
    this.playStartTime = A.AC.currentTime + 0.08;
    this.activeSrcs = [];
    this.playingSlotIdx = 0;
    document.getElementById('montPlayBtn').classList.add('on');

    let time = this.playStartTime;

    for (let i = 0; i < this.slots.length; i++) {
      const slot = this.slots[i];
      const frag = A.samples.find(x => x.id === slot.fragId);
      if (!frag) continue;

      // Human desync: emotional hesitation drift
      let hesitation = 0;
      if (this.drift) {
        // Weighted drift: more for collapse/fever, less for ritual
        const driftW = WEIGHTS[slot.semanticContinuity]?.drift || 0.3;
        const instW  = WEIGHTS[slot.semanticContinuity]?.instability || 0.3;
        // Fragile fragments hesitate longer (emotional uncertainty)
        const fragH = frag.scores.fragility / 100;
        hesitation = (Math.random() - 0.4) * 0.15 * (driftW + fragH)
                   + (Math.random() - 0.5) * 0.06 * instW;
      }

      const src = A.AC.createBufferSource();
      src.buffer = toAB(frag);
      src.connect(A.analyser);
      A.analyser.connect(A.AC.destination);
      const startAt = time + slot.gap + Math.max(0, hesitation);
      src.start(Math.max(A.AC.currentTime, startAt));
      this.activeSrcs.push(src);
      time += frag.duration + slot.gap;

      // Track currently playing slot
      const idx = i;
      const idx_time = startAt;
      src.onended = () => {
        if (this.playing && this.playingSlotIdx === idx) {
          this.playingSlotIdx = Math.min(idx + 1, this.slots.length - 1);
        }
        if (idx === this.slots.length - 1 && this.playing) {
          this.playing = false;
          this.playingSlotIdx = -1;
          document.getElementById('montPlayBtn').classList.remove('on');
        }
      };
    }
    document.getElementById('montStatus').textContent =
      `playing ${this.slots.length} fragments  ${this.totalDuration().toFixed(1)}s`;
  },

  stop() {
    this.playing = false;
    this.playingSlotIdx = -1;
    this.activeSrcs.forEach(s => { try { s.stop(); s.disconnect(); } catch(e) {} });
    this.activeSrcs = [];
    document.getElementById('montPlayBtn').classList.remove('on');
    if (this.slots.length) {
      document.getElementById('montStatus').textContent =
        `${this.slots.length} fragments  ${this.totalDuration().toFixed(1)}s`;
    } else {
      document.getElementById('montStatus').textContent = 'empty tray';
    }
  },

  async render() {
    if (!this.slots.length || !A.AC) return null;
    const rate = 44100;

    // Build timeline with drift
    const schedule = [];
    let time = 0;
    for (const slot of this.slots) {
      const frag = A.samples.find(x => x.id === slot.fragId);
      if (!frag) continue;
      let hesitation = 0;
      if (this.drift) {
        const driftW = WEIGHTS[slot.semanticContinuity]?.drift || 0.3;
        hesitation = (Math.random() - 0.4) * 0.12 * driftW;
      }
      schedule.push({ frag, startTime: time + slot.gap + Math.max(0, hesitation) });
      time += frag.duration + slot.gap;
    }

    const totalFrames = Math.ceil((time + 1) * rate);
    const outBuf = A.AC.createBuffer(2, totalFrames, rate);

    for (const item of schedule) {
      const srcBuf = toAB(item.frag);
      const startFrame = Math.floor(item.startTime * rate);
      for (let ch = 0; ch < 2; ch++) {
        const src = srcBuf.getChannelData(Math.min(ch, srcBuf.numberOfChannels - 1));
        const dst = outBuf.getChannelData(ch);
        for (let i = 0; i < src.length; i++) {
          const di = startFrame + i;
          if (di >= 0 && di < dst.length) dst[di] += src[i] * 0.85; // mix
        }
      }
    }

    // Soft peak normalize the mix
    let peak = 0;
    for (let ch = 0; ch < 2; ch++) {
      const d = outBuf.getChannelData(ch);
      for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > peak) peak = Math.abs(d[i]);
    }
    if (peak > 0.85) {
      const g = 0.85 / peak;
      for (let ch = 0; ch < 2; ch++) {
        const d = outBuf.getChannelData(ch);
        for (let i = 0; i < d.length; i++) d[i] *= g;
      }
    }
    return outBuf;
  },

  saveSnapshot() {
    const snap = {
      id: uid(), name: `montage_${stamp()}`,
      slots: JSON.parse(JSON.stringify(this.slots)),
      gap: this.gap, drift: this.drift, semState: A.semState, ts: Date.now()
    };
    this.snapshots.push(snap);
    if (this.snapshots.length > 12) this.snapshots.shift();
    localStorage.setItem('vr8_msnaps', JSON.stringify(this.snapshots));
    renderMontageSnaps();
  },

  recallSnapshot(snap) {
    this.slots = JSON.parse(JSON.stringify(snap.slots));
    this.gap = snap.gap;
    this.drift = snap.drift;
    document.getElementById('gapVal').textContent = this.gap.toFixed(1) + 's';
    document.getElementById('driftToggle').classList.toggle('on', this.drift);
    renderTray(); drawMontageCanvas();
  }
};

// ═══════════════════════════════════════════════════════════════════════════
// NORMALIZATION ENGINE (unchanged from v7)
// ═══════════════════════════════════════════════════════════════════════════
const NORM = {
  analyze(buf) {
    const data=buf.getChannelData(0);let peak=0,sum=0;
    for(let i=0;i<data.length;i++){const a=Math.abs(data[i]);if(a>peak)peak=a;sum+=data[i]*data[i];}
    const rms=Math.sqrt(sum/data.length);
    return{peak,rms,peakDb:this.lin2db(peak),rmsDb:this.lin2db(rms)};
  },
  lin2db(v){return 20*Math.log10(Math.max(v,1e-10));},
  db2lin(v){return Math.pow(10,v/20);},
  compute(buf,mode){
    if(mode==='off') return{gain:1.0,meta:null};
    const{peak,rms,peakDb,rmsDb}=this.analyze(buf);let gain=1.0;
    switch(mode){
      case 'soft':{const t=this.db2lin(-6);gain=Math.min(t/(peak+1e-10),this.db2lin(14));gain=Math.max(gain,1.0);break;}
      case 'film':{const rt=this.db2lin(-18);gain=Math.min(rt/(rms+1e-10),this.db2lin(10));const pa=peak*gain,pc=this.db2lin(-2);if(pa>pc)gain=pc/(peak+1e-10);break;}
      case 'fragile':{const t=this.db2lin(-8);gain=Math.min(t/(peak+1e-10),this.db2lin(8));if(rmsDb<-40)gain=Math.min(gain,this.db2lin(5));break;}
    }
    const pa=peak*gain;
    return{gain,meta:{mode,peakBefore:Math.round(peakDb*10)/10,peakAfter:Math.round(this.lin2db(pa)*10)/10,rmsShift:Math.round(this.lin2db(gain)*10)/10}};
  },
  applyToBuffer(srcBuf,gain){
    const rate=srcBuf.sampleRate,ch=srcBuf.numberOfChannels,len=srcBuf.length;
    const out=A.AC.createBuffer(ch,len,rate);
    for(let c=0;c<ch;c++){const s=srcBuf.getChannelData(c),d=out.getChannelData(c);for(let i=0;i<len;i++) d[i]=clamp(s[i]*gain,-1,1);}
    return out;
  }
};

// ═══════════════════════════════════════════════════════════════════════════
// LIVE MUTATION ENGINE
// ═══════════════════════════════════════════════════════════════════════════
const LME = {
  src:null, mutType:'source', chain:null, instIntervals:[],
  play(buf,type,offset){
    this.stop();if(!buf||!A.AC) return;
    this.mutType=type;
    const chain=buildChain(type);
    const src=A.AC.createBufferSource();src.buffer=buf;src.loop=TP.looping;
    src.connect(chain.input);chain.output.connect(A.analyser);A.analyser.connect(A.AC.destination);
    const off=clamp(offset||0,0,buf.duration*0.998);
    TP.startedAt=A.AC.currentTime-off;TP.duration=buf.duration;TP.state='playing';
    src.start(A.AC.currentTime,off);this.src=src;this.chain=chain;
    this.startInst(type,chain);
    src.onended=()=>{if(TP.state==='playing'&&!TP.looping){TP.state='stopped';updateTUI();}};
    updateTUI();
  },
  stop(){
    this.clearInst();
    if(this.src){
      if(TP.state==='playing'&&this.src.buffer) TP.offsetSec=Math.min((A.AC.currentTime-TP.startedAt)%this.src.buffer.duration,this.src.buffer.duration*0.998);
      try{this.src.stop();this.src.disconnect();}catch(e){}this.src=null;
    }
    if(this.chain?.output){try{this.chain.output.disconnect();}catch(e){}}
    TP.state='stopped';
  },
  currentPos(){if(!this.src?.buffer||TP.state!=='playing') return TP.offsetSec;return(A.AC.currentTime-TP.startedAt)%this.src.buffer.duration;},
  startInst(type,chain){
    if(type==='fever'){
      const tid=setInterval(()=>{if(!chain.tremGain||!A.AC) return;const now=A.AC.currentTime,p=now*7.3;const v=0.82+Math.sin(p*6.283)*0.10+Math.sin(p*15.1*6.283/7.3)*0.03;chain.tremGain.gain.setTargetAtTime(Math.max(0.52,v),now,0.018);if(chain.wobDly&&Math.random()<0.07)chain.wobDly.delayTime.setTargetAtTime(0.007+Math.random()*0.032,now,0.11);},34);this.instIntervals.push(tid);
    }else if(type==='collapse'){
      const tid=setInterval(()=>{if(!chain.dropG||!A.AC) return;const now=A.AC.currentTime;if(Math.random()<0.11){chain.dropG.gain.setTargetAtTime(0.04,now,0.004);chain.dropG.gain.setTargetAtTime(1.0,now+0.03+Math.random()*0.09,0.012);}if(chain.instFilt&&Math.random()<0.18)chain.instFilt.frequency.setTargetAtTime(550+Math.random()*2600,now,0.07);},80);this.instIntervals.push(tid);
    }
  },
  clearInst(){this.instIntervals.forEach(clearInterval);this.instIntervals=[];}
};

function buildChain(type){
  const AC=A.AC,chain={};const input=AC.createGain();chain.input=input;let last=input;
  switch(type){
    case 'dissolve':{const ds=[0.031,0.088,0.21].map(t=>{const d=AC.createDelay(2);d.delayTime.value=t;return d;});const ws=[0.22,0.13,0.06].map(v=>mkG(v));const dry=mkG(0.88),mix=AC.createGain();ds.forEach((d,i)=>{input.connect(d);d.connect(ws[i]);ws[i].connect(mix);});input.connect(dry);dry.connect(mix);last=mix;break;}
    case 'collapse':{const hpf=mkFilt('highpass',180,0.7),instFilt=mkFilt('bandpass',1800,1.4);chain.instFilt=instFilt;const sat=AC.createWaveShaper();sat.curve=dCurve(28);sat.oversample='2x';const dropG=mkG(1.0);chain.dropG=dropG;const satG=mkG(0.18),dryG=mkG(0.85),mix=AC.createGain(),outG=mkG(0.76);input.connect(hpf);hpf.connect(instFilt);instFilt.connect(dryG);dryG.connect(mix);instFilt.connect(sat);sat.connect(satG);satG.connect(mix);mix.connect(dropG);dropG.connect(outG);last=outG;break;}
    case 'ritual':{const lpf=mkFilt('lowshelf',3200);lpf.gain.value=-4;const d=AC.createDelay(2);d.delayTime.value=0.195;const fb=mkG(0.27),wet=mkG(0.30),dry=mkG(0.84),mix=mkG(0.88);input.connect(lpf);lpf.connect(dry);input.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);dry.connect(mix);wet.connect(mix);last=mix;break;}
    case 'fever':{const wobDly=AC.createDelay(0.5);wobDly.delayTime.value=0.012;chain.wobDly=wobDly;const wobMix=mkG(0.25),wobDry=mkG(0.82),wobOut=AC.createGain();input.connect(wobDry);input.connect(wobDly);wobDly.connect(wobMix);wobDry.connect(wobOut);wobMix.connect(wobOut);const split=AC.createChannelSplitter(2),merge=AC.createChannelMerger(2);const lG=mkG(1.0),rG=mkG(0.84);wobOut.connect(split);split.connect(lG,0);lG.connect(merge,0,0);split.connect(rG,1);rG.connect(merge,0,1);const tremGain=mkG(0.9);chain.tremGain=tremGain;merge.connect(tremGain);const outG=mkG(0.82);tremGain.connect(outG);last=outG;break;}
  }
  const lim=AC.createDynamicsCompressor();lim.threshold.value=-9;lim.knee.value=3;lim.ratio.value=12;lim.attack.value=0.002;lim.release.value=0.1;last.connect(lim);chain.output=lim;return chain;
}

// ═══════════════════════════════════════════════════════════════════════════
// LAZY AC + STARTUP
// ═══════════════════════════════════════════════════════════════════════════
async function ensureAC(){
  if(A.AC){if(A.AC.state==='suspended') await A.AC.resume();return;}
  A.AC=new(window.AudioContext||window.webkitAudioContext)({sampleRate:44100});
  await A.AC.resume();

function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open('voxritual_v8',1);req.onerror=()=>rej(req.error);req.onsuccess=()=>res(req.result);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('samples')){const s=db.createObjectStore('samples',{keyPath:'id'});s.createIndex('cat','cat');s.createIndex('parentId','parentId');}};});}
const dbPut  = d  => idbOp('readwrite',s=>s.put(d));
const dbDel  = id => idbOp('readwrite',s=>s.delete(id));
const dbAll  = ()  => idbOp('readonly', s=>s.getAll());
function idbOp(mode,fn){return new Promise((res,rej)=>{const tx=A.db.transaction('samples',mode),req=fn(tx.objectStore('samples'));req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}

async function startCap(maxSec){
  if(A.cap.stream) return;await ensureAC();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    A.cap.stream=stream;A.cap.chunks=[];A.cap.startMs=Date.now();
    const msrc=A.AC.createMediaStreamSource(stream);msrc.connect(A.analyser);
    A.AC.createGain().connect(A.AC.destination);A.cap.msrc=msrc;
    const mr=new MediaRecorder(stream,{mimeType:bestMime()});
    mr.ondataavailable=e=>{if(e.data.size>0)A.cap.chunks.push(e.data);};
    mr.onstop=finishCap;mr.start(100);A.cap.recorder=mr;
    document.getElementById('capStop').style.display='inline-block';
    ['cap5','cap10','capBtn'].forEach(id=>document.getElementById(id).classList.add('on'));
    let elapsed=0;A.cap.timer=setInterval(()=>{elapsed=(Date.now()-A.cap.startMs)/1000;setCT(elapsed.toFixed(1)+'s');if(maxSec&&elapsed>=maxSec)stopCap();},100);
  }catch(e){setCT('denied');setTimeout(()=>setCT(''),2000);}
}
function stopCap(){
  if(!A.cap.stream) return;clearInterval(A.cap.timer);A.cap.recorder.stop();
  A.cap.stream.getTracks().forEach(t=>t.stop());A.cap.stream=null;
  if(A.cap.msrc){try{A.cap.msrc.disconnect();}catch(e){}A.cap.msrc=null;}
  document.getElementById('capStop').style.display='none';
  ['cap5','cap10','capBtn'].forEach(id=>document.getElementById(id).classList.remove('on'));setCT('…');
}
async function finishCap(){
  const allChunks=WARM.chunks.concat(A.cap.chunks);if(!allChunks.length){setCT('');return;}
  const blob=new Blob(allChunks,{type:allChunks[0].type});let buf;
  try{buf=await A.AC.decodeAudioData((await blob.arrayBuffer()).slice(0));}catch(e){setCT('err');return;}
  let finalBuf=buf,normMeta=null;
  if(A.normMode!=='off'){const{gain,meta}=NORM.compute(buf,A.normMode);finalBuf=NORM.applyToBuffer(buf,gain);normMeta=meta;}
  const sample=await buildRecord(finalBuf,{name:`cap_${stamp()}`,cat:'captures',parentId:null});
  if(normMeta) sample.fragmentIdentity.normalized=normMeta;
  await dbPut(sample);A.samples.push(sample);renderLibrary();selectSample(sample.id,true);
  setCT(buf.duration.toFixed(1)+'s');setTimeout(()=>setCT(''),3000);
}

// ═══════════════════════════════════════════════════════════════════════════
// SAMPLE RECORD BUILDER — with Fragment Identity + Relationships
// ═══════════════════════════════════════════════════════════════════════════
async function buildRecord(buf,meta){
  const analysis=analyze(buf),scores=score(buf,analysis);
  const fragType=detectFragType(analysis,scores,buf.duration);
  const channelData=[];
  for(let c=0;c<buf.numberOfChannels;c++) channelData.push(buf.getChannelData(c).slice());
  const prot=[];if(ED.locks.breaths)prot.push('breaths');if(ED.locks.consonants)prot.push('consonants');
  return{
    id:uid(),name:meta.name||'fragment',cat:meta.cat||'fragments',
    parentId:meta.parentId||null,mutationOf:meta.mutationOf||null,
    sampleRate:buf.sampleRate,numberOfChannels:buf.numberOfChannels,
    length:buf.length,duration:buf.duration,
    channelData,analysis,scores,
    semState:A.semState,favorite:false,createdAt:Date.now(),
    fragmentIdentity:{
      fragmentId:`frag_${uid()}`,origin:meta.parentId||null,
      type:fragType,semantic:A.semState,protected:prot,normalized:null,
      relationships:[]
    }
  };
}

function detectFragType(analysis,scores,dur){
  const breathDens=analysis.breaths.length/Math.max(dur,0.1);
  const silRatio=analysis.silences.reduce((s,x)=>s+x.t1-x.t0,0)/Math.max(dur,0.1);
  const cxDens=analysis.transients.filter(t=>t.type==='consonant').length/Math.max(dur,0.1);
  if(scores.fragility>72&&breathDens>0.5) return 'breath';
  if(scores.ghost>78) return 'texture';
  if(silRatio>0.65) return 'whisper';
  if(cxDens>3.2) return 'consonant';
  if(scores.fragility>50) return 'fragment';
  return 'spoken';
}

function analyze(buf){
  const data=buf.getChannelData(0),rate=buf.sampleRate,win=Math.floor(rate*0.01);
  let transients=[],breaths=[],silences=[],phrases=[];let prevE=0,silStart=-1,phraseStart=-1;
  for(let i=0;i<data.length;i+=win){
    let e=0;const end=Math.min(i+win,data.length);for(let j=i;j<end;j++) e+=data[j]*data[j];
    e=Math.sqrt(e/(end-i));const t=i/rate;
    if(e>prevE*1.72&&e>0.016) transients.push({t,e,type:e>0.055?'consonant':'onset'});
    if(e<0.004){if(silStart<0)silStart=t;if(phraseStart>=0&&t-phraseStart>0.12){phrases.push({t0:phraseStart,t1:t});phraseStart=-1;}}
    else{if(silStart>=0&&t-silStart>0.04){silences.push({t0:silStart,t1:t});if(e<0.022)breaths.push({t,dur:t-silStart});}silStart=-1;if(phraseStart<0)phraseStart=t;}
    prevE=e;
  }
  if(phraseStart>=0) phrases.push({t0:phraseStart,t1:buf.duration});
  return{transients,breaths,silences,phrases};
}
function score(buf,a){
  const silDur=a.silences.reduce((s,x)=>s+x.t1-x.t0,0);
  return{fragility:Math.min(100,Math.round(silDur/buf.duration*100+a.breaths.length*5)),ghost:Math.min(100,Math.round(Math.max(0,100-(a.transients.length/buf.duration)*8)))};
}

// ═══════════════════════════════════════════════════════════════════════════
// MONTAGE LANE CANVAS
// ═══════════════════════════════════════════════════════════════════════════
function drawMontageCanvas(){
  const c=document.getElementById('montCanvas');if(!c) return;
  const W=c.offsetWidth||300,H=52;
  if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(0,10,8,.3)';ctx.fillRect(0,0,W,H);

  if(!MONTAGE.slots.length){
    ctx.fillStyle='rgba(0,255,200,.18)';ctx.font='500 11px Inter, sans-serif';ctx.textAlign='center';
    ctx.fillText('montage empty',W/2,H/2+4);ctx.textAlign='left';return;
  }

  const totalDur=MONTAGE.totalDuration();if(totalDur<=0) return;

  let x=0;
  for(let i=0;i<MONTAGE.slots.length;i++){
    const slot=MONTAGE.slots[i];
    const frag=A.samples.find(s=>s.id===slot.fragId);if(!frag) continue;
    const fi=frag.fragmentIdentity||{};
    const [r,g,b]=MONTAGE.fragColor(fi.type);

    // Gap space
    const gapW=(slot.gap/totalDur)*W;
    if(gapW>2){
      // Silence as dotted outline (meaningful negative space)
      ctx.strokeStyle=`rgba(${r},${g},${b},0.12)`;ctx.lineWidth=1;ctx.setLineDash([2,4]);
      ctx.strokeRect(x+0.5,H*0.3,gapW-1,H*0.4);ctx.setLineDash([]);
    }
    x+=gapW;

    // Fragment block
    const fragW=Math.max(4,(frag.duration/totalDur)*W);
    const isPlaying=MONTAGE.playing&&MONTAGE.playingSlotIdx===i;

    ctx.fillStyle=`rgba(${r},${g},${b},0.18)`;
    ctx.fillRect(x,1,fragW-1,H-2);
    ctx.strokeStyle=isPlaying?`rgba(${r},${g},${b},0.9)`:`rgba(${r},${g},${b},0.4)`;
    ctx.lineWidth=isPlaying?1.5:1;ctx.setLineDash([]);
    ctx.strokeRect(x+.5,1.5,fragW-2,H-3);

    // Fragment type label (tiny)
    if(fragW>24){
      ctx.fillStyle=`rgba(${r},${g},${b},0.75)`;ctx.font='bold 9px Inter, sans-serif';
      ctx.fillText(fi.type||'?',x+4,H-5);
    }
    x+=fragW;
  }
}

// Tap montage canvas → select/preview fragment
document.getElementById('montCanvas').addEventListener('click',e=>{
  const c=document.getElementById('montCanvas');
  const W=c.offsetWidth;const frac=e.offsetX/W;
  const totalDur=MONTAGE.totalDuration();if(totalDur<=0) return;
  let t=0;

function buildPeakCache(s){if(ED.peaksFor===s.id&&ED.peaks)return;const data=s.channelData[0],N=1200,step=data.length/N;const peaks=new Float32Array(N);for(let i=0;i<N;i++){let mx=0;const b=Math.floor(i*step);for(let j=b;j<b+step&&j<data.length;j++)if(Math.abs(data[j])>mx)mx=Math.abs(data[j]);peaks[i]=mx;}ED.peaks=peaks;ED.peaksFor=s.id;}
function buildTLPeaks(s){if(ED.tlPeaksFor===s.id&&ED.tlPeaks)return;const data=s.channelData[0],N=600,step=data.length/N;const peaks=new Float32Array(N);for(let i=0;i<N;i++){let mx=0;const b=Math.floor(i*step);for(let j=b;j<b+step&&j<data.length;j++)if(Math.abs(data[j])>mx)mx=Math.abs(data[j]);peaks[i]=mx;}ED.tlPeaks=peaks;ED.tlPeaksFor=s.id;}

function normToX(n,W){const vd=1/ED.zoom,vs=clamp(ED.viewStart,0,1-vd);return((n-vs)/vd)*W;}
function xToNorm(x,W){const vd=1/ED.zoom,vs=clamp(ED.viewStart,0,1-vd);return x/W*vd+vs;}

function drawSurgCanvas(){
  const c=document.getElementById('surgCanvas');if(!c)return;
  const W=c.offsetWidth,H=78;if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
  const ctx=c.getContext('2d');ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(153,68,255,.04)';ctx.fillRect(0,0,W,H);
  const s=A.samples.find(x=>x.id===A.selectedId);if(!s||!ED.peaks)return;
  const mid=H/2,peaks=ED.peaks,N=peaks.length;
  const vs=clamp(ED.viewStart,0,1-1/ED.zoom),ve=vs+1/ED.zoom;
  const pi0=Math.floor(vs*N),pi1=Math.ceil(ve*N),visN=pi1-pi0;

  // Get fragment color from type
  const fi=s.fragmentIdentity||{};const[r,g,b]=MONTAGE.fragColor(fi.type);
  ctx.fillStyle=`rgba(${r},${g},${b},0.38)`;
  for(let x=0;x<W;x++){const pidx=pi0+Math.floor(x/W*visN);const v=peaks[clamp(pidx,0,N-1)]||0;const h=v*mid*0.85;ctx.fillRect(x,mid-h,1,h*2||1);}

  if(!ED.locks.consonants){ctx.fillStyle='rgba(255,175,0,.4)';for(const t of s.analysis.transients.slice(0,80)){const n=t.t/s.duration;if(n<vs||n>ve)continue;ctx.fillRect(normToX(n,W)-.5,0,1,t.type==='consonant'?H*.5:H*.28);}}
  if(!ED.locks.breaths){ctx.fillStyle='rgba(0,220,220,.5)';for(const b of s.analysis.breaths.slice(0,30)){const n=b.t/s.duration;if(n<vs||n>ve)continue;ctx.fillRect(normToX(n,W)-.5,H*.72,1,H*.28);}}

  const tLx=normToX(ED.trimL,W),tRx=normToX(ED.trimR,W);
  ctx.fillStyle='rgba(9,7,20,.62)';if(tLx>0)ctx.fillRect(0,0,tLx,H);if(tRx<W)ctx.fillRect(tRx,0,W-tRx,H);
  ctx.strokeStyle='rgba(0,255,255,.82)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(tLx,0);ctx.lineTo(tLx,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(tRx,0);ctx.lineTo(tRx,H);ctx.stroke();
  ctx.fillStyle='rgba(0,255,255,.88)';ctx.fillRect(tLx-4,mid-10,8,20);ctx.fillRect(tRx-4,mid-10,8,20);

  const pn=LME.currentPos()/s.duration;
  if(pn>=vs&&pn<=ve){ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(normToX(pn,W),0);ctx.lineTo(normToX(pn,W),H);ctx.stroke();}
}

surgC.addEventListener('touchmove',e=>{e.preventDefault();if(!ED.drag)return;const t=e.touches[0],r=surgC.getBoundingClientRect();doDrag(t.clientX-r.left);},{passive:false});

function initDrag(x){
  const W=surgC.offsetWidth,ZONE=20,tLx=normToX(ED.trimL,W),tRx=normToX(ED.trimR,W);
  if(Math.abs(x-tLx)<ZONE)ED.drag='L';
  else if(Math.abs(x-tRx)<ZONE)ED.drag='R';
  else if(ED.zoom>1.05){ED.drag='pan';ED.dragStartX=x;ED.dragStartVal=ED.viewStart;}
  else{const n=clamp(xToNorm(x,W),0,1);seekNorm(n);}
}
function doDrag(x){
  const W=surgC.offsetWidth,n=clamp(xToNorm(x,W),0,1);
  if(ED.drag==='L')ED.trimL=Math.min(n,ED.trimR-0.005);
  else if(ED.drag==='R')ED.trimR=Math.max(n,ED.trimL+0.005);
  else if(ED.drag==='pan'){const dx=(x-ED.dragStartX)/W,vd=1/ED.zoom;ED.viewStart=clamp(ED.dragStartVal-dx,0,1-vd);}
}

async function execSurgery(op){
  const s=A.samples.find(x=>x.id===A.selectedId);if(!s)return;
  await ensureAC();const srcBuf=toAB(s);const t0=ED.trimL*s.duration,t1=ED.trimR*s.duration;
  let newBuf,mut=op;
  try{
    switch(op){
      case 'trim':newBuf=await surgTrim(srcBuf,t0,t1);break;
      case 'split':{const mid=t0+(t1-t0)*0.5;const[b1,b2]=await surgSplit(srcBuf,mid);const s1=await buildRecord(b1,{name:s.name+'_A',cat:s.cat,parentId:s.id,mutationOf:'split_A'});const s2=await buildRecord(b2,{name:s.name+'_B',cat:s.cat,parentId:s.id,mutationOf:'split_B'});await dbPut(s1);await dbPut(s2);A.samples.push(s1);A.samples.push(s2);renderLibrary();selectSample(s1.id,true);return;}
      case 'dupe':{const c=JSON.parse(JSON.stringify(s));c.id=uid();c.name=s.name+'_copy';c.createdAt=Date.now();await dbPut(c);A.samples.push(c);renderLibrary();selectSample(c.id,false);return;}
      case 'rev':newBuf=await surgReverse(srcBuf,t0,t1);break;
      case 'fadeIn':newBuf=await surgFade(srcBuf,'in',t0,t1);break;
      case 'fadeOut':newBuf=await surgFade(srcBuf,'out',t0,t1);break;
      case 'pitchDn':newBuf=await surgPitch(srcBuf,0.891,t0,t1);break;
      case 'pitchUp':newBuf=await surgPitch(srcBuf,1.122,t0,t1);break;
      case 'slow':newBuf=await surgPitch(srcBuf,0.5,t0,t1);break;
      case 'fast':newBuf=await surgPitch(srcBuf,1.5,t0,t1);break;
      case 'extract':{
        // QUICK EXTRACT → TRAY: trim region, auto-name, auto-tag, send to tray immediately
        const extracted=await surgTrim(srcBuf,t0,t1);
        const child=await buildRecord(extracted,{name:`${s.name}_ex_${stamp()}`,cat:'fragments',parentId:s.id,mutationOf:'extract'});
        if(A.normMode!=='off'){const{gain,meta}=NORM.compute(extracted,A.normMode);const nb=NORM.applyToBuffer(extracted,gain);const normChild=await buildRecord(nb,{name:child.name,cat:'fragments',parentId:s.id,mutationOf:'extract'});normChild.fragmentIdentity.normalized=meta;await dbPut(normChild);A.samples.push(normChild);MONTAGE.addFrag(normChild);}
        else{await dbPut(child);A.samples.push(child);MONTAGE.addFrag(child);}
        // Auto-open montage panel
        document.getElementById('montPanel').classList.add('open');document.getElementById('montDivR').textContent='▲';
        renderLibrary();return;
      }
    }
    if(!newBuf) return;
    let finalBuf=newBuf,normMeta=null;
    if(A.normMode!=='off'){const{gain,meta}=NORM.compute(newBuf,A.normMode);finalBuf=NORM.applyToBuffer(newBuf,gain);normMeta=meta;}
    const child=await buildRecord(finalBuf,{name:`${s.name}_${mut}`,cat:s.cat,parentId:s.id,mutationOf:mut});
    if(normMeta)child.fragmentIdentity.normalized=normMeta;
    await dbPut(child);A.samples.push(child);renderLibrary();selectSample(child.id,true);
  }catch(e){console.error('Surgery:',op,e);}
}

// Surgery DSP
async function surgTrim(buf,t0,t1){const rate=buf.sampleRate,ch=buf.numberOfChannels;const s0=Math.floor(t0*rate),s1=Math.floor(t1*rate),len=s1-s0;if(len<=0)return buf;const out=A.AC.createBuffer(ch,len,rate);for(let c=0;c<ch;c++){const s=buf.getChannelData(c),d=out.getChannelData(c);for(let i=0;i<len;i++)d[i]=s[s0+i]||0;}return out;}
async function surgSplit(buf,splitSec){const rate=buf.sampleRate,ch=buf.numberOfChannels,sp=Math.floor(splitSec*rate);const b1=A.AC.createBuffer(ch,sp,rate),b2=A.AC.createBuffer(ch,buf.length-sp,rate);for(let c=0;c<ch;c++){const src=buf.getChannelData(c);b1.getChannelData(c).set(src.slice(0,sp));b2.getChannelData(c).set(src.slice(sp));}return[b1,b2];}
async function surgReverse(buf,t0,t1){const rate=buf.sampleRate,ch=buf.numberOfChannels;const s0=Math.floor(t0*rate),s1=Math.floor(t1*rate);const out=A.AC.createBuffer(ch,buf.length,rate);for(let c=0;c<ch;c++){const src=buf.getChannelData(c),dst=out.getChannelData(c);dst.set(src);const seg=dst.slice(s0,s1);seg.reverse();for(let i=0;i<seg.length;i++)dst[s0+i]=seg[i];}return out;}
async function surgFade(buf,dir,t0,t1){const rate=buf.sampleRate,ch=buf.numberOfChannels;const s0=Math.floor(t0*rate),s1=Math.floor(t1*rate),len=s1-s0;const fade=Math.min(Math.floor(rate*0.15),len);const out=A.AC.createBuffer(ch,buf.length,rate);for(let c=0;c<ch;c++){const src=buf.getChannelData(c),dst=out.getChannelData(c);dst.set(src);if(dir==='in'){for(let i=0;i<fade;i++)dst[s0+i]*=i/fade;}else{const start=s1-fade;for(let i=0;i<fade;i++)dst[start+i]*=1-i/fade;}}return out;}
async function surgPitch(buf,rate,t0,t1){const srcLen=Math.floor((t1-t0)*buf.sampleRate),outLen=Math.floor(srcLen/rate);const offAC=new OfflineAudioContext(buf.numberOfChannels,outLen,buf.sampleRate);const stereo=offAC.createBuffer(buf.numberOfChannels,srcLen,buf.sampleRate);for(let c=0;c<buf.numberOfChannels;c++)stereo.copyToChannel(buf.getChannelData(c).slice(Math.floor(t0*buf.sampleRate),Math.floor(t1*buf.sampleRate)),c);const src=offAC.createBufferSource();src.buffer=stereo;src.playbackRate.value=rate;src.connect(offAC.destination);src.start(0);return offAC.startRendering();}

// BOUNCE
async function bounceQuick(){
  const s=A.samples.find(x=>x.id===A.selectedId);if(!s)return;await ensureAC();
  document.getElementById('bounceBtn').textContent='…';
  try{
    let buf=await surgTrim(toAB(s),ED.trimL*s.duration,ED.trimR*s.duration);
    if(LME.mutType!=='source')buf=await offlineRender(buf,LME.mutType);
    let normMeta=null;if(A.normMode!=='off'){const{gain,meta}=NORM.compute(buf,A.normMode);buf=NORM.applyToBuffer(buf,gain);normMeta=meta;}
    const catMap={dissolve:'textures',collapse:'corrupted',ritual:'ritual',fever:'corrupted'};
    const child=await buildRecord(buf,{name:`${s.name}_${LME.mutType}`,cat:catMap[LME.mutType]||s.cat,parentId:s.id,mutationOf:LME.mutType});
    child.semState=semForMut(LME.mutType);if(normMeta)child.fragmentIdentity.normalized=normMeta;
    child.fragmentIdentity.origin=s.fragmentIdentity?.origin||s.id;
    await dbPut(child);A.samples.push(child);renderLibrary();selectSample(child.id,true);
  }catch(e){console.error('Bounce:',e);}
  document.getElementById('bounceBtn').textContent='BOUNCE';
}

// OFFLINE RENDER
async function offlineRender(srcBuf,type){
  const len=srcBuf.length,rate=srcBuf.sampleRate;
  const offAC=new OfflineAudioContext(2,len,rate);
  const stereo=offAC.createBuffer(2,len,rate);
  for(let c=0;c<2;c++) stereo.copyToChannel(srcBuf.getChannelData(Math.min(c,srcBuf.numberOfChannels-1)),c);
  const src=offAC.createBufferSource();src.buffer=stereo;let last=src;
  switch(type){
    case 'dissolve':{const ds=[0.031,0.088,0.21].map(t=>{const d=offAC.createDelay(2);d.delayTime.value=t;return d;});const ws=[0.22,0.13,0.06].map(v=>offMkG(offAC,v));const dry=offMkG(offAC,0.88),mix=offAC.createGain();src.connect(dry);ds.forEach((d,i)=>{src.connect(d);d.connect(ws[i]);ws[i].connect(mix);});dry.connect(mix);last=mix;break;}
    case 'collapse':{const hpf=offAC.createBiquadFilter();hpf.type='highpass';hpf.frequency.value=180;const bp=offAC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=1.4;const sat=offAC.createWaveShaper();sat.curve=dCurve(28);sat.oversample='2x';const satG=offMkG(offAC,0.18),dryG=offMkG(offAC,0.85),mix=offAC.createGain(),outG=offMkG(offAC,0.76);src.connect(hpf);hpf.connect(bp);bp.connect(dryG);dryG.connect(mix);bp.connect(sat);sat.connect(satG);satG.connect(mix);mix.connect(outG);last=outG;break;}
    case 'ritual':{const lpf=offAC.createBiquadFilter();lpf.type='lowshelf';lpf.frequency.value=3200;lpf.gain.value=-4;const d=offAC.createDelay(2);d.delayTime.value=0.195;const fb=offMkG(offAC,0.27),wet=offMkG(offAC,0.30),dry=offMkG(offAC,0.84),mix=offMkG(offAC,0.88);src.connect(lpf);lpf.connect(dry);src.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);dry.connect(mix);wet.connect(mix);last=mix;break;}
    case 'fever':{src.playbackRate.value=1+(Math.random()*0.014-0.007);const split=offAC.createChannelSplitter(2),merge=offAC.createChannelMerger(2);const lG=offMkG(offAC,1.0),rG=offMkG(offAC,0.84),tremG=offAC.createGain();tremG.gain.value=0.9;const step=0.024,dur=srcBuf.duration;for(let t=0;t<dur;t+=step){const v=0.82+Math.sin(t*7.3*6.283)*0.10+Math.sin(t*15.1*6.283)*0.03;tremG.gain.setValueAtTime(Math.max(0.52,v),t);}src.connect(split);split.connect(lG,0);lG.connect(merge,0,0);split.connect(rG,1);rG.connect(merge,0,1);merge.connect(tremG);const outG=offMkG(offAC,0.82);tremG.connect(outG);last=outG;break;}
  }
  const lim=offAC.createDynamicsCompressor();lim.threshold.value=-9;lim.knee.value=3;lim.ratio.value=12;lim.attack.value=0.002;lim.release.value=0.1;last.connect(lim);lim.connect(offAC.destination);src.start(0);return offAC.startRendering();
}

document.getElementById('snapAddBtn').addEventListener('click',()=>{if(!A.selectedId)return;const snap={id:uid(),name:`${LME.mutType}_${stamp()}`,sourceId:A.selectedId,mutType:LME.mutType,semState:A.semState,normMode:A.normMode,ts:Date.now()};A.snapshots.push(snap);if(A.snapshots.length>20)A.snapshots.shift();localStorage.setItem('vr8_snaps',JSON.stringify(A.snapshots));renderSnaps();});
function renderSnaps(){const row=document.getElementById('snapRow'),noMsg=document.getElementById('noSnapMsg');const rel=A.snapshots.filter(s=>s.sourceId===A.selectedId);noMsg.style.display=rel.length?'none':'inline';row.querySelectorAll('.sch:not(.add)').forEach(c=>c.remove());rel.slice(-6).forEach(snap=>{const c=document.createElement('button');c.className='sch';c.textContent=snap.name;c.addEventListener('click',async()=>{const s=A.samples.find(x=>x.id===snap.sourceId);if(!s)return;setSemState(snap.semState);if(snap.normMode)setNormMode(snap.normMode);document.querySelectorAll('.mBtn[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===snap.mutType));await ensureAC();LME.play(toAB(s),snap.mutType,LME.currentPos());});row.appendChild(c);});}

function drawHistTree(sample){const row=document.getElementById('histRow');row.innerHTML='';const chain=ancestorChain(sample),desc=A.samples.filter(s=>s.parentId===sample.id);chain.forEach((s,i)=>{if(i>0)row.appendChild(el('div','hArr','→'));const n=el('button',`hNode${s.id===sample.id?' on':i===0?' root':''}`,s.mutationOf||s.name.slice(0,8));n.addEventListener('click',()=>selectSample(s.id,true));row.appendChild(n);});if(desc.length){row.appendChild(el('div','hArr','('));desc.forEach((d,i)=>{if(i>0)row.appendChild(el('div','hArr','|'));const n=el('button','hNode',d.mutationOf||d.name.slice(0,7));n.addEventListener('click',()=>selectSample(d.id,true));row.appendChild(n);});row.appendChild(el('div','hArr',')'));}}
function ancestorChain(s){const chain=[s];let cur=s;for(let i=0;i<8;i++){if(!cur.parentId)break;const p=A.samples.find(x=>x.id===cur.parentId);if(!p)break;chain.unshift(p);cur=p;}return chain;}

document.getElementById('rcToggle').addEventListener('click',()=>{const p=document.getElementById('rcPanel');p.style.display=p.style.display==='none'?'flex':'none';});
function renderRecomp(s){const blocks=document.getElementById('rcBlocks');blocks.innerHTML=(s.analysis.phrases||[]).slice(0,20).map((p,i)=>`<button class="rcb" data-i="${i}" data-t0="${p.t0}" data-t1="${p.t1}">P${i+1} ${(p.t1-p.t0).toFixed(1)}s</button>`).join('');blocks.querySelectorAll('.rcb').forEach(b=>b.addEventListener('click',async()=>{b.classList.toggle('off');if(!b.classList.contains('off')){const s=A.samples.find(x=>x.id===A.selectedId);if(!s)return;await ensureAC();LME.stop();const src=A.AC.createBufferSource();src.buffer=toAB(s);src.connect(A.analyser);A.analyser.connect(A.AC.destination);const t0=parseFloat(b.dataset.t0),t1=parseFloat(b.dataset.t1);src.start(0,t0,t1-t0);LME.src=src;TP.state='playing';TP.startedAt=A.AC.currentTime-t0;TP.duration=s.duration;updateTUI();};}));}
document.getElementById('rcRenderBtn').addEventListener('click',async()=>{
  const s=A.samples.find(x=>x.id===A.selectedId);if(!s)return;
  const active=Array.from(document.querySelectorAll('.rcb:not(.off)'));if(!active.length)return;
  document.getElementById('rcRenderBtn').textContent='…';const srcBuf=toAB(s);
  const segs=active.map(b=>({t0:parseFloat(b.dataset.t0),t1:parseFloat(b.dataset.t1),frames:Math.floor((parseFloat(b.dataset.t1)-parseFloat(b.dataset.t0))*srcBuf.sampleRate)}));
  const total=segs.reduce((a,g)=>a+g.frames,0);const newBuf=A.AC.createBuffer(srcBuf.numberOfChannels,total,srcBuf.sampleRate);let off=0;
  for(const seg of segs){const sf=Math.floor(seg.t0*srcBuf.sampleRate);for(let c=0;c<srcBuf.numberOfChannels;c++){const s=srcBuf.getChannelData(c),d=newBuf.getChannelData(c);for(let i=0;i<seg.frames;i++)d[off+i]=s[sf+i]||0;}off+=seg.frames;}
  const child=await buildRecord(newBuf,{name:`${s.name}_rc`,cat:'fragments',parentId:s.id,mutationOf:'recompose'});await dbPut(child);A.samples.push(child);renderLibrary();selectSample(child.id,true);document.getElementById('rcRenderBtn').textContent='RENDER';
});

// TRANSPORT
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById('tPlay').addEventListener('click',async()=>{const s=A.samples.find(x=>x.id===A.selectedId);if(!s)return;await ensureAC();LME.play(toAB(s),LME.mutType,TP.state==='stopped'?ED.trimL*s.duration:TP.offsetSec);});
document.getElementById('tStop').addEventListener('click',()=>{LME.stop();MONTAGE.stop();updateTUI();});
document.getElementById('tLoop').addEventListener('click',function(){TP.looping=!TP.looping;this.classList.toggle('on',TP.looping);if(LME.src)LME.src.loop=TP.looping;saveSession();});
document.getElementById('tlCanvas').addEventListener('click',async function(e){const s=A.samples.find(x=>x.id===A.selectedId);if(!s)return;await ensureAC();LME.play(toAB(s),LME.mutType,clamp((e.clientX-this.getBoundingClientRect().left)/this.offsetWidth,0,1)*s.duration);});
function updateTUI(){document.getElementById('tPlay').classList.toggle('on',TP.state==='playing');renderLibrary();}

// ═══════════════════════════════════════════════════════════════════════════
// VISUALIZATION
// ═══════════════════════════════════════════════════════════════════════════
function startViz(){vizLoop();}
function vizLoop(){drawSpec();drawSurgCanvas();drawTL();drawMontageCanvas();requestAnimationFrame(vizLoop);}

function drawSpec(){
  const c=document.getElementById('specC');if(!c||!A.analyser)return;const W=c.offsetWidth||100,H=11;if(c.width!==W){c.width=W;c.height=H;}
  const ctx=c.getContext('2d');ctx.clearRect(0,0,W,H);A.analyser.getByteFrequencyData(A.freqData);
  const[r,g,b]=hexRGB(SCOLORS[STATES.indexOf(A.semState)]||'#9944ff');const step=A.freqData.length/W;
  for(let x=0;x<W;x++){const v=A.freqData[Math.floor(x*step)]/255;if(v<0.01)continue;ctx.fillStyle=`rgba(${r},${g},${b},0.6)`;ctx.fillRect(x,H-v*H,1,v*H);}
}
function drawTL(){
  const c=document.getElementById('tlCanvas');const s=A.samples.find(x=>x.id===A.selectedId);
  if(!c||!s||!ED.tlPeaks)return;const W=c.offsetWidth||300,H=22;if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
  const ctx=c.getContext('2d');ctx.clearRect(0,0,W,H);
  const fi=s.fragmentIdentity||{};const[r,g,b]=MONTAGE.fragColor(fi.type);
  const peaks=ED.tlPeaks,N=peaks.length,mid=H/2;
  ctx.fillStyle='rgba(9,7,20,.4)';ctx.fillRect(0,0,W,H);ctx.fillStyle=`rgba(${r},${g},${b},0.28)`;
  for(let x=0;x<W;x++){const v=peaks[Math.floor(x/W*N)]||0;const h=v*mid*.78;ctx.fillRect(x,mid-h,1,h*2||1);}
  if(TP.state==='playing'&&LME.src?.buffer){const pn=LME.currentPos()/s.duration;ctx.fillStyle='rgba(0,255,255,.75)';ctx.fillRect(clamp(pn*W,0,W-1),0,1.5,H);}
  document.getElementById('tlPos').textContent=fmt(LME.currentPos?.()||0);
}
function miniWave(canvas,s){
  const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  ctx.fillStyle='rgba(153,68,255,.05)';ctx.fillRect(0,0,W,H);
  const fi=s.fragmentIdentity||{};const[r,g,b]=MONTAGE.fragColor(fi.type);
  const data=s.channelData[0],step=Math.max(1,Math.floor(data.length/W)),mid=H/2;
  ctx.strokeStyle=`rgba(${r},${g},${b},0.45)`;ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<W;x++){let mx=0;const b2=x*step;for(let j=b2;j<b2+step&&j<data.length;j++)if(Math.abs(data[j])>mx)mx=Math.abs(data[j]);x===0?ctx.moveTo(x,mid-mx*mid*.8):ctx.lineTo(x,mid-mx*mid*.8);}
  ctx.stroke();
}

function setSemState(state){A.semState=state;const idx=STATES.indexOf(state),col=SCOLORS[Math.max(0,idx)];const orb=document.getElementById('semOrb');orb.style.background=col;orb.style.boxShadow=`0 0 6px ${col}`;document.getElementById('semName').textContent=state;document.querySelectorAll('#semDots .dot').forEach((d,i)=>d.classList.toggle('on',i<=Math.max(0,idx)));}
const semForMut=t=>({source:'fragile',dissolve:'ghost',collapse:'collapse',ritual:'ritual',fever:'fever'}[t]||'fragile');

// ═══════════════════════════════════════════════════════════════════════════
// EXPORT — ADN v2 with montage state
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById('adnBtn').addEventListener('click',()=>{
  const pkg={version:'voxritual_adn_v2',ts:new Date().toISOString(),semState:A.semState,normMode:A.normMode,mutationWeights:WEIGHTS,
    samples:A.samples.map(s=>({id:s.id,name:s.name,cat:s.cat,parentId:s.parentId,mutationOf:s.mutationOf,duration:s.duration,sampleRate:s.sampleRate,semState:s.semState,scores:s.scores,favorite:s.favorite,fragmentIdentity:s.fragmentIdentity,analysis:{transientCount:s.analysis.transients.length,breathCount:s.analysis.breaths.length,phraseCount:s.analysis.phrases.length,transients:s.analysis.transients.slice(0,50),breaths:s.analysis.breaths.slice(0,30),phrases:s.analysis.phrases.slice(0,20)},createdAt:s.createdAt})),
    descendantTree:A.samples.filter(s=>!s.parentId).map(r=>({id:r.id,name:r.name,fragmentIdentity:r.fragmentIdentity,descendants:A.samples.filter(d=>d.parentId===r.id).map(d=>({id:d.id,name:d.name,mutationOf:d.mutationOf,semState:d.semState,fragmentIdentity:d.fragmentIdentity}))})),
    montageState:{slots:MONTAGE.slots,gap:MONTAGE.gap,drift:MONTAGE.drift,snapshots:MONTAGE.snapshots},
    snapshots:A.snapshots};
  dl(JSON.stringify(pkg,null,2),'application/json',`voxritual_adn_${Date.now()}.json`);
});
document.getElementById('wavBtn').addEventListener('click',()=>{const s=A.samples.find(x=>x.id===A.selectedId);if(!s){alert('Select a sample');return;}const buf=toAB(s),interleaved=new Float32Array(buf.length*buf.numberOfChannels);for(let i=0;i<buf.length;i++)for(let c=0;c<buf.numberOfChannels;c++)interleaved[i*buf.numberOfChannels+c]=buf.getChannelData(c)[i];dl(buildWAV(interleaved,buf.sampleRate,buf.numberOfChannels),'audio/wav',`${s.name}_${Date.now()}.wav`);});

function buildWAV(samples,rate,ch){const dl2=samples.length*2,buf=new ArrayBuffer(44+dl2),v=new DataView(buf);const ws=(o,s)=>s.split('').forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));ws(0,'RIFF');v.setUint32(4,36+dl2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,rate,true);v.setUint32(28,rate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,dl2,true);let off=44;for(let i=0;i<samples.length;i++,off+=2){const s=Math.max(-1,Math.min(1,samples[i]));v.setInt16(off,s<0?s*32768:s*32767,true);}return buf;}
function dl(data,mime,name){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}

// SESSION PERSISTENCE
function saveSession(){localStorage.setItem('vr8_sess',JSON.stringify({selectedId:A.selectedId,semState:A.semState,cat:A.cat,normMode:A.normMode,looping:TP.looping,gap:MONTAGE.gap,drift:MONTAGE.drift}));}

// UTILITIES
function toAB(s){const buf=A.AC.createBuffer(s.numberOfChannels,s.length,s.sampleRate);for(let c=0;c<s.numberOfChannels;c++)buf.copyToChannel(new Float32Array(s.channelData[c]),c);return buf;}
function mkG(v){const g=A.AC.createGain();g.gain.value=v;return g;}
function mkFilt(type,freq,Q=1){const f=A.AC.createBiquadFilter();f.type=type;f.frequency.value=freq;if(Q)f.Q.value=Q;return f;}
function offMkG(ac,v){const g=ac.createGain();g.gain.value=v;return g;}
function dCurve(amount){const n=512,c=new Float32Array(n);for(let i=0;i<n;i++){const x=(i*2)/n-1;c[i]=amount<1?x:(Math.PI+amount)*x/(Math.PI+amount*Math.abs(x));}return c;}
function bestMime(){for(const t of['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'])if(MediaRecorder.isTypeSupported(t))return t;return '';}
function fmt(s){const m=Math.floor(s/60);return`${m}:${Math.floor(s%60).toString().padStart(2,'0')}`;}
function stamp(){const d=new Date();return`${d.getHours().toString().padStart(2,'0')}${d.getMinutes().toString().padStart(2,'0')}${d.getSeconds().toString().padStart(2,'0')}`;}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36);}
function hexRGB(hex){const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);return r?[parseInt(r[1],16),parseInt(r[2],16),parseInt(r[3],16)]:[153,68,255];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function el(tag,cls,txt){const e=document.createElement(tag);e.className=cls;if(txt)e.textContent=txt;return e;}
function setCT(t){document.getElementById('capTime').textContent=t;}
</script>
