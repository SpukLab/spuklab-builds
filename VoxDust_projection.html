<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxDust — Projection</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  #idle{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    font:italic 10px "JetBrains Mono",monospace;
    color:rgba(255,255,255,0.18);
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div id="idle">VoxDust — waiting for signal</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────
var state = {
  visual:{text:'',progress:0,wordIndex:0,emphasis:false,rms:0,smear:0,form:0},
  fftBins:[], aDom:0, bDom:0,
  phraseDom:0, voiceMix:0,
  turnState:0, intent:0, convMode:0, rms:0
};
var hasSignal = false;
var lastSignal = 0;

window.addEventListener('message', function(e){
  if(!e.data||typeof e.data!=='object') return;
  state = e.data;
  hasSignal = true;
  lastSignal = performance.now();
  document.getElementById('idle').style.opacity='0';
});

// ── CANVAS SETUP ─────────────────────────────────────────────────
var c = document.getElementById('pc');
var ctx = c.getContext('2d');
var DPR = Math.min(2, window.devicePixelRatio||1);
var W, H, SCALE;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  c.width  = Math.round(window.innerWidth  * DPR);
  c.height = Math.round(window.innerHeight * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W = window.innerWidth;
  H = window.innerHeight;
  SCALE = Math.min(W,H)/600;
}
window.addEventListener('resize', resize);
resize();

// ── SMOOTH STATE ─────────────────────────────────────────────────
var sm = {
  bgHue:210, bgL:8,
  aOff:0, bOff:0,
  aAlpha:0.5, bAlpha:0.5,
  dom:0, hue:210
};

// ── RENDER LOOP ───────────────────────────────────────────────────
var frameCount=0;
function draw(){
  requestAnimationFrame(draw);
  frameCount++;

  // Fix 3: guard against empty/incomplete state (first frames)
  if(!state||!state.visual) return;

  // Adaptive fps
  if(performance.now()-lastSignal > 3000 && hasSignal){
    document.getElementById('idle').style.opacity='0.5';
  }

  // Adaptive fps: 30fps when quiet
  var smear=(state.visual&&state.visual.smear)||0;
  var dom=state.phraseDom||0;
  var fps=(smear<0.15&&dom<0.15)?30:60;
  if(frameCount % Math.round(60/fps) !== 0) return;

  // Smooth inputs
  var intent=state.intent||0, conv=state.convMode||0;
  var vMix=state.voiceMix||0;
  var pDom=state.phraseDom||0;
  var turn=state.turnState||0;
  var aDom=state.aDom||0, bDom=state.bDom||0;
  var rms=state.rms||0;
  var vs=state.visual||{};
  var ec=(vs.energyCurveVal)||0;

  var targetHue=intent===1?190:intent===2?310:intent===3?260:210;
  sm.bgHue+=(targetHue-sm.bgHue)*0.04;
  sm.bgL+=((8+ec*10)-sm.bgL)*0.05;
  sm.dom+=(pDom-sm.dom)*0.06;

  // CLEAR
  ctx.fillStyle='hsl('+sm.bgHue.toFixed(0)+',40%,'+sm.bgL.toFixed(1)+'%)';
  ctx.fillRect(0,0,W,H);
  if(intent===4){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,0,W,H);}

  // ── DOMINANCE AURA (mid-layer) ──
  if(sm.dom>0.05){
    var sc=SCALE;
    var auraA=Math.min(0.25,sm.dom*0.3);
    var auraA2=Math.min(0.08,sm.dom*0.09);
    var inner=50*sc, outer=(200+sm.dom*200)*sc*(1+rms*0.15);
    var g=ctx.createRadialGradient(W/2,H/2,inner, W/2,H/2,outer);
    g.addColorStop(0,'rgba(255,180,80,'+auraA+')');
    g.addColorStop(0.7,'rgba(255,150,40,'+auraA2+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(sm.dom>0.65){
      var ba=(sm.dom-0.65)/0.35*0.18;
      ctx.fillStyle='rgba(255,140,0,'+ba+')';
      ctx.fillRect(0,0,W,H*0.12);
      ctx.fillRect(0,H*0.88,W,H*0.12);
    }
  }

  // ── FFT TEXTURE (background) ──
  var fft=state.fftBins;
  if(fft&&fft.length){
    var N=fft.length, baseY=H*0.82, tilt=(1-(vs.form||0))*55;
    var xOff=turn===1?-30:turn===2?30:0;
    ctx.globalAlpha=0.18+smear*0.07;
    ctx.beginPath();
    for(var i=0;i<N;i++){
      var t2=i/(N-1);
      var x2=t2*W+xOff, y2=baseY-fft[i]*(H*0.18)+t2*tilt;
      if(i===0)ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2);
    }
    ctx.strokeStyle='#9cf'; ctx.lineWidth=1; ctx.stroke();
    ctx.globalAlpha=1;
  }

  // ── VOICES ──
  var xA=W*0.3, xB=W*0.7, cy=H*0.5;
  var BASE_R=40*SCALE;
  var sizeA=BASE_R+aDom*50*SCALE+pDom*30*SCALE;
  var sizeB=BASE_R+bDom*50*SCALE+pDom*30*SCALE;
  var aAlpha=(1-vMix)*0.9+0.1, bAlpha=vMix*0.9+0.1;
  var focus=Math.max(aDom,bDom,pDom);
  var focusA=0.6+focus*0.4;

  // convMode offsets
  var oA=0, oB=0;
  if(conv===1){oA=(0.5-vMix)*80*SCALE; oB=(0.5-vMix)*80*SCALE;}
  if(conv===2){oA=(vMix-0.5)*120*SCALE; oB=(vMix-0.5)*120*SCALE;}
  sm.aOff+=(oA-sm.aOff)*0.08;
  sm.bOff+=(oB-sm.bOff)*0.08;

  var ghost=conv===3?0.45:1;

  ctx.globalAlpha=aAlpha*focusA;
  ctx.beginPath(); ctx.arc(xA+sm.aOff,cy,sizeA,0,Math.PI*2);
  ctx.fillStyle='rgba(120,220,255,0.85)'; ctx.fill();

  ctx.globalAlpha=bAlpha*ghost*focusA;
  ctx.beginPath(); ctx.arc(xB-sm.bOff,cy,sizeB,0,Math.PI*2);
  ctx.fillStyle='rgba(255,120,220,0.85)'; ctx.fill();

  if(conv===3){
    var gT=performance.now();
    var gOx=18*SCALE+Math.sin(gT*0.002)*6;
    var gOy=4+Math.cos(gT*0.0015)*4;
    ctx.globalAlpha=bAlpha*0.2;
    ctx.beginPath(); ctx.arc(xB-sm.bOff+gOx,cy+gOy,sizeB*0.85,0,Math.PI*2);
    ctx.fillStyle='rgba(153,68,255,0.7)'; ctx.fill();
  }
  ctx.globalAlpha=1;

  // OVERLAP line
  if(turn===3){
    var iEnv=0.6;
    ctx.beginPath(); ctx.moveTo(xA+sm.aOff,cy); ctx.lineTo(xB-sm.bOff,cy);
    ctx.strokeStyle='rgba(255,255,255,'+(0.15+iEnv*0.3)+')';
    ctx.lineWidth=1+Math.min(aDom,bDom)*4; ctx.stroke(); ctx.lineWidth=1;
  }

  // ── TEXT (focal) ──
  var txt=vs.text||'';
  if(txt){
    var wIdx=vs.wordIndex||0, emph=vs.emphasis||false;
    var words=txt.split(' ');
    var baseSize=Math.round(22*SCALE);
    var sc2=1+pDom*0.3; if(conv===2)sc2*=0.88;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='italic '+Math.round(baseSize*sc2)+'px "JetBrains Mono",monospace';
    // shadow for legibility
    ctx.shadowColor='rgba(0,0,0,0.65)';
    ctx.shadowBlur=8*SCALE; ctx.shadowOffsetY=1;
    // active word color: A→B interpolated
    var wR=Math.round(120+(255-120)*vMix),wG=Math.round(220+(120-220)*vMix),wBB=Math.round(255+(220-255)*vMix);
    var ac='rgb('+wR+','+wG+','+wBB+')';
    var textY=H*0.72-pDom*H*0.08;
    // DELAY ghost
    if(conv===3){
      ctx.globalAlpha=0.18; ctx.fillStyle='rgba(153,68,255,1)';
      ctx.fillText(txt,W/2+14,textY+5); ctx.globalAlpha=1;
    }
    // per-word
    var widths=[],totalW=0;
    words.forEach(function(w){var mw=ctx.measureText(w).width+5;widths.push(mw);totalW+=mw;});
    var curX=W/2-totalW/2;
    words.forEach(function(w,i){
      ctx.globalAlpha=i===wIdx?1:0.22;
      ctx.fillStyle=i===wIdx?(emph?'rgba(255,220,80,1)':ac):'rgba(255,255,255,1)';
      ctx.fillText(w,curX+widths[i]/2,textY); curX+=widths[i];
    });
    ctx.globalAlpha=1;
    ctx.shadowBlur=0; ctx.shadowColor='transparent';
    // progress bar
    var prog=vs.progress||0;
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,H-5,W,5);
    ctx.fillStyle=ac; ctx.globalAlpha=0.85;
    ctx.fillRect(0,H-5,W*prog,5); ctx.globalAlpha=1;
  }

  // ── MINIMAL OVERLAYS ──
  ctx.globalAlpha=0.35;
  ctx.font='10px "JetBrains Mono",monospace';
  ctx.textBaseline='alphabetic';
  var tLbls=['','A','B','A·B'][turn]||'';
  if(tLbls){ctx.fillStyle='rgba(200,200,200,1)';ctx.textAlign='left';ctx.fillText(tLbls,10,H-10);}
  if(sm.dom>0.5){ctx.fillStyle='rgba(255,165,40,1)';ctx.textAlign='right';ctx.fillText('MEM '+(sm.dom*100|0)+'%',W-10,14);}
  ctx.globalAlpha=1; ctx.textAlign='left';
}

draw();

// Fullscreen on tap/click — standard + webkit (iPad Safari)
document.addEventListener('click',function(){
  var el=document.documentElement;
  if(el.requestFullscreen)            el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});
</script>
</body>
</html>
